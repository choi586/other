<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>달려라! 스타 쿠키 서커스</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0018;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Jua', cursive;
    overflow: hidden;
  }

  #gameWrapper {
    position: relative;
    width: 800px;
    max-width: 100vw;
  }

  #gameTitle {
    text-align: center;
    color: #FFD700;
    font-size: 28px;
    letter-spacing: 2px;
    text-shadow: 0 0 20px #FF69B4, 0 0 40px #FF69B4;
    margin-bottom: 8px;
  }

  canvas {
    display: block;
    border-radius: 16px;
    box-shadow: 0 0 40px rgba(255, 105, 180, 0.5), 0 0 80px rgba(147, 51, 234, 0.3);
    border: 2px solid rgba(255, 215, 0, 0.4);
  }

  #ui {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    padding: 0 4px;
    color: #FFD700;
    font-size: 16px;
  }

  #controls {
    text-align: center;
    color: rgba(255,215,0,0.6);
    font-size: 13px;
    margin-top: 6px;
    font-family: 'Noto Sans KR', sans-serif;
  }
</style>
</head>
<body>

<div id="gameWrapper">
  <div id="gameTitle">✨ 달려라! 스타 쿠키 서커스 ✨</div>
  <canvas id="gameCanvas" width="800" height="360"></canvas>
  <div id="ui">
    <span id="scoreDisplay">⭐ 점수: 0</span>
    <span id="jelliesDisplay">🍬 젤리: 0</span>
    <span id="hpDisplay">❤️❤️❤️</span>
    <span id="speedDisplay">속도: 1.0x</span>
  </div>
  <div id="controls">스페이스 / ↑ : 점프 (2단 점프 가능) &nbsp;|&nbsp; ↓ : 슬라이드 &nbsp;|&nbsp; 게임오버 후 스페이스로 재시작</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ── 상수 ──────────────────────────────────────────
const W = canvas.width, H = canvas.height;
const GROUND_Y = H - 60;
const GRAVITY = 0.55;
const JUMP_FORCE = -13;
const INITIAL_SPEED = 4;

// ── 상태 ──────────────────────────────────────────
let state = 'title'; // title | playing | dead
let score = 0, jellies = 0, hp = 3;
let speed = INITIAL_SPEED;
let frame = 0;
let bgOffset1 = 0, bgOffset2 = 0, bgOffset3 = 0;
let stars = [];
let particles = [];
let shieldActive = false, shieldTimer = 0;
let boostActive = false, boostTimer = 0;
let magnetActive = false, magnetTimer = 0;
let invincible = false, invincibleTimer = 0;

// ── 캐릭터 ────────────────────────────────────────
const player = {
  x: 120, y: GROUND_Y, w: 44, h: 52,
  vy: 0, jumps: 0, maxJumps: 2,
  sliding: false, slideTimer: 0,
  animFrame: 0, animTimer: 0,
  reset() {
    this.y = GROUND_Y; this.vy = 0;
    this.jumps = 0; this.sliding = false;
    this.slideTimer = 0;
  }
};

// ── 펫 (스파클 볼) ─────────────────────────────────
const pet = { x: 80, y: GROUND_Y - 30, angle: 0 };

// ── 장애물 / 아이템 배열 ───────────────────────────
let obstacles = [];
let items = [];
let nextObstacle = 80, nextItem = 60;

// ── 별 생성 ───────────────────────────────────────
function initStars() {
  stars = [];
  for (let i = 0; i < 80; i++) {
    stars.push({ x: Math.random()*W, y: Math.random()*(H*0.65), r: Math.random()*1.8+0.4, t: Math.random()*Math.PI*2 });
  }
}
initStars();

// ── 파티클 ────────────────────────────────────────
function spawnParticles(x, y, color, n=6) {
  for (let i = 0; i < n; i++) {
    const angle = Math.random()*Math.PI*2;
    const spd = Math.random()*4+1;
    particles.push({ x, y, vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd-2, life: 30, maxLife: 30, color });
  }
}

// ── 키 입력 ───────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  if (!keys[e.code]) {
    keys[e.code] = true;
    if (state === 'playing') {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        if (player.jumps < player.maxJumps) {
          player.vy = JUMP_FORCE * (player.jumps === 1 ? 0.85 : 1);
          player.jumps++;
          player.sliding = false;
          spawnParticles(player.x + player.w/2, player.y + player.h, '#FFD700', 4);
        }
      }
      if (e.code === 'ArrowDown') {
        if (player.y >= GROUND_Y - 5) {
          player.sliding = true;
          player.slideTimer = 35;
        }
      }
    } else if (state === 'title' || state === 'dead') {
      if (e.code === 'Space') startGame();
    }
  }
  e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// ── 게임 시작 ─────────────────────────────────────
function startGame() {
  state = 'playing';
  score = 0; jellies = 0; hp = 3; speed = INITIAL_SPEED; frame = 0;
  obstacles = []; items = []; particles = [];
  nextObstacle = 100; nextItem = 80;
  shieldActive = false; boostActive = false; magnetActive = false;
  invincible = false; invincibleTimer = 0;
  player.reset();
  pet.x = 80; pet.y = GROUND_Y - 30;
  bgOffset1 = bgOffset2 = bgOffset3 = 0;
}

// ── 장애물 생성 ───────────────────────────────────
function spawnObstacle() {
  const r = Math.random();
  const spd = boostActive ? speed * 1.8 : speed;

  if (r < 0.35) {
    // 낮은 장애물 (점프)
    const h = 30 + Math.random()*25;
    obstacles.push({ x: W+10, y: GROUND_Y + 52 - h, w: 28, h, type: 'low', color: '#FF6B6B', spd });
  } else if (r < 0.6) {
    // 높은 장애물 (슬라이드)
    obstacles.push({ x: W+10, y: GROUND_Y - 10, w: 32, h: 28, type: 'high', color: '#C084FC', spd });
  } else if (r < 0.8) {
    // 지형 구멍 (발판)
    obstacles.push({ x: W+10, y: GROUND_Y + 52, w: 70 + Math.random()*30, h: 20, type: 'gap', color: '#000', spd });
  } else {
    // 복합
    const h = 28 + Math.random()*20;
    obstacles.push({ x: W+10, y: GROUND_Y + 52 - h, w: 26, h, type: 'low', color: '#FB923C', spd });
    obstacles.push({ x: W+60, y: GROUND_Y - 8, w: 30, h: 24, type: 'high', color: '#C084FC', spd });
  }

  const gap = 160 + Math.random()*120 - (speed-INITIAL_SPEED)*8;
  nextObstacle = Math.max(90, gap);
}

// ── 아이템 생성 ───────────────────────────────────
function spawnItem() {
  const r = Math.random();
  let type, color, symbol;
  if (r < 0.55) { type='jelly'; color='#FF69B4'; symbol='🍬'; }
  else if (r < 0.75) { type='star'; color='#FFD700'; symbol='⭐'; }
  else if (r < 0.85) { type='shield'; color='#60A5FA'; symbol='🛡️'; }
  else if (r < 0.93) { type='magnet'; color='#A78BFA'; symbol='🧲'; }
  else { type='boost'; color='#34D399'; symbol='⚡'; }

  const yPos = r < 0.55
    ? GROUND_Y + 20 - (Math.random() > 0.5 ? 50 : 0)
    : GROUND_Y - 10 - Math.random()*60;

  items.push({ x: W+10, y: yPos, w: 24, h: 24, type, color, symbol, spd: speed });
  nextItem = 60 + Math.random()*80;
}

// ── 충돌 판정 ─────────────────────────────────────
function rectsOverlap(a, b, margin=6) {
  return a.x+margin < b.x+b.w-margin &&
         a.x+a.w-margin > b.x+margin &&
         a.y+margin < b.y+b.h-margin &&
         a.y+a.h-margin > b.y+margin;
}

function getPlayerRect() {
  if (player.sliding) {
    return { x: player.x, y: player.y + player.h/2, w: player.w, h: player.h/2 };
  }
  return { x: player.x, y: player.y, w: player.w, h: player.h };
}

// ── 업데이트 ──────────────────────────────────────
function update() {
  if (state !== 'playing') return;
  frame++;

  // 속도 증가
  speed = INITIAL_SPEED + frame * 0.0018;
  if (boostActive) speed *= 1.0; // boost는 시각적 연출만

  // 배경 스크롤
  bgOffset1 = (bgOffset1 + speed * 0.12) % W;
  bgOffset2 = (bgOffset2 + speed * 0.3) % W;
  bgOffset3 = (bgOffset3 + speed * 0.7) % W;

  // 별 깜빡임
  stars.forEach(s => s.t += 0.04);

  // 플레이어 물리
  if (!player.sliding) {
    player.vy += GRAVITY;
    player.y += player.vy;
  }
  if (player.y >= GROUND_Y) {
    player.y = GROUND_Y; player.vy = 0; player.jumps = 0;
  }

  // 슬라이드 타이머
  if (player.sliding) {
    player.slideTimer--;
    if (player.slideTimer <= 0) player.sliding = false;
  }

  // 무적 타이머
  if (invincible) { invincibleTimer--; if (invincibleTimer <= 0) invincible = false; }
  if (shieldActive) { shieldTimer--; if (shieldTimer <= 0) shieldActive = false; }
  if (boostActive) { boostTimer--; if (boostTimer <= 0) boostActive = false; }
  if (magnetActive) { magnetTimer--; if (magnetTimer <= 0) magnetActive = false; }

  // 캐릭터 애니메이션
  player.animTimer++;
  if (player.animTimer > 6) { player.animFrame = (player.animFrame+1)%4; player.animTimer = 0; }

  // 펫 움직임
  pet.angle += 0.07;
  pet.x += (player.x - 44 - pet.x) * 0.1;
  pet.y += (player.y + player.h/2 - 28 + Math.sin(pet.angle)*18 - pet.y) * 0.1;

  // 장애물 스폰
  nextObstacle -= speed;
  if (nextObstacle <= 0) spawnObstacle();

  // 아이템 스폰
  nextItem -= speed;
  if (nextItem <= 0) spawnItem();

  // 장애물 업데이트 & 충돌
  const pr = getPlayerRect();
  obstacles = obstacles.filter(o => {
    o.x -= o.spd || speed;

    if (o.type === 'gap') {
      // 구멍: 플레이어가 구멍 위에 있으면 추락
      if (player.x + player.w > o.x && player.x < o.x + o.w && player.y >= GROUND_Y - 2 && player.vy >= 0) {
        // 플레이어 낙하
        if (!invincible) hitPlayer();
      }
      return o.x + o.w > -20;
    }

    if (rectsOverlap(pr, o)) {
      if (!invincible && !shieldActive) {
        hitPlayer();
      } else if (shieldActive) {
        shieldActive = false;
        spawnParticles(player.x+player.w/2, player.y+player.h/2, '#60A5FA', 10);
        return false;
      }
    }
    return o.x + o.w > -20;
  });

  // 아이템 업데이트 & 수집
  items = items.filter(it => {
    it.x -= it.spd || speed;

    // 자석 효과
    if (magnetActive && it.type === 'jelly') {
      const dx = player.x - it.x, dy = player.y - it.y;
      const dist = Math.sqrt(dx*dx+dy*dy);
      if (dist < 180) { it.x += dx*0.12; it.y += dy*0.12; }
    }

    if (rectsOverlap(pr, it, 2)) {
      collectItem(it);
      return false;
    }
    return it.x + it.w > -20;
  });

  // 파티클
  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--;
    return p.life > 0;
  });

  // 점수
  score += Math.floor(speed * 0.15);

  updateUI();
}

function hitPlayer() {
  if (invincible) return;
  hp--;
  spawnParticles(player.x+player.w/2, player.y+player.h/2, '#FF4444', 12);
  invincible = true; invincibleTimer = 80;
  if (hp <= 0) { state = 'dead'; }
}

function collectItem(it) {
  spawnParticles(it.x+it.w/2, it.y+it.h/2, it.color, 8);
  if (it.type === 'jelly') { jellies++; score += 50; }
  else if (it.type === 'star') { score += 200; }
  else if (it.type === 'shield') { shieldActive = true; shieldTimer = 300; }
  else if (it.type === 'magnet') { magnetActive = true; magnetTimer = 400; }
  else if (it.type === 'boost') { boostActive = true; boostTimer = 200; }
}

function updateUI() {
  document.getElementById('scoreDisplay').textContent = `⭐ 점수: ${score}`;
  document.getElementById('jelliesDisplay').textContent = `🍬 젤리: ${jellies}`;
  document.getElementById('hpDisplay').textContent = '❤️'.repeat(hp) + '🖤'.repeat(3-hp);
  document.getElementById('speedDisplay').textContent = `속도: ${speed.toFixed(1)}x`;
}

// ── 그리기 ────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);

  if (state === 'title') { drawTitle(); return; }

  drawBG();
  drawGround();
  drawObstacles();
  drawItems();
  drawParticles();
  drawPet();
  drawPlayer();
  drawActiveEffects();

  if (state === 'dead') drawGameOver();
}

function drawBG() {
  // 밤하늘 그라디언트
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0a0028');
  grad.addColorStop(0.6, '#1a0040');
  grad.addColorStop(1, '#2d0060');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // 별
  stars.forEach(s => {
    const alpha = 0.5 + 0.5*Math.sin(s.t);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.beginPath(); ctx.arc(s.x - bgOffset1*0.05, s.y, s.r, 0, Math.PI*2); ctx.fill();
  });

  // 먼 배경: 관객석 실루엣
  ctx.fillStyle = 'rgba(60,0,100,0.5)';
  for (let i = 0; i < 12; i++) {
    const x = ((i*80 - bgOffset1*0.2) % (W+80) + W+80) % (W+80) - 40;
    ctx.beginPath();
    ctx.arc(x, H*0.72, 22, Math.PI, 0);
    ctx.fill();
  }

  // 중간 배경: 서커스 천막 기둥
  ctx.fillStyle = 'rgba(180,0,100,0.25)';
  for (let i = 0; i < 5; i++) {
    const x = ((i*200 - bgOffset2*0.3) % (W+200) + W+200) % (W+200) - 60;
    ctx.fillRect(x, H*0.4, 14, H*0.35);
    // 천막 삼각형
    ctx.beginPath();
    ctx.moveTo(x-20, H*0.4); ctx.lineTo(x+7, H*0.25); ctx.lineTo(x+34, H*0.4);
    ctx.closePath(); ctx.fill();
  }

  // 조명 효과
  if (boostActive) {
    ctx.fillStyle = 'rgba(52,211,153,0.08)';
    ctx.fillRect(0, 0, W, H);
  }
}

function drawGround() {
  // 무대 바닥
  const gGrad = ctx.createLinearGradient(0, GROUND_Y+52, 0, H);
  gGrad.addColorStop(0, '#4a1080');
  gGrad.addColorStop(1, '#1a0040');
  ctx.fillStyle = gGrad;
  ctx.fillRect(0, GROUND_Y+52, W, H - (GROUND_Y+52));

  // 무대 상단 라인
  ctx.strokeStyle = '#FFD700';
  ctx.lineWidth = 3;
  ctx.shadowColor = '#FFD700';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y+52); ctx.lineTo(W, GROUND_Y+52);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // 무대 패턴 (가로줄)
  ctx.strokeStyle = 'rgba(255,215,0,0.08)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    const x = ((i*140 - bgOffset3) % (W+140) + W+140) % (W+140) - 20;
    ctx.beginPath(); ctx.moveTo(x, GROUND_Y+52); ctx.lineTo(x+80, H); ctx.stroke();
  }
  ctx.lineWidth = 1;
}

function drawObstacles() {
  obstacles.forEach(o => {
    if (o.type === 'gap') {
      // 구멍은 그리지 않음 (지면이 없는 것처럼)
      ctx.fillStyle = '#0a0018';
      ctx.fillRect(o.x, GROUND_Y+52, o.w, 40);
      // 구멍 테두리
      ctx.strokeStyle = 'rgba(200,0,50,0.5)';
      ctx.lineWidth = 2;
      ctx.strokeRect(o.x, GROUND_Y+52, o.w, 40);
      return;
    }

    // 그림자
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(o.x+4, o.y+4, o.w, o.h);

    if (o.type === 'low') {
      // 불꽃 링 / 상자
      const grad = ctx.createLinearGradient(o.x, o.y, o.x, o.y+o.h);
      grad.addColorStop(0, '#FF6B6B'); grad.addColorStop(1, '#FF9500');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(o.x, o.y, o.w, o.h, 5);
      ctx.fill();
      ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 2;
      ctx.stroke();
      // 불꽃 장식
      ctx.fillStyle = '#FFD700';
      ctx.font = `${o.h > 35 ? 20 : 14}px serif`;
      ctx.fillText('🔥', o.x+2, o.y+o.h-4);
    } else if (o.type === 'high') {
      // 공중 장애물
      ctx.fillStyle = '#C084FC';
      ctx.beginPath();
      ctx.ellipse(o.x+o.w/2, o.y+o.h/2, o.w/2, o.h/2, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#A855F7'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#FFD700';
      ctx.font = '16px serif';
      ctx.fillText('💫', o.x+2, o.y+o.h-2);
      // 매달린 줄
      ctx.strokeStyle = 'rgba(200,150,255,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(o.x+o.w/2, o.y); ctx.lineTo(o.x+o.w/2, o.y-20); ctx.stroke();
    }
  });
}

function drawItems() {
  items.forEach(it => {
    ctx.save();
    ctx.font = '22px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // 위아래 흔들림
    const bob = Math.sin(frame*0.1 + it.x*0.05)*4;
    ctx.fillText(it.symbol, it.x+it.w/2, it.y+it.h/2+bob);
    // 글로우
    ctx.shadowColor = it.color; ctx.shadowBlur = 12;
    ctx.fillText(it.symbol, it.x+it.w/2, it.y+it.h/2+bob);
    ctx.restore();
  });
}

function drawParticles() {
  particles.forEach(p => {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, 4*alpha, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawPet() {
  // 스파클 볼
  const glow = ctx.createRadialGradient(pet.x, pet.y, 2, pet.x, pet.y, 14);
  glow.addColorStop(0, 'rgba(255,255,255,0.9)');
  glow.addColorStop(0.5, 'rgba(255,220,100,0.6)');
  glow.addColorStop(1, 'rgba(255,150,50,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(pet.x, pet.y, 14, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#FFF9C4';
  ctx.beginPath(); ctx.arc(pet.x, pet.y, 7, 0, Math.PI*2); ctx.fill();

  // 별 장식
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  for (let i = 0; i < 3; i++) {
    const a = pet.angle + i*(Math.PI*2/3);
    ctx.beginPath(); ctx.arc(pet.x+Math.cos(a)*11, pet.y+Math.sin(a)*11, 2, 0, Math.PI*2); ctx.fill();
  }
}

function drawPlayer() {
  const px = player.x, py = player.y;
  const pw = player.w, ph = player.sliding ? player.h/2 : player.h;
  const drawY = player.sliding ? py + player.h/2 : py;

  // 무적 깜빡임
  if (invincible && Math.floor(invincibleTimer/6)%2 === 0) return;

  ctx.save();

  // 쉴드 효과
  if (shieldActive) {
    ctx.strokeStyle = '#60A5FA';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#60A5FA'; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.ellipse(px+pw/2, drawY+ph/2, pw/2+10, ph/2+10, 0, 0, Math.PI*2); ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // 몸통 (쿠키 느낌)
  const bodyGrad = ctx.createLinearGradient(px, drawY, px+pw, drawY+ph);
  bodyGrad.addColorStop(0, '#FFE4B5');
  bodyGrad.addColorStop(1, '#DEB887');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath(); ctx.roundRect(px+2, drawY+14, pw-4, ph-14, 8); ctx.fill();

  // 머리
  ctx.fillStyle = '#FFDEAD';
  ctx.beginPath(); ctx.arc(px+pw/2, drawY+12, 16, 0, Math.PI*2); ctx.fill();

  // 별 모자
  if (!player.sliding) {
    ctx.fillStyle = '#FFD700';
    ctx.font = '18px serif';
    ctx.textAlign = 'center';
    ctx.fillText('⭐', px+pw/2, drawY+2);
  }

  // 눈
  ctx.fillStyle = '#333';
  ctx.beginPath(); ctx.arc(px+pw/2-5, drawY+10, 3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(px+pw/2+5, drawY+10, 3, 0, Math.PI*2); ctx.fill();
  // 눈 반짝이
  ctx.fillStyle = 'white';
  ctx.beginPath(); ctx.arc(px+pw/2-4, drawY+9, 1, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(px+pw/2+6, drawY+9, 1, 0, Math.PI*2); ctx.fill();

  // 볼터치
  ctx.fillStyle = 'rgba(255,150,150,0.5)';
  ctx.beginPath(); ctx.ellipse(px+pw/2-10, drawY+14, 5, 3, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(px+pw/2+10, drawY+14, 5, 3, 0, 0, Math.PI*2); ctx.fill();

  if (!player.sliding) {
    // 다리 애니메이션
    const legOffsets = [[0,-8],[4,-4],[0,0],[-4,-4]];
    const lo = legOffsets[player.animFrame];
    ctx.fillStyle = '#DEB887';
    ctx.fillRect(px+8, drawY+ph-16, 10, 16+lo[0]);
    ctx.fillRect(px+pw-18, drawY+ph-16, 10, 16+lo[1]|0);
    // 신발
    ctx.fillStyle = '#FF69B4';
    ctx.fillRect(px+6, drawY+ph-4, 14, 6);
    ctx.fillRect(px+pw-20, drawY+ph-4, 14, 6);
  } else {
    // 슬라이드 자세 - 발 앞으로
    ctx.fillStyle = '#DEB887';
    ctx.fillRect(px+pw-16, drawY+ph-10, 20, 10);
    ctx.fillStyle = '#FF69B4';
    ctx.fillRect(px+pw-14, drawY+ph-4, 18, 6);
  }

  // 부스트 이펙트
  if (boostActive) {
    ctx.fillStyle = 'rgba(52,211,153,0.4)';
    for (let i = 1; i <= 3; i++) {
      ctx.beginPath(); ctx.ellipse(px-i*14, drawY+ph/2, 8-i, (ph/2-i*2), 0, 0, Math.PI*2); ctx.fill();
    }
  }

  ctx.restore();
}

function drawActiveEffects() {
  // 효과 아이콘 표시
  let ix = 10;
  if (shieldActive) { ctx.font='20px serif'; ctx.fillText('🛡️', ix, 24); ix+=30; }
  if (magnetActive) { ctx.font='20px serif'; ctx.fillText('🧲', ix, 24); ix+=30; }
  if (boostActive)  { ctx.font='20px serif'; ctx.fillText('⚡', ix, 24); }
}

function drawTitle() {
  // 배경
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0a0028'); grad.addColorStop(1, '#2d0060');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

  // 별
  stars.forEach(s => {
    const alpha = 0.5 + 0.5*Math.sin(s.t + frame*0.02);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  });

  // 타이틀
  ctx.textAlign = 'center';
  ctx.shadowColor = '#FF69B4'; ctx.shadowBlur = 30;
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 42px Jua, cursive';
  ctx.fillText('✨ 달려라! 스타 쿠키 서커스 ✨', W/2, H*0.3);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#FFF';
  ctx.font = '22px Jua, cursive';
  ctx.fillText('점프와 슬라이드로 서커스 무대를 질주하라!', W/2, H*0.45);

  // 조작 안내
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = '17px Noto Sans KR, sans-serif';
  ctx.fillText('↑ / 스페이스: 점프 (2단 가능)   ↓: 슬라이드', W/2, H*0.58);

  // 아이템 안내
  ctx.font = '16px serif';
  ctx.fillText('🍬 젤리(+50)  ⭐ 별(+200)  🛡️ 보호막  🧲 자석  ⚡ 부스터', W/2, H*0.68);

  // 시작 버튼
  const pulse = 0.8 + 0.2*Math.sin(frame*0.08);
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 26px Jua, cursive';
  ctx.fillText('[ 스페이스바를 눌러 시작 ]', W/2, H*0.82);
  ctx.globalAlpha = 1;

  ctx.textAlign = 'left';
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#FF6B6B';
  ctx.font = 'bold 52px Jua, cursive';
  ctx.shadowColor = '#FF0000'; ctx.shadowBlur = 20;
  ctx.fillText('GAME OVER', W/2, H*0.38);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#FFD700';
  ctx.font = '28px Jua, cursive';
  ctx.fillText(`최종 점수: ${score}점`, W/2, H*0.52);
  ctx.fillText(`젤리 획득: ${jellies}개`, W/2, H*0.62);

  const pulse = 0.7 + 0.3*Math.sin(frame*0.1);
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#FFF';
  ctx.font = '22px Jua, cursive';
  ctx.fillText('[ 스페이스바로 다시 도전! ]', W/2, H*0.78);
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

// ── 메인 루프 ─────────────────────────────────────
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
