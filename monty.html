<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🚪 몬티홀 딜레마 – 전략 선택형</title>
  <style>
    :root{
      --bg:#f9fafb;
      --panel:#ffffff;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --accent:#2563eb;
      --good:#16a34a;
      --bad:#dc2626;
      --yellow:#facc15;
      --border:#d1d5db;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, Apple SD Gothic Neo, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background: linear-gradient(180deg,#ffffff,#f3f4f6);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      line-height:1.5;
    }
    header{ padding:24px 16px 8px; text-align:center; }
    h1{ margin:0 0 4px; font-size: clamp(20px, 3.2vw, 28px); letter-spacing:0.2px; color:#111827; }
    .sub{color:var(--muted); font-size:14px}

    .wrap{
      max-width:1000px; margin:0 auto; padding:16px;
      display:grid; gap:16px;
      grid-template-columns: 1.1fr 1fr;
    }
    @media (max-width: 900px){ .wrap{ grid-template-columns: 1fr; } }

    .card{
      background: var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      padding:16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
    }

    .row{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
    .label{color:var(--muted); font-size:13px}

    select, input[type="number"], input[type="range"]{
      background: #ffffff;
      border:1px solid var(--border);
      color:var(--text);
      padding:8px 10px;
      border-radius:10px;
      outline:none;
    }
    input[type="range"]{ width:220px; }

    .btn{
      background:#f3f4f6;
      border:1px solid var(--border);
      color:var(--text);
      padding:9px 12px;
      border-radius:12px;
      cursor:pointer;
      transition: transform .02s ease, background .15s ease;
      user-select:none;
    }
    .btn:hover{ background:#e5e7eb }
    .btn:active{ transform:scale(0.98) }
    .btn.primary{ background:#2563eb; color:#fff; border-color:#2563eb }
    .btn.success{ background:#16a34a; color:#fff; border-color:#16a34a }
    .btn.warn{ background:#fef3c7; color:#92400e; border-color:#fcd34d }

    .stat-grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap:12px; }
    @media (max-width: 520px){ .stat-grid{ grid-template-columns: 1fr; } }
    .stat{ background: var(--card); border:1px solid var(--border); border-radius:14px; padding:12px 14px; }
    .stat h3{ margin:2px 0 6px; font-size:15px; color:var(--muted) }
    .stat .big{ font-size:22px; font-weight:700; letter-spacing:0.3px }
    .mono{ font-variant-numeric: tabular-nums; font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace }

    .pill{
      display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px;
      border:1px solid var(--border); background:#f9fafb; color:var(--muted);
    }

    canvas{ width:100%; height:260px; background:#f9fafb; border:1px solid var(--border); border-radius:12px }

    .doors{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; padding:6px 0 2px }
    .door{
      width:120px; aspect-ratio: 3/5; border-radius:10px; position:relative;
      background: linear-gradient(180deg, #ffffff, #e5e7eb);
      border:1px solid #d1d5db; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04);
    }
    .door .knob{
      position:absolute; right:12px; top:50%; width:12px; height:12px; background:#d97706; border-radius:50%;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.7);
    }
    .door .tag{
      position:absolute; left:8px; top:8px; font-size:12px; padding:2px 6px; border-radius:8px;
      background:#f9fafb; border:1px solid var(--border); color:var(--muted);
    }

    .legend{ display:flex; gap:8px; flex-wrap:wrap; font-size:12px; color:var(--muted) }
    .legend .dot{ width:10px; height:10px; border-radius:3px; display:inline-block; margin-right:6px }
    .dot.stay{ background:var(--yellow) }
    .dot.switch{ background:var(--accent) }

    .kpis{ display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; margin-top:8px }
    @media (max-width:700px){ .kpis{ grid-template-columns: repeat(2, 1fr);} }
    .kpi{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px 12px }
    .kpi .ttl{ color:var(--muted); font-size:12px }
    .kpi .val{ font-size:18px; font-weight:700 }

    .sep{ height:1px; background:linear-gradient(90deg, transparent, #e5e7eb, transparent); margin:10px 0 }
    footer{ text-align:center; color:var(--muted); font-size:12px; padding:16px }
    .note{ color:var(--muted); font-size:13px }

    .progress{ height:8px; border-radius:999px; background:#f3f4f6; border:1px solid var(--border); overflow:hidden }
    .bar{ height:100%; width:0%; background:linear-gradient(90deg, #93c5fd, #2563eb) }
  </style>
</head>
<body>
  <header>
    <h1>🚪 몬티홀 딜레마 – 전략 선택형</h1>
    <div class="sub"></div>
  </header>

  <main class="wrap">
    <!-- Left: Controls & Doors -->
    <section class="card">
      <div class="row" style="justify-content:space-between; align-items:flex-end">
        <div>
          <div class="label">전략 선택</div>
          <select id="strategy">
            <option>바꾸지 않는다 (Stay)</option>
            <option selected>바꾼다 (Switch)</option>
          </select>
        </div>
        <div>
          <div class="label">실행 횟수 (이번)</div>
          <div class="row">
            <input id="nRuns" type="range" min="1" max="200" value="10" />
            <input id="nRunsNum" type="number" min="1" max="200" value="10" style="width:80px" />
          </div>
        </div>
        <div>
          <div class="label">애니메이션 속도</div>
          <select id="speed">
            <option>빠름</option>
            <option selected>보통</option>
            <option>느림</option>
          </select>
        </div>
      </div>

      <div class="row" style="margin-top:10px">
        <button class="btn" id="btn1">➕ 1회 실행</button>
        <button class="btn" id="btn10">➕ 10회</button>
        <button class="btn" id="btn100">➕ 100회</button>
        <button class="btn primary" id="btnRun">▶︎ N회 실행</button>
        <button class="btn warn" id="btnReset">↺ 리셋</button>
      </div>

      <div class="sep"></div>
      <div class="label">문 구성 (3개 중 자동차는 1개)</div>
      <div class="doors" id="doors"></div>
      <div class="note">한 번 실행할 때마다, 플레이어는 임의의 문을 먼저 선택하고, 진행자가 염소가 있는 문 하나를 열어 보여준 뒤, 전략에 따라 그대로 가거나 바꿉니다.</div>
    </section>

    <!-- Right: Stats & Chart -->
    <section class="card">
      <div class="legend">
        <div><span class="dot stay"></span>Stay 승률</div>
        <div><span class="dot switch"></span>Switch 승률</div>
        <span class="pill mono" id="limitTag">최대 10,000회/전략</span>
      </div>

      <div class="kpis">
        <div class="kpi"><div class="ttl">Stay 승</div><div class="val mono" id="stayWin">0</div></div>
        <div class="kpi"><div class="ttl">Stay 패</div><div class="val mono" id="stayLose">0</div></div>
        <div class="kpi"><div class="ttl">Switch 승</div><div class="val mono" id="switchWin">0</div></div>
        <div class="kpi"><div class="ttl">Switch 패</div><div class="val mono" id="switchLose">0</div></div>
      </div>

      <div class="stat-grid" style="margin-top:10px">
        <div class="stat">
          <h3>승률(%)</h3>
          <div class="big mono" id="stayRate">Stay: 0.00%</div>
          <div class="big mono" id="switchRate">Switch: 0.00%</div>
        </div>
        <div class="stat">
          <h3>누적 실행 수</h3>
          <div class="big mono" id="trialsStay">Stay: 0</div>
          <div class="big mono" id="trialsSwitch">Switch: 0</div>
        </div>
      </div>

      <div style="margin-top:12px" class="label">승률 차트</div>
      <canvas id="chart" width="600" height="260" aria-label="승률 차트"></canvas>
      <div class="progress" style="margin-top:10px"><div class="bar" id="prog"></div></div>
    </section>
  </main>

  <footer>

  </footer>

  <script>
    // -------------------- 상태 --------------------
    const MAX_TRIALS = 10000;
    let stayWin=0, stayLose=0, switchWin=0, switchLose=0;
    let trialsStay=0, trialsSwitch=0;

    const el = (id)=>document.getElementById(id);
    const fmt = (n)=>n.toLocaleString('ko-KR');
    const pct = (a,b)=> b>0 ? (a*100/b).toFixed(2) : "0.00";

    // -------------------- 문 그리기 --------------------
    const doorsWrap = el('doors');
    function drawDoors(car=-1, opened=-1, picked=-1){
      doorsWrap.innerHTML='';
      for(let i=0;i<3;i++){
        const d=document.createElement('div');
        d.className='door';
        const tag=document.createElement('div');
        tag.className='tag'; tag.textContent=`문 ${i+1}`;
        const knob=document.createElement('div'); knob.className='knob';
        d.appendChild(tag); d.appendChild(knob);
        if(i===car){ d.style.outline='2px solid var(--good)'; }
        if(i===opened){ d.style.filter='grayscale(1) brightness(0.85)'; d.style.opacity='0.8'; }
        if(i===picked){ d.style.boxShadow='0 0 0 3px #93c5fd, inset 0 0 0 1px rgba(0,0,0,0.06)'; }
        doorsWrap.appendChild(d);
      }
    }
    drawDoors();

    // -------------------- 시뮬레이션 한 번 --------------------
    function stepOnce(strategy){
      // 1) 자동차 배치 & 초기 선택
      const car = Math.floor(Math.random()*3);
      let pick = Math.floor(Math.random()*3);

      // 2) 진행자가 염소 있는 문 하나 공개 (pick과 car가 아닌 문)
      let open;
      do { open = Math.floor(Math.random()*3); } while(open===car || open===pick);

      // 3) 전략에 따라 최종 선택
      let finalPick = pick;
      if(strategy.startsWith('바꾼다')){
        for(let i=0;i<3;i++) if(i!==pick && i!==open) finalPick = i;
      }

      // 4) 승패 판정 및 카운트
      const win = (finalPick===car);
      if(strategy.startsWith('바꾸지')){
        trialsStay++;
        if(win) stayWin++; else stayLose++;
      }else{
        trialsSwitch++;
        if(win) switchWin++; else switchLose++;
      }
      return {car, pick, open, finalPick, win};
    }

    // -------------------- 통계 갱신 --------------------
    function drawStats(){
      el('stayWin').textContent = fmt(stayWin);
      el('stayLose').textContent = fmt(stayLose);
      el('switchWin').textContent = fmt(switchWin);
      el('switchLose').textContent = fmt(switchLose);
      el('trialsStay').textContent = `Stay: ${fmt(trialsStay)}`;
      el('trialsSwitch').textContent = `Switch: ${fmt(trialsSwitch)}`;
      const stayRate = pct(stayWin, stayWin+stayLose);
      const switchRate = pct(switchWin, switchWin+switchLose);
      el('stayRate').textContent = `Stay: ${stayRate}%`;
      el('switchRate').textContent = `Switch: ${switchRate}%`;
      drawChart(stayRate, switchRate);
      const p = Math.min(100, (Math.max(trialsStay, trialsSwitch)/MAX_TRIALS)*100);
      el('prog').style.width = p + '%';
    }

    // -------------------- 차트 (캔버스) --------------------
    const ctx = el('chart').getContext('2d');
    function drawChart(stayRate, switchRate){
      const W = ctx.canvas.width, H = ctx.canvas.height;
      ctx.clearRect(0,0,W,H);
      // axes
      ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(40, 10); ctx.lineTo(40, H-28); ctx.lineTo(W-10, H-28); ctx.stroke();
      // y ticks 0,20,40,60,80,100
      ctx.fillStyle = '#6b7280'; ctx.font = '12px ui-sans-serif';
      for(let t=0;t<=100;t+=20){
        const y = map(t, 0,100, H-28, 18);
        ctx.fillText(String(t), 10, y+4);
        ctx.globalAlpha = 0.25;
        ctx.strokeStyle = '#e5e7eb';
        ctx.beginPath(); ctx.moveTo(40, y); ctx.lineTo(W-10, y); ctx.stroke();
        ctx.globalAlpha = 1.0;
      }
      // bars
      const x1=120, x2=260; const bw=80;
      drawBar(x1, stayRate, '#facc15'); // yellow
      drawBar(x2, switchRate, '#2563eb'); // blue
      // labels
      ctx.fillStyle='#6b7280';
      ctx.fillText('Stay', x1 + bw/2 - 12, H-8);
      ctx.fillText('Switch', x2 + bw/2 - 18, H-8);
    }
    function map(v,a,b,c,d){ return c + (v-a)*(d-c)/(b-a); }
    function drawBar(xCenter, valPct, color){
      const W = 60, HbarMax = (ctx.canvas.height-46);
      const h = HbarMax * (valPct/100);
      const x = xCenter - W/2, y = (ctx.canvas.height-28) - h;
      // bg
      ctx.fillStyle = '#eef2f7';
      roundRect(ctx, x, (ctx.canvas.height-28)-HbarMax, W, HbarMax, 8); ctx.fill();
      // bar
      ctx.fillStyle = color;
      roundRect(ctx, x, y, W, h, 8); ctx.fill();
      // value text
      ctx.fillStyle = '#111827'; ctx.font='bold 13px ui-sans-serif';
      ctx.fillText(valPct + '%', x + 8, y - 6);
    }
    function roundRect(ctx, x, y, w, h, r){
      ctx.beginPath();
      ctx.moveTo(x+r, y);
      ctx.arcTo(x+w, y, x+w, y+h, r);
      ctx.arcTo(x+w, y+h, x, y+h, r);
      ctx.arcTo(x, y+h, x, y, r);
      ctx.arcTo(x, y, x+w, y, r);
      ctx.closePath();
    }

    // -------------------- 실행 제어 --------------------
    const selStrategy = el('strategy');
    const rng = el('nRuns');
    const num = el('nRunsNum');
    const btn1 = el('btn1'), btn10 = el('btn10'), btn100 = el('btn100'), btnRun = el('btnRun'), btnReset = el('btnReset');
    const speedSel = el('speed');

    rng.addEventListener('input', ()=>{ num.value = rng.value; });
    num.addEventListener('input', ()=>{
      let v = Number(num.value||1); v = Math.max(1, Math.min(200, v)); num.value=v; rng.value=v;
    });

    function delayMs(){
      const v = speedSel.value;
      return v==='빠름'? 0 : (v==='보통'? 50 : 350);
    }

    function capLeft(strategy){
      return (strategy.startsWith('바꾸지')? (MAX_TRIALS - trialsStay) : (MAX_TRIALS - trialsSwitch));
    }

    function disableAll(dis){
      [btn1,btn10,btn100,btnRun,btnReset,selStrategy,rng,num,speedSel].forEach(b=>b.disabled=dis);
    }

    btn1.addEventListener('click', async ()=> runN(1));
    btn10.addEventListener('click', async ()=> runN(10));
    btn100.addEventListener('click', async ()=> runN(100));
    btnRun.addEventListener('click', async ()=> runN(Number(num.value||10)));
    btnReset.addEventListener('click', ()=>{
      stayWin=stayLose=switchWin=switchLose=trialsStay=trialsSwitch=0;
      drawStats(); drawDoors();
    });

    async function runN(n){
      const strategy = selStrategy.value;
      let todo = Math.min(n, capLeft(strategy));
      if(todo<=0){ alert('해당 전략은 10,000회에 도달했습니다. 리셋 후 다시 실행하세요.'); return; }
      disableAll(true);
      const d = delayMs();
      for(let i=0;i<todo;i++){
        const {car,pick,open,finalPick,win} = stepOnce(strategy);
        drawDoors(car, open, finalPick);
        drawStats();
        if(d>0){ await new Promise(r=>setTimeout(r, d)); }
      }
      disableAll(false);
    }

    // Init
    drawStats();
    // HiDPI canvas fix
    (function fitCanvasDPI(){
      const c = el('chart'); const r = window.devicePixelRatio||1;
      const w = c.clientWidth, h = c.clientHeight;
      c.width = Math.round(w*r); c.height = Math.round(h*r);
      c.style.width = w+'px'; c.style.height = h+'px';
      ctx.scale(r,r);
      drawChart(0,0);
    })();
    window.addEventListener('resize', ()=>{
      const c = el('chart'); const r = window.devicePixelRatio||1;
      const w = c.clientWidth, h = c.clientHeight;
      c.width = Math.round(w*r); c.height = Math.round(h*r);
      ctx.setTransform(r,0,0,r,0,0);
      drawStats();
    });
  </script>
</body>
</html>
