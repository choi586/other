<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff6dd">
<title>MOLE DUEL · 2인 두더지 잡기</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
:root{font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#292c43;background:#fff6dd}
body{margin:0;overflow:hidden;height:100vh;height:100dvh}button{font:inherit;cursor:pointer;border:0}button:focus-visible{outline:5px solid #292c43;outline-offset:5px}
.app{height:100%;display:flex;flex-direction:column;padding: max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));gap:12px}
.topbar{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:104px;padding:0 22px}.brand{font-size:clamp(20px,2.4vw,36px);font-weight:950;letter-spacing:-1.5px}.brand span{color:#f17a37}.brand small{display:block;font-size:12px;letter-spacing:2px;margin-top:7px;color:#7f7969}.timer{text-align:center;min-width:130px;background:#fff;border:3px solid #292c43;border-radius:24px;padding:8px 25px;box-shadow:0 5px 0 #292c43}.timer small{display:block;font-weight:800;font-size:12px;letter-spacing:2px}.timer strong{font-size:clamp(38px,4vw,60px);font-variant-numeric:tabular-nums;line-height:1}.timer.urgent{color:#df403b;background:#fff0e8}.tools{justify-self:end}.fullscreen{background:#fff;border:2px solid #ded6bf;border-radius:16px;min-width:60px;min-height:56px;padding:12px 18px;font-weight:800;font-size:16px}
.arena{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:16px;position:relative}.player{--accent:#2868e8;--soft:#e8f4ff;--ground:#aad8f5;background:var(--soft);border:3px solid var(--accent);border-radius:30px;display:flex;flex-direction:column;overflow:hidden;position:relative}.player.p2{--accent:#ed6341;--soft:#fff0dd;--ground:#ffcc8d}.player-head{display:flex;justify-content:space-between;align-items:center;padding:18px 28px 8px;color:var(--accent);gap:12px}.name{font-size:clamp(20px,2.8vw,42px);font-weight:950;letter-spacing:-1px}.name small{display:block;font-size:clamp(12px,1vw,16px);letter-spacing:0;color:#72798a;margin-top:5px}.scorebox{display:flex;align-items:baseline;gap:9px;background:#fff;border-radius:20px;padding:5px 20px;box-shadow:0 4px 0 #0000000c}.score{font-size:clamp(40px,5vw,74px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}.scorebox small{font-size:16px;font-weight:800}.field{flex:1;min-height:0;padding:8px 24px 22px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:clamp(6px,1.5vh,20px);background:radial-gradient(ellipse at 50% 110%,var(--ground),transparent 75%)}
.hole{position:relative;display:block;width:100%;height:100%;min-height:0;background:transparent;border-radius:25%;isolation:isolate}.hole::after{content:'';position:absolute;z-index:3;left:5%;right:5%;height:34%;bottom:2%;border-radius:50%;border-bottom:clamp(5px,.8vh,10px) solid #a27652;pointer-events:none}.pit{position:absolute;left:5%;right:5%;bottom:2%;height:34%;border-radius:50%;background:#583e3a;box-shadow:inset 0 8px 0 #352a32,0 5px 0 #ffffff80}.mole{position:absolute;left:16%;right:16%;bottom:10%;height:82%;max-height:180px;border-radius:48% 48% 35% 35%;background:#b97c50;border:clamp(2px,.3vw,4px) solid #744b39;box-shadow:inset -9px -4px 0 #9b623f;z-index:2;opacity:0;transform:translateY(26%) scale(.7);transition:transform .12s ease-out,opacity .1s;pointer-events:none}.hole.active .mole{opacity:1;transform:translateY(0) scale(1)}.ear{position:absolute;width:27%;height:29%;top:6%;background:#b97c50;border:3px solid #744b39;border-radius:50%;z-index:-1}.ear.left{left:-12%}.ear.right{right:-12%}.ear::after{content:'';position:absolute;inset:23%;border-radius:50%;background:#ecad97}.face{position:absolute;inset:0}.eyes{position:absolute;top:32%;left:25%;width:10%;height:14%;border-radius:50%;background:#292c43;box-shadow:calc(var(--eye-gap, 1px)) 0 transparent}.eyes.right{left:auto;right:25%}.eyes::after{content:'';position:absolute;width:35%;height:35%;background:#fff;left:20%;top:12%;border-radius:50%}.muzzle{position:absolute;width:58%;height:40%;left:21%;bottom:13%;border-radius:50%;background:#ffdbad}.nose{position:absolute;width:24%;height:25%;top:2%;left:38%;border-radius:40% 40% 55% 55%;background:#43323c}.smile{position:absolute;width:32%;height:28%;top:27%;left:34%;border-bottom:3px solid #744b39;border-radius:50%}.teeth{position:absolute;width:23%;height:25%;left:39%;bottom:6%;background:linear-gradient(90deg,#fff 46%,#c6b6a6 46%,#c6b6a6 54%,#fff 54%);border-radius:0 0 4px 4px}.cheek{position:absolute;top:54%;left:12%;width:14%;height:10%;border-radius:50%;background:#f3a28b}.cheek.right{left:auto;right:12%}.hit{position:absolute;inset:20% 0 auto;z-index:5;font-size:clamp(28px,4vw,55px);font-weight:950;color:var(--accent);text-shadow:2px 2px #fff;pointer-events:none;animation:pop .5s both}.footer{font-size:12px;text-align:center;font-weight:700;color:#89806f;letter-spacing:.5px}.versus{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#292c43;color:#fff;font-weight:950;border:5px solid #fff6dd;border-radius:50%;width:52px;height:52px;display:grid;place-items:center;z-index:5;font-size:16px;pointer-events:none}
.overlay{position:fixed;inset:0;z-index:20;background:#292c434d;backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}.overlay[hidden]{display:none}.card{width:min(600px,90vw);text-align:center;border:3px solid #292c43;border-radius:32px;background:#fffdf6;padding:clamp(24px,4vh,50px) 28px;box-shadow:0 10px 0 #292c43}.badge{display:inline-block;background:#ffdc66;border-radius:30px;padding:10px 18px;font-size:13px;font-weight:900;letter-spacing:2px}.card h1{font-size:clamp(32px,4.5vw,62px);line-height:1.1;letter-spacing:-2px;margin:22px 0 16px}.card p{font-size:clamp(15px,1.6vw,20px);line-height:1.7;color:#787368;margin:0 0 22px}.rules{display:flex;justify-content:center;gap:10px;margin-bottom:28px}.rules span{background:#f3eedf;padding:10px 15px;border-radius:12px;font-weight:800;font-size:14px}.primary{min-height:76px;width:min(100%,360px);padding:18px 24px;background:#ffce46;border:3px solid #292c43;border-radius:18px;font-size:26px;font-weight:900;box-shadow:0 6px 0 #292c43}.primary:active{transform:translateY(4px);box-shadow:0 2px 0 #292c43}.countdown{font-size:clamp(80px,15vw,190px);font-weight:950;color:#292c43;line-height:1.3;margin:10px 0;animation:count .25s ease-out}.results{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:24px 0 30px}.results div{border-radius:16px;background:#e8f4ff;color:#2868e8;padding:16px;font-size:14px;font-weight:900}.results div:last-child{background:#fff0dd;color:#ed6341}.results strong{display:block;font-size:54px;margin-top:4px}.subtle{font-size:12px!important;margin:20px 0 0!important}
@keyframes pop{from{opacity:1;transform:translateY(0) scale(.7)}to{opacity:0;transform:translateY(-45px) scale(1.2)}}@keyframes count{from{transform:scale(.8);opacity:.4}to{transform:scale(1);opacity:1}}
@media(max-width:700px){.app{gap:8px;padding:8px}.topbar{padding:0 4px;min-height:85px}.brand{font-size:19px}.brand small{font-size:8px;letter-spacing:1px}.timer{min-width:95px;padding:7px 12px;border-radius:18px}.timer small{font-size:9px}.fullscreen{font-size:12px;min-width:48px;padding:8px}.arena{gap:10px}.player{border-radius:22px}.player-head{padding:14px 10px 6px;flex-direction:column;gap:6px}.name{font-size:22px;text-align:center}.name small{font-size:10px}.scorebox{padding:2px 18px}.field{padding:10px 8px 16px;gap:6px}.mole{left:12%;right:12%;height:68%;max-height:110px}.versus{width:36px;height:36px;font-size:11px;border-width:3px}.footer{font-size:10px}.rules{gap:5px}.rules span{font-size:12px;padding:8px}}
@media(max-height:600px){.topbar{min-height:70px}.brand small,.name small,.footer{display:none}.timer strong{font-size:34px}.player-head{flex-direction:row;padding:8px 18px}.name{font-size:22px}.score{font-size:38px}.field{padding-bottom:10px}.card{padding:18px 24px}.card h1{margin:12px 0;font-size:34px}.card p{margin-bottom:12px}.rules{margin-bottom:15px}.primary{min-height:60px;font-size:22px}.results{margin:12px 0}.results strong{font-size:36px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
<header class="topbar"><div class="brand">MOLE <span>DUEL</span><small>TWO PLAYERS. ONE WINNER.</small></div><div class="timer" id="timer"><small>TIME LEFT</small><strong id="time">30</strong></div><div class="tools"><button class="fullscreen" id="fullscreen" aria-label="전체 화면 전환">⛶ 전체 화면</button></div></header>
<div class="arena">
<section class="player p1" aria-label="PLAYER 1 게임 영역"><header class="player-head"><div class="name">PLAYER 1<small>왼쪽 두더지를 잡아주세요!</small></div><div class="scorebox"><strong class="score" id="score1">0</strong><small>점</small></div></header><div class="field" id="field1"></div></section>
<section class="player p2" aria-label="PLAYER 2 게임 영역"><header class="player-head"><div class="name">PLAYER 2<small>오른쪽 두더지를 잡아주세요!</small></div><div class="scorebox"><strong class="score" id="score2">0</strong><small>점</small></div></header><div class="field" id="field2"></div></section>
<div class="versus">VS</div>
</div>
<footer class="footer">두더지를 클릭하거나 터치하세요 · 한 마리당 1점 · 동시에 플레이!</footer>
</main>
<div class="overlay" id="overlay"><section class="card" id="card" aria-live="polite"><span class="badge">2 PLAYER ARCADE</span><h1>두더지 잡기 대결!</h1><p>왼쪽은 PLAYER 1, 오른쪽은 PLAYER 2.<br>30초 동안 더 많은 두더지를 잡아보세요!</p><div class="rules"><span>☝ 클릭 & 터치</span><span>⏱ 30초 대결</span><span>★ 한 마리 1점</span></div><button class="primary" id="start">게임 시작 →</button><p class="subtle">전자칠판에서는 전체 화면으로 더 크게 즐겨보세요.</p></section></div>
<script>
'use strict';
(() => {
  const GAME_MS = 30000, MOLE_MS = 1200, HOLE_COUNT = 9;
  const overlay = document.getElementById('overlay'), card = document.getElementById('card');
  const time = document.getElementById('time'), timer = document.getElementById('timer');
  let phase = 'ready', deadline = 0, frame = 0, countdownTimer = 0;
  const players = [1, 2].map(number => ({number, score:0, active:-1, timeout:0, holes:[], scoreEl:document.getElementById('score'+number)}));
  const moleMarkup = '<span class="pit"></span><span class="mole"><span class="ear left"></span><span class="ear right"></span><span class="face"><span class="eyes"></span><span class="eyes right"></span><span class="cheek"></span><span class="cheek right"></span><span class="muzzle"><span class="nose"></span><span class="smile"></span><span class="teeth"></span></span></span></span>';
  players.forEach(player => {
    const field = document.getElementById('field'+player.number);
    for(let i=0;i<HOLE_COUNT;i++){
      const hole = document.createElement('button');
      hole.type='button'; hole.className='hole'; hole.innerHTML=moleMarkup;
      hole.setAttribute('aria-label','PLAYER '+player.number+' 구멍 '+(i+1));
      hole.addEventListener('pointerdown', event => {
        if(event.pointerType==='mouse' && event.button!==0) return;
        event.preventDefault(); hit(player,i);
      });
      // Keyboard support; pointer clicks are handled only on pointerdown.
      hole.addEventListener('click', event => {if(event.detail===0) hit(player,i);});
      field.appendChild(hole); player.holes.push(hole);
    }
  });
  function hideMole(player){
    clearTimeout(player.timeout);
    if(player.active>=0) player.holes[player.active].classList.remove('active');
    player.active=-1;
  }
  function spawn(player){
    if(phase!=='playing') return;
    if(performance.now()>=deadline){finish();return;}
    const previous=player.active;
    hideMole(player);
    // Choose uniformly from every hole except the previous one.
    let next=Math.floor(Math.random()*(previous<0?HOLE_COUNT:HOLE_COUNT-1));
    if(previous>=0 && next>=previous) next++;
    player.active=next; player.holes[next].classList.add('active');
    player.timeout=setTimeout(()=>spawn(player),MOLE_MS);
  }
  function hit(player,index){
    if(phase!=='playing') return;
    if(performance.now()>=deadline){finish();return;}
    if(player.active!==index) return;
    player.score++; player.scoreEl.textContent=player.score;
    const feedback=document.createElement('span');feedback.className='hit';feedback.textContent='+1';
    player.holes[index].appendChild(feedback);
    setTimeout(()=>feedback.remove(),550);
    spawn(player);
  }
  function updateClock(){
    if(phase!=='playing')return;
    const left=Math.max(0,deadline-performance.now());
    time.textContent=Math.ceil(left/1000);
    timer.classList.toggle('urgent',left<=5000);
    if(left<=0){finish();return;}
    frame=requestAnimationFrame(updateClock);
  }
  function begin(){
    phase='playing';overlay.hidden=true;deadline=performance.now()+GAME_MS;
    players.forEach(spawn);updateClock();
  }
  function countdown(){
    if(phase==='countdown'||phase==='playing')return;
    phase='countdown';cancelAnimationFrame(frame);clearTimeout(countdownTimer);
    players.forEach(player=>{hideMole(player);player.score=0;player.scoreEl.textContent='0';});
    document.querySelectorAll('.hit').forEach(el=>el.remove());
    time.textContent='30';timer.classList.remove('urgent');overlay.hidden=false;
    const steps=['3','2','1','START!'];let step=0;
    function tick(){
      card.innerHTML='<span class="badge">GET READY</span><div class="countdown">'+steps[step]+'</div><p>각자의 영역에서 준비하세요!</p>';
      step++;
      countdownTimer=setTimeout(step<steps.length?tick:begin,step===steps.length?500:1000);
    }
    tick();
  }
  function finish(){
    if(phase!=='playing')return;
    phase='finished';cancelAnimationFrame(frame);players.forEach(hideMole);time.textContent='0';
    const [p1,p2]=players;
    const result=p1.score===p2.score?'무승부!':(p1.score>p2.score?'PLAYER 1 승리!':'PLAYER 2 승리!');
    card.innerHTML='<span class="badge">TIME’S UP!</span><h1>'+result+'</h1><p>멋진 대결이었어요. 한 판 더 해볼까요?</p><div class="results"><div>PLAYER 1<strong>'+p1.score+'</strong></div><div>PLAYER 2<strong>'+p2.score+'</strong></div></div><button class="primary" id="restart">다시 하기 ↻</button>';
    overlay.hidden=false;document.getElementById('restart').addEventListener('click',countdown);
  }
  document.getElementById('start').addEventListener('click',countdown);
  const fullscreen=document.getElementById('fullscreen');
  fullscreen.addEventListener('click',async()=>{
    try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}
    catch{fullscreen.textContent='브라우저에서 전체 화면';}
  });
  document.addEventListener('fullscreenchange',()=>{fullscreen.textContent=document.fullscreenElement?'⛶ 화면 줄이기':'⛶ 전체 화면';});
  document.addEventListener('contextmenu',event=>event.preventDefault());
  document.addEventListener('dragstart',event=>event.preventDefault());
  document.addEventListener('gesturestart',event=>event.preventDefault(),{passive:false});
  document.addEventListener('wheel',event=>{if(event.ctrlKey)event.preventDefault();},{passive:false});
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden && phase==='playing')updateClock();
  });
})();
</script>
</body>
</html>
