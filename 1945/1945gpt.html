    },
    musicTick(){
      if(!this.on||!this.ctx||!(mode==="play"||mode==="boss"))return;

  function getOptionPositions(){
    if(!player)return[];const n=player.power,p=currentPlane(),arr=[];
    for(let i=0;i<n;i++){
      const center=i-(n-1)/2;let x=player.x+center*28,y=player.y+25+Math.abs(center)*4;
      if(p.id==="p38"){x=player.x+center*34;y=player.y+18;}
      if(p.id==="p51"){const a=Math.PI*.72+(i/(Math.max(1,n-1)))*Math.PI*.56;x=player.x+Math.cos(a)*42;y=player.y-Math.sin(a)*30+10;}
      if(p.id==="spitfire"){x=player.x+center*31;y=player.y+18+Math.abs(center)*5;}
      if(p.id==="bf109"){x=player.x+center*26;y=player.y+22+Math.abs(center)*6;}
      if(p.id==="zero"){x=player.x+center*38;y=player.y+12+Math.abs(center)*8;}
      if(p.id==="shinden"){x=player.x+(i%2?1:-1)*(18+Math.floor(i/2)*12);y=player.y+22+Math.floor(i/2)*16;}
      arr.push({x,y,index:i});

  function addPlayerBullet(x,y,vx,vy,damage=7,opts={}){
    playerBullets.push({x,y,vx,vy,damage,r:opts.r||3,color:opts.color||currentPlane().accent,life:opts.life||2.2,age:0,homing:opts.homing||0,pierce:opts.pierce||0,kind:opts.kind||"shot",trail:opts.trail!==false,target:null});
  }

  function findTarget(x,y,far=false){
    const list=enemies.filter(e=>!e.dead&&e.y>-40).concat(boss&&!boss.dead?[boss]:[]);if(!list.length)return null;
    list.sort((a,b)=>(far?-1:1)*(d2({x,y},a)-d2({x,y},b)));return list[0];
  }

  function firePlayer(){
    if(!player||player.respawn>0)return;const p=currentPlane(),lvl=player.power;
    const base=8+lvl*1.3;
    if(p.id==="p38"||p.id==="bf109"||p.id==="shinden"){
      const count=lvl>=3?3:2;for(let i=0;i<count;i++){const a=(i-(count-1)/2)*.035;addPlayerBullet(player.x+(i-(count-1)/2)*7,player.y-22,Math.sin(a)*520,-Math.cos(a)*520,base);}
    }else{
      const count=2+Math.min(4,lvl);for(let i=0;i<count;i++){const a=(i-(count-1)/2)*(p.id==="zero"?.105:.075);addPlayerBullet(player.x,player.y-20,Math.sin(a)*480,-Math.cos(a)*480,base*.76);}

  function fireOptions(){

        const t=findTarget(o.x,o.y);const a=t?Math.atan2(t.y-o.y,t.x-o.x):-Math.PI/2;addPlayerBullet(o.x,o.y,Math.cos(a)*245,Math.sin(a)*245,16,{homing:3.2,r:4,kind:"missile"});
      }else if(p.id==="p51")addPlayerBullet(o.x,o.y,0,-330,18,{r:4,kind:"rocket"});

      else if(p.id==="bf109"){
        const t=findTarget(o.x,o.y,true),a=t?Math.atan2(t.y-o.y,t.x-o.x):-Math.PI/2;addPlayerBullet(o.x,o.y,Math.cos(a)*410,Math.sin(a)*410,10,{homing:5,r:3,kind:"search"});
      }else if(p.id==="zero")addPlayerBullet(o.x,o.y,0,-150,26,{r:7,life:1.25,kind:"mine"});

  function addEnemyBullet(x,y,angle,speed,opts={}){

  function aimed(x,y,speed,count=1,spread=.12,opts={}){

  function ring(x,y,count,speed,offset=0,opts={}){for(let i=0;i<count;i++)addEnemyBullet(x,y,offset+i*TAU/count,speed,opts);}

  function addEnemy(kind,x,y,opts={}){
    const cfg={
      fighter:{hp:28,r:14,score:300,sprite:pick(["enemyA","enemyB","enemyC","enemyD"]),w:38,h:34,ground:false},
      carrier:{hp:75,r:19,score:900,sprite:"bomberC",w:70,h:42,ground:false,drop:"P"},

      turret:{hp:85,r:19,score:800,sprite:"turret",w:42,h:45,ground:true},

  }

  function spawnWave(){
    wave++;const intensity=diffSettings[difficulty].spawn;const side=wave%2?-1:1;
    if(wave%7===0){
      addEnemy("carrier",side<0?28:W-28,-35,{vy:65,amp:105,freq:1.25,phase:side<0?0:Math.PI});return;
    }
    if(wave%5===0){
      for(let i=0;i<2+(stageCursor>3?1:0);i++)addEnemy(stageCursor===4?"rocket":"bomber",70+i*(W-140)/(1+(stageCursor>3?1:0)),-70-i*28,{vy:45,amp:28,shoot:.7+i*.35});return;
    }
    if(wave%3===0&&stage.bg!==5){
      for(let i=0;i<2+(intensity>1?1:0);i++)addEnemy(i%2?"turret":"tank",55+i*(W-110)/(1+(intensity>1?1:0)),-50-i*70,{vy:42});return;
    }
    const n=Math.floor((4+(stageCursor>4?1:0))*intensity);
    for(let i=0;i<n;i++){
      const x=side<0?-20-i*18:W+20+i*18;
      addEnemy("fighter",x,-20-i*24,{vx:side<0?80:-80,vy:95+i*4,amp:75,freq:1.4,phase:i*.42,turn:side*.09});
    }
  }

  function enemyShoot(e){
    if(e.kind==="fighter")aimed(e.x,e.y,175+stageCursor*6,stageCursor>5?2:1,.10,{r:3,color:"#ff704f"});
    else if(e.kind==="carrier")aimed(e.x,e.y,150,3,.22,{color:"#f9d35e"});

    e.shoot=rand(e.kind==="fighter"?1.5:.95,e.kind==="fighter"?2.5:1.65)*diffSettings[difficulty].fireDelay;
  }

  function spawnBoss(){
    if(stage.alternatives){const alt=stage.alternatives[clamp(Math.floor(player.x/(W/3)),0,2)];Object.assign(stage,alt);}
    const c=crop(stage.sprite),ratio=c[2]/c[3],maxW=stage.sprite==="khabarovsk"?350:stage.sprite==="mechaCany"?340:330;

    enemies=[];enemyBullets=[];setMode("boss");audio.sfx("warning");

  function bossAttack(){
    const b=boss,p=b.phase,fast=190+stageCursor*8;
    if(b.pattern==="turrets"){
      aimed(b.x-b.w*.27,b.y,fast,5,.13,{color:"#ff5e42"});aimed(b.x+b.w*.27,b.y,fast,5,.13,{color:"#f7e4b2",r:3});b.shot=.78;
    }else if(b.pattern==="aimed"){

    }else if(b.pattern==="spiral"){
      for(let arm=0;arm<2+p;arm++)addEnemyBullet(b.x,b.y,b.angle+arm*TAU/(2+p),150+p*22,{turn:(arm%2?1:-1)*.08,color:arm%2?"#ffbd50":"#ff4838"});b.angle+=.39;b.shot=.16;
    }else if(b.pattern==="saws"){
      ring(b.x,b.y,6+p*2,115+p*15,b.angle,{kind:"saw",r:7,color:"#e9edf2",turn:.12});if((b.age*2|0)%2===0)aimed(b.x,b.y,fast+55,2,.08,{color:"#ff3630",r:5});b.angle+=.27;b.shot=.7;
    }else if(b.pattern==="rails"){
      const gap=((b.age*.7)%1)*W;for(let x=25;x<W;x+=42)if(Math.abs(x-gap)>55)addEnemyBullet(x,b.y+b.h*.2,Math.PI/2,175+p*15,{color:"#f8e5bb",r:3});aimed(b.x,b.y,fast,3,.12,{color:"#ff4638"});b.shot=.7;
    }else if(b.pattern==="alternating"){
      if((b.age|0)%3===0)ring(b.x,b.y,14,92,b.angle,{color:"#eaf8ff",r:3});
      else aimed(b.x,b.y,fast+65,4,.10,{color:"#ff4438",r:5});b.angle+=.19;b.shot=.55;
    }else if(b.pattern==="claws"){
      aimed(b.x-b.w*.35,b.y,fast,4,.1,{color:"#ff4b3b"});aimed(b.x+b.w*.35,b.y,fast,4,.1,{color:"#ffbb50"});b.shot=.62;
    }else if(b.pattern==="walls"){
      const gap=80+Math.sin(b.age)*120;for(let x=12;x<W;x+=28)if(Math.abs(x-(W/2+gap))>48)addEnemyBullet(x,b.y,Math.PI/2,190,{color:"#f4f2dc",r:3});b.shot=.72;
    }else if(b.pattern==="final"){
      if(p===1){aimed(b.x,b.y,fast,5,.14,{color:"#ff7650"});b.shot=.7;}
      else if(p===2){ring(b.x,b.y,16,125,b.angle,{color:"#9bff6c",r:3});b.angle+=.22;b.shot=.45;}
      else if(p===3){for(let i=0;i<7;i++)addEnemyBullet(b.x,b.y,Math.PI/2+(i-3)*.14,150+i*11,{wave:4,amp:45,color:"#f8e9b3"});b.shot=.62;}
      else if(p===4){aimed(b.x-b.w*.3,b.y,fast+40,4,.07,{r:5});aimed(b.x+b.w*.3,b.y,fast+40,4,.07,{r:5});b.shot=.5;}
      else if(p===5){for(let arm=0;arm<5;arm++)addEnemyBullet(b.x,b.y,b.angle+arm*TAU/5,185,{turn:.16,color:arm%2?"#fff3c5":"#ff513c",r:4});b.angle+=.4;b.shot=.18;}
      else {ring(b.x,b.y,22,130,b.angle,{color:"#a4ff70",r:3});aimed(b.x,b.y,295,3,.05,{color:"#ff3028",r:7});b.angle+=.13;b.shot=.55;}
    }else {aimed(b.x,b.y,fast+40,5,.11);b.shot=.55;}
  }

  function updateBoss(dt){
    if(!boss)return;const b=boss;b.age+=dt;
    if(b.enter>0){b.enter-=dt;b.y=lerp(b.y,118,dt*2.2);return;}
    b.x=W/2+Math.sin(b.age*.57)*Math.min(100,W/2-b.w/2-8);b.y=112+Math.sin(b.age*.8)*18;
    const np=clamp(1+Math.floor((1-b.hp/b.maxHp)*b.phases),1,b.phases);
    if(np!==b.phase){b.phase=np;b.shot=1.05;enemyBullets=enemyBullets.filter((_,i)=>i%3===0);screenFlash=.23;shake=12;for(let i=0;i<12;i++)burst(b.x+rand(-b.w/3,b.w/3),b.y+rand(-b.h/3,b.h/3),"#ffb33d",6,90);}
    b.shot-=dt;if(b.shot<=0){bossAttack();b.shot*=diffSettings[difficulty].fireDelay;}
  }

  function updatePlayer(dt){
    if(!player)return;const p=currentPlane();player.invuln=Math.max(0,player.invuln-dt);player.respawn=Math.max(0,player.respawn-dt);player.shotCd-=dt;player.optionCd-=dt;
    let dx=(input.right?1:0)-(input.left?1:0),dy=(input.down?1:0)-(input.up?1:0);if(dx&&dy){dx*=.707;dy*=.707;}
    const slow=player.charging?.78:1;player.x=clamp(player.x+dx*p.speed*slow*dt,20,W-20);player.y=clamp(player.y+dy*p.speed*slow*dt,42,H-28);player.tilt=lerp(player.tilt,dx,dt*10);
    if(player.charging){player.charge=Math.min(1.7,player.charge+dt);if(player.power===0&&player.shotCd<=0)firePlayer();}
    else if(autoFire&&player.shotCd<=0)firePlayer();
  }

  function updatePlayerBullets(dt){
    for(let i=playerBullets.length-1;i>=0;i--){const b=playerBullets[i];b.age+=dt;b.life-=dt;
      if(b.homing){const t=b.target&&!b.target.dead?b.target:(b.target=findTarget(b.x,b.y));if(t){const desired=Math.atan2(t.y-b.y,t.x-b.x),cur=Math.atan2(b.vy,b.vx);let da=((desired-cur+Math.PI*3)%TAU)-Math.PI;const a=cur+clamp(da,-b.homing*dt,b.homing*dt),s=Math.hypot(b.vx,b.vy);b.vx=Math.cos(a)*s;b.vy=Math.sin(a)*s;}}
      if(b.kind==="mine"&&b.age>.55){b.vy-=260*dt;b.r=Math.min(11,b.r+dt*3);}
      b.x+=b.vx*dt;b.y+=b.vy*dt;
      if(b.life<=0||b.y<-45||b.x<-45||b.x>W+45){playerBullets.splice(i,1);continue;}
      let hit=null;
      for(const e of enemies){if(!e.dead&&d2(b,e)<(b.r+e.r)**2){hit=e;break;}}
      if(!hit&&boss&&!boss.dead&&boss.enter<=0&&Math.abs(b.x-boss.x)<boss.w*.39+b.r&&Math.abs(b.y-boss.y)<boss.h*.40+b.r)hit=boss;
      if(hit){hit.hp-=b.damage;burst(b.x,b.y,b.color,3,45);if(hit!==boss&&hit.hp<=0)destroyEnemy(hit);if(hit===boss&&hit.hp<=0)destroyBoss();if(b.pierce>0)b.pierce--;else playerBullets.splice(i,1);}
    }
  }

  function updateEnemies(dt){
    for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];if(e.dead){enemies.splice(i,1);continue;}e.age+=dt;e.shoot-=dt;
      if(e.kind==="fighter"||e.kind==="carrier"){e.x=e.baseX+e.vx*e.age+Math.sin(e.age*e.freq+e.phase)*e.amp;e.y+=e.vy*dt;e.vx+=e.turn*18*dt;}
      else if(e.kind==="bomber"){e.y+=e.vy*dt;e.x=e.baseX+Math.sin(e.age*.9+e.phase)*e.amp;}
      else if(e.kind==="rocket"){e.y+=e.vy*dt;e.x=e.baseX+Math.sin(e.age*.55)*18;}
      else e.y+=e.vy*dt;
      if(e.shoot<=0&&e.y>35&&e.y<H*.72)enemyShoot(e);
      if(e.y>H+90||e.x<-160||e.x>W+160){enemies.splice(i,1);continue;}
      if(player&&player.invuln<=0&&!e.ground&&d2(e,player)<(e.r+player.r+3)**2){player.power=Math.max(0,player.power-1);player.invuln=1.1;shake=5;burst(player.x,player.y,"#ffe66c",15,110);e.hp-=40;if(e.hp<=0)destroyEnemy(e);}
    }
  }

  function updateEnemyBullets(dt){
    for(let i=enemyBullets.length-1;i>=0;i--){const b=enemyBullets[i];b.age+=dt;b.life-=dt;
      if(b.turn){const a=Math.atan2(b.vy,b.vx)+b.turn*dt,s=Math.hypot(b.vx,b.vy);b.vx=Math.cos(a)*s;b.vy=Math.sin(a)*s;}
      b.x+=b.vx*dt+(b.wave?Math.sin(b.age*b.wave)*b.amp*dt:0);b.y+=b.vy*dt;
      if(b.life<=0||b.y>H+35||b.y<-60||b.x<-60||b.x>W+60){enemyBullets.splice(i,1);continue;}
      if(player&&player.invuln<=0&&d2(b,player)<(b.r+player.r)**2){enemyBullets.splice(i,1);hitPlayer();return;}
    }
  }

  function updateItems(dt){
    for(let i=items.length-1;i>=0;i--){const it=items[i];it.age+=dt;it.y+=it.vy*dt;it.x=it.baseX+Math.sin(it.age*2.7)*20;
      if(it.y>H+25){items.splice(i,1);continue;}if(player&&d2(it,player)<(it.r+12)**2){collect(it);items.splice(i,1);}
    }
  }

  function updateFormations(dt){
    for(let i=formations.length-1;i>=0;i--){const f=formations[i];f.age+=dt;f.life-=dt;f.timer-=dt;f.angle+=dt*4.4;
      if(f.type==="p51"){f.x=lerp(f.x,player.x,dt*2);f.y-=32*dt;enemyBullets=enemyBullets.filter(b=>d2(b,f)>(46+f.count*4+b.r)**2);damageNear(f.x,f.y,50+f.count*3,32*dt);}
      else if(f.type==="bf109"||f.type==="shinden"){f.y-=25*dt;}
      else if(f.type==="spitfire"){f.x=lerp(f.x,player.x,dt*5);f.y=player.y-72;}
      if(f.timer<=0){
        f.timer=f.type==="spitfire"?.065:f.type==="bf109"?.075:f.type==="shinden"?.055:f.type==="zero"?.11:.08;
        for(let n=0;n<f.count;n++){
          const c=n-(f.count-1)/2;
          if(f.type==="p38")addPlayerBullet(f.orig[n].x,f.orig[n].y,0,-540,9,{life:1.4});
          else if(f.type==="spitfire")addPlayerBullet(f.x+c*25,f.y,Math.sin(c*.06)*500,-500,9,{life:1.4});
          else if(f.type==="bf109")addPlayerBullet(f.x+c*16,f.y,0,-455,12,{homing:3.8,kind:"search"});
          else if(f.type==="zero"){
            const t=findTarget(f.x,f.y);if(t)addPlayerBullet(t.x+c*8,t.y+35,0,-250,13,{life:.5,pierce:1,kind:"search"});
          }else if(f.type==="shinden")addPlayerBullet(f.x+c*22,f.y,0,-520,11,{life:1.3,pierce:1});
        }
      }
      if(f.life<=0)formations.splice(i,1);
    }
  }

  function updateBomb(dt){
    if(!bombEffect)return;const b=bombEffect;b.age+=dt;b.life-=dt;b.tick-=dt;enemyBullets=[];player.invuln=Math.max(player.invuln,.3);
    if(b.type==="spitfire"){b.x=player.x;damageNear(b.x,H/2,72,175*dt);}
    else if(b.type==="shinden")damageNear(b.x,b.y-b.age*310,70,250*dt);
    else damageNear(W/2,H/2,400,92*dt);
    if(b.tick<=0){b.tick=.12;for(let i=0;i<(b.type==="p51"?5:2);i++)burst(b.type==="spitfire"?b.x:rand(20,W-20),rand(30,H-30),b.type==="zero"?"#a9d8ff":"#ffb237",8,130);}
    if(b.life<=0)bombEffect=null;
  }

  function damageNear(x,y,r,damage){
    for(const e of enemies)if(!e.dead&&d2({x,y},e)<(r+e.r)**2){e.hp-=damage;if(e.hp<=0)destroyEnemy(e);}
    if(boss&&!boss.dead&&d2({x,y},boss)<(r+boss.r)**2){boss.hp-=damage;if(boss.hp<=0)destroyBoss();}
  }

  function spawnItem(type,x,y){items.push({type,x,y,baseX:x,vy:68,r:13,age:0});}
  function collect(it){
    if(it.type==="P"){if(player.power<4)player.power++;else player.score+=4000;}
    else if(it.type==="B"){if(player.bombs<6)player.bombs++;else player.score+=10000;}
    else {const vals=[200,500,1000,2000],v=vals[Math.floor(it.age/.117)%4];player.score+=v;stageStats.gold+=v;}
    audio.sfx("item");burst(it.x,it.y,it.type==="P"?"#7eff5b":it.type==="B"?"#ff584c":"#ffd45c",13,90);saveHigh();
  }

  function destroyEnemy(e){
    if(e.dead)return;e.dead=true;player.score+=e.score;runKills++;stageStats.kills++;audio.sfx("explode");burst(e.x,e.y,"#ff9d38",e.kind==="bomber"?20:10,e.kind==="bomber"?150:95);
    if(e.drop)spawnItem(e.drop,e.x,e.y);else if(e.ground&&Math.random()<.58)spawnItem("G",e.x,e.y);else if(e.kind==="bomber"&&Math.random()<.16)spawnItem("B",e.x,e.y);saveHigh();
  }

  function destroyBoss(){
    if(!boss||boss.dead)return;boss.dead=true;player.score+=30000+stageCursor*5000;enemyBullets=[];shake=24;screenFlash=.65;audio.sfx("bomb");
    for(let i=0;i<28;i++)setTimeout(()=>boss&&burst(boss.x+rand(-boss.w*.4,boss.w*.4),boss.y+rand(-boss.h*.35,boss.h*.35),pick(["#fff0a8","#ff9e32","#ef3b2e"]),12,180),i*45);
    clearTimer=4.2;setMode("stageclear");saveHigh();
  }

  function hitPlayer(){
    if(!player||player.invuln>0)return;player.lives--;player.power=Math.max(0,player.power-1);player.invuln=4.5;player.respawn=.65;player.x=W/2;player.y=H-82;enemyBullets=[];shake=18;screenFlash=.35;audio.sfx("hit");burst(player.x,player.y,"#ffbc47",35,220);
    if(player.lives<=0){clearTimer=1.2;setMode("gameover");saveHigh();}
  }

  function burst(x,y,color,n=8,speed=100){for(let i=0;i<n;i++){const a=rand(0,TAU),s=rand(speed*.25,speed);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rand(1.5,4.5),life:rand(.25,.8),max:.8,color,kind:Math.random()<.25?"smoke":"spark"});}}
  function updateParticles(dt){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.98;p.vy=p.vy*.98+(p.kind==="smoke"?-12:22)*dt;if(p.life<=0)particles.splice(i,1);}}
  function saveHigh(){if(player&&player.score>highScore){highScore=player.score;localStorage.setItem("strikers1945-hi",String(highScore));}}

  function update(dt){
    clock+=dt;screenFlash=Math.max(0,screenFlash-dt);shake=Math.max(0,shake-dt*20);audio.musicTick();updateParticles(dt);
    if(mode==="select"||mode==="paused"||mode==="gameover"||mode==="complete")return;
    if(mode==="intro"){introTimer-=dt;if(introTimer<=0)setMode("play");return;}
    if(mode==="stageclear"){
      clearTimer-=dt;if(clearTimer<=0){stageCursor++;if(stageCursor>=8){setMode("complete");}else startStage();}return;
    }
    updatePlayer(dt);updatePlayerBullets(dt);updateEnemies(dt);updateEnemyBullets(dt);updateItems(dt);updateFormations(dt);updateBomb(dt);
    if(mode==="play"){
      stageElapsed+=dt;directorTimer-=dt;if(directorTimer<=0){spawnWave();directorTimer=clamp(1.5-stageCursor*.055,.92,1.5)/diffSettings[difficulty].spawn;}
      if(stageElapsed>=stage.duration)spawnBoss();
    }else if(mode==="boss")updateBoss(dt);
  }

  function drawSprite(name,x,y,w,h,rot=0,alpha=1){
    const c=typeof name==="string"?crop(name):name;if(!c||!art.complete)return;ctx.save();ctx.globalAlpha=alpha;ctx.translate(Math.round(x),Math.round(y));ctx.rotate(rot);ctx.drawImage(art,c[0]*ART_SCALE,c[1]*ART_SCALE,c[2]*ART_SCALE,c[3]*ART_SCALE,-w/2,-h/2,w,h);ctx.restore();
  }

  function drawBackground(){
    const bg=stage?.bg??2,col=bg%4,row=(bg/4)|0,sw=128,sh=384;
    const p=mode==="select"?(clock*.045)%1:clamp(stageElapsed/(stage?.duration||1),0,1);
    const dh=1344,y=-704+p*704;
    if(terrain.complete)ctx.drawImage(terrain,col*sw,row*sh,sw,sh,0,y,W,dh);else{ctx.fillStyle="#17333a";ctx.fillRect(0,0,W,H);}
    const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,"rgba(3,7,10,.08)");grad.addColorStop(1,"rgba(2,5,8,.28)");ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
    if(stage?.id==="strato"||stage?.id==="moon"||stage?.id==="final"){ctx.fillStyle="#fff";for(let i=0;i<28;i++){const xx=(i*83.7+clock*5)%W,yy=(i*47.3+clock*(12+i%4))%H;ctx.globalAlpha=.25+(i%4)*.12;ctx.fillRect(xx,yy,i%3?1:2,i%3?1:2);}ctx.globalAlpha=1;}
  }

  function drawPlayer(){
    if(!player)return;if(player.respawn>0&&Math.floor(clock*14)%2)return;const p=currentPlane();
    if(player.invuln>0){ctx.strokeStyle=`rgba(120,225,255,${.25+.25*Math.sin(clock*15)})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(player.x,player.y,19+Math.sin(clock*8)*3,0,TAU);ctx.stroke();}
    if(formations.length===0){for(const o of getOptionPositions()){drawSprite("optionA",o.x,o.y,22,22,-player.tilt*.08);ctx.fillStyle=p.accent;ctx.globalAlpha=.55;ctx.fillRect(o.x-2,o.y+8,4,12);ctx.globalAlpha=1;}}
    const c=p.sprite,ratio=c[2]/c[3],h=54,w=clamp(h*ratio,50,79);ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.tilt*.16);ctx.globalAlpha=.26;ctx.fillStyle="#000";ctx.beginPath();ctx.ellipse(4,10,w*.42,h*.36,0,0,TAU);ctx.fill();ctx.restore();drawSprite(c,player.x,player.y,w,h,player.tilt*.16);
    ctx.fillStyle="#ffb234";ctx.globalAlpha=.75+Math.random()*.25;ctx.beginPath();ctx.moveTo(player.x-4,player.y+h*.34);ctx.lineTo(player.x,player.y+h*.34+rand(9,17));ctx.lineTo(player.x+4,player.y+h*.34);ctx.fill();ctx.globalAlpha=1;
    if(player.charging&&player.power>0){const ready=player.charge>=p.charge,r=25+Math.sin(clock*10)*3;ctx.strokeStyle=ready?"#fff7ad":p.accent;ctx.lineWidth=3;ctx.beginPath();ctx.arc(player.x,player.y,r,-Math.PI/2,-Math.PI/2+TAU*clamp(player.charge/p.charge,0,1));ctx.stroke();}
  }

  function drawEnemies(){
    for(const e of enemies){if(e.dead)continue;let rot=0;if(e.kind==="fighter"||e.kind==="carrier")rot=clamp(e.vx/450,-.3,.3);drawSprite(e.sprite,e.x,e.y,e.w,e.h,rot);if(e.kind==="carrier"){ctx.fillStyle="#ee3329";ctx.strokeStyle="#fff";ctx.lineWidth=1;ctx.beginPath();ctx.arc(e.x,e.y,9,0,TAU);ctx.fill();ctx.stroke();ctx.fillStyle="#fff";ctx.font="bold 11px Arial";ctx.textAlign="center";ctx.fillText("P",e.x,e.y+4);}}
  }

  function drawBoss(){
    if(!boss)return;const pulse=boss.dead?1+Math.sin(clock*27)*.04:1;ctx.save();if(boss.phase>1&&!boss.dead){ctx.shadowBlur=12;ctx.shadowColor=stage.tint;}drawSprite(boss.sprite,boss.x,boss.y,boss.w*pulse,boss.h*pulse,Math.sin(boss.age*.9)*.025,boss.dead?.65:1);ctx.restore();
    if(!boss.dead&&boss.enter<=0){const weakY=boss.y+boss.h*.08;ctx.fillStyle=`rgba(255,${90+boss.phase*15},45,${.6+.3*Math.sin(clock*10)})`;ctx.beginPath();ctx.arc(boss.x,weakY,7+Math.sin(clock*8)*2,0,TAU);ctx.fill();}
  }

  function drawBullets(){
    for(const b of playerBullets){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(b.vy,b.vx)+Math.PI/2);if(b.trail){ctx.fillStyle=b.color;ctx.globalAlpha=.22;ctx.fillRect(-b.r,b.r,b.r*2,b.r*4);}ctx.shadowBlur=7;ctx.shadowColor=b.color;ctx.fillStyle="#fff";ctx.beginPath();ctx.ellipse(0,0,b.r*.72,b.r*(b.kind==="shot"?2.3:1.5),0,0,TAU);ctx.fill();ctx.fillStyle=b.color;ctx.globalAlpha=.75;ctx.beginPath();ctx.ellipse(0,0,b.r*.45,b.r*1.6,0,0,TAU);ctx.fill();ctx.restore();}
    for(const b of enemyBullets){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.kind==="saw"?b.age*8:0);ctx.shadowBlur=5;ctx.shadowColor=b.color;ctx.fillStyle=b.color;if(b.kind==="saw"){ctx.beginPath();for(let i=0;i<12;i++){const r=i%2?b.r:b.r*1.45,a=i*TAU/12;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();ctx.fill();ctx.fillStyle="#35404a";ctx.beginPath();ctx.arc(0,0,b.r*.45,0,TAU);ctx.fill();}else{ctx.beginPath();ctx.arc(0,0,b.r,0,TAU);ctx.fill();ctx.fillStyle="rgba(255,255,255,.9)";ctx.beginPath();ctx.arc(-b.r*.28,-b.r*.3,Math.max(1,b.r*.34),0,TAU);ctx.fill();}ctx.restore();}
  }

  function drawItems(){
    for(const it of items){ctx.save();ctx.translate(it.x,it.y);const spin=.84+.16*Math.sin(it.age*7);ctx.scale(spin,1);let color=it.type==="P"?"#62d84d":it.type==="B"?"#e44839":"#e7aa35";if(it.type==="G"&&Math.floor(it.age/.117)%4===3)color="#fff9d6";ctx.shadowBlur=10;ctx.shadowColor=color;ctx.fillStyle=color;ctx.strokeStyle="#f6efca";ctx.lineWidth=2;if(it.type==="G")ctx.fillRect(-9,-13,18,26);else{ctx.beginPath();ctx.arc(0,0,13,0,TAU);ctx.fill();ctx.stroke();}ctx.shadowBlur=0;ctx.fillStyle="#fff";ctx.font="900 14px Arial";ctx.textAlign="center";ctx.fillText(it.type==="G"?"":it.type,0,5);ctx.restore();}
  }

  function drawFormations(){
    for(const f of formations){const p=currentPlane();for(let i=0;i<f.count;i++){const c=i-(f.count-1)/2;let x=f.x+c*26,y=f.y;
      if(f.type==="p38"){x=f.orig[i].x;y=f.orig[i].y;}
      else if(f.type==="p51"){const a=f.angle+i*TAU/f.count;x=f.x+Math.cos(a)*(37+f.count*3);y=f.y+Math.sin(a)*(37+f.count*3);}
      else if(f.type==="zero"){const t=findTarget(f.x,f.y);if(t){const a=i*TAU/f.count+f.angle*.25;x=t.x+Math.cos(a)*28;y=t.y+Math.sin(a)*20;}else{x=f.x+c*25;y=f.y;}}
      drawSprite("optionA",x,y,25,25,f.angle*.08);ctx.strokeStyle=p.accent;ctx.globalAlpha=.45;ctx.beginPath();ctx.arc(x,y,13+Math.sin(clock*9+i)*2,0,TAU);ctx.stroke();ctx.globalAlpha=1;
    }}
  }

  function drawBomb(){
    if(!bombEffect)return;const b=bombEffect,t=b.age;
    ctx.save();ctx.globalCompositeOperation="screen";
    if(b.type==="p38"){const r=clamp(t*390,0,360);const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,r);g.addColorStop(0,"rgba(255,255,230,.95)");g.addColorStop(.2,"rgba(255,174,48,.8)");g.addColorStop(1,"rgba(255,60,20,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,r,0,TAU);ctx.fill();}
    else if(b.type==="p51"){for(let i=0;i<4;i++){const x=((t*260+i*127)%560)-55;drawSprite("bomberB",x,80+i*135,110,72,0,.75);ctx.fillStyle="rgba(255,182,60,.5)";ctx.beginPath();ctx.arc(x,160+i*110,35+Math.sin(t*12+i)*14,0,TAU);ctx.fill();}}
    else if(b.type==="spitfire"){const g=ctx.createLinearGradient(b.x-55,0,b.x+55,0);g.addColorStop(0,"rgba(255,80,20,0)");g.addColorStop(.5,"rgba(255,245,170,.95)");g.addColorStop(1,"rgba(255,60,10,0)");ctx.fillStyle=g;ctx.fillRect(b.x-60,0,120,H);}
    else if(b.type==="bf109"){for(let i=0;i<6;i++){const x=45+i*72,y=((t*360+i*95)%760)-70;drawSprite("enemyC",x,y,45,43,Math.PI,.8);ctx.fillStyle="rgba(255,150,45,.55)";ctx.beginPath();ctx.arc(x,y+38,25,0,TAU);ctx.fill();}}
    else if(b.type==="zero"){ctx.strokeStyle=`rgba(170,220,255,${.55+Math.sin(t*30)*.3})`;ctx.lineWidth=4;for(let i=0;i<9;i++){ctx.beginPath();let x=i*55-10;ctx.moveTo(x,0);for(let y=0;y<H;y+=35){x+=rand(-22,22);ctx.lineTo(x,y);}ctx.stroke();}}
    else {const y=b.y-t*310;ctx.fillStyle="rgba(130,255,180,.82)";ctx.beginPath();ctx.moveTo(b.x,y-95);ctx.lineTo(b.x-42,y+45);ctx.lineTo(b.x,y+25);ctx.lineTo(b.x+42,y+45);ctx.closePath();ctx.fill();}
    ctx.restore();
  }

  function drawParticles(){for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(p.kind==="smoke"?1.5-p.life:1),0,TAU);ctx.fill();}ctx.globalAlpha=1;}

    ctx.fillStyle="#fff";ctx.font="11px Arial";ctx.fillText(`× ${Math.max(0,player.lives)}`,W-64,21);for(let i=0;i<Math.min(3,player.lives);i++)drawSprite(currentPlane().sprite,W-107-i*13,27,12,10,0,.95);
    ctx.textAlign="left";ctx.fillStyle="#ef5041";ctx.font="900 10px Arial";ctx.fillText("B",299,21);ctx.fillStyle="#fff";ctx.fillText(`× ${player.bombs}`,311,21);ctx.fillStyle="#cdd4d1";ctx.font="8px Arial";ctx.fillText("PWR",354,23);for(let i=0;i<4;i++){ctx.fillStyle=i<player.power?currentPlane().accent:"#394245";ctx.fillRect(378+i*14,22,11,6);}ctx.restore();
    if(boss&&!boss.dead){ctx.fillStyle="rgba(4,8,10,.78)";ctx.fillRect(28,45,W-56,23);ctx.fillStyle="#d0c9ac";ctx.font="700 8px Arial";ctx.textAlign="left";ctx.fillText(`${boss.sub}  ${boss.name}`,34,49);ctx.fillStyle="#32140f";ctx.fillRect(34,59,W-68,5);ctx.fillStyle="#f04a35";ctx.fillRect(34,59,(W-68)*clamp(boss.hp/boss.maxHp,0,1),5);ctx.fillStyle="#ffd563";ctx.fillRect(34,59,(W-68)*clamp(boss.hp/boss.maxHp,0,1)/boss.phases,5);}
  }

  function draw(){
    ctx.save();ctx.imageSmoothingEnabled=true;ctx.clearRect(0,0,W,H);const sx=shake?rand(-shake,shake):0,sy=shake?rand(-shake,shake):0;ctx.translate(sx,sy);drawBackground();

  function frame(now){const dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);

  addEventListener("keydown",e=>{
    if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(e.code))e.preventDefault();
    if(mode==="select")return;
    if(e.code==="ArrowLeft"||e.code==="KeyA")input.left=true;if(e.code==="ArrowRight"||e.code==="KeyD")input.right=true;if(e.code==="ArrowUp"||e.code==="KeyW")input.up=true;if(e.code==="ArrowDown"||e.code==="KeyS")input.down=true;
    if((e.code==="KeyZ"||e.code==="Space")&&!e.repeat)setCharge(true);if((e.code==="KeyX"||e.code==="ShiftLeft"||e.code==="ShiftRight")&&!e.repeat)bomb();
    if((e.code==="Escape"||e.code==="KeyP")&&!e.repeat)pause();if((mode==="gameover"||mode==="complete")&&e.code==="Enter"){e.stopImmediatePropagation();backToSelect();}
  });
  addEventListener("keyup",e=>{if(e.code==="ArrowLeft"||e.code==="KeyA")input.left=false;if(e.code==="ArrowRight"||e.code==="KeyD")input.right=false;if(e.code==="ArrowUp"||e.code==="KeyW")input.up=false;if(e.code==="ArrowDown"||e.code==="KeyS")input.down=false;if(e.code==="KeyZ"||e.code==="Space")setCharge(false);});
  addEventListener("blur",()=>{input.left=input.right=input.up=input.down=false;if(["play","boss"].includes(mode))pause();});

  return {
    assetsReady,art,terrain,start,pause,bomb,setCharge,backToSelect,
    get mode(){return mode},get planeIndex(){return planeIndex},set planeIndex(v){planeIndex=clamp(v,0,5)},
    set sound(v){audio.on=!!v;if(v)audio.init()},get sound(){return audio.on},
    setAutoFire(v){autoFire=!!v},
    movePointer(x,y){if(player&&(mode==="play"||mode==="boss")){player.x=clamp(x,20,W-20);player.y=clamp(y,42,H-28);}},
    drawPlanePreview(target,index){const c=GAME_DATA.planes[index].sprite,g=target.getContext("2d");target.width=100;target.height=86;g.clearRect(0,0,100,86);g.imageSmoothingEnabled=true;const ratio=c[2]/c[3],h=75,w=Math.min(94,h*ratio);g.drawImage(art,c[0]*ART_SCALE,c[1]*ART_SCALE,c[2]*ART_SCALE,c[3]*ART_SCALE,50-w/2,4,w,h);}
  };
})();
</script><script>"use strict";

(() => {
  const $=s=>document.querySelector(s);
  const select=$("#select"),planes=$("#planes"),info=$("#plane-info"),start=$("#start"),modal=$("#modal"),modalContent=$("#modal-content");
  const soundBtn=$("#soundBtn"),pauseBtn=$("#pauseBtn"),canvas=$("#game");
  let selected=0,dragging=false,modalPaused=false;

  const bars=n=>`<span class="bars">${[1,2,3,4,5].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</span>`;
  function renderInfo(){
    const p=GAME_DATA.planes[selected];
    info.innerHTML=`<strong>${p.name}</strong><span class="stat"><b>SPEED</b>${bars(Math.round((p.speed-190)/30))}</span><span class="stat"><b>POWER</b>${bars(p.power)}</span><span>${p.sub}</span><span>${p.formation}</span>`;
    [...planes.children].forEach((el,i)=>el.setAttribute("aria-pressed",String(i===selected)));GAME.planeIndex=selected;
  }
  function choose(i){selected=(i+GAME_DATA.planes.length)%GAME_DATA.planes.length;renderInfo();planes.children[selected]?.focus({preventScroll:true});}
  function buildPlaneCards(){
    planes.innerHTML="";GAME_DATA.planes.forEach((p,i)=>{const b=document.createElement("button");b.className="plane-card";b.type="button";b.setAttribute("aria-label",`${p.name}: ${p.desc}`);b.setAttribute("aria-pressed",String(i===selected));const c=document.createElement("canvas");GAME.drawPlanePreview(c,i);const s=document.createElement("span");s.textContent=p.short;b.append(c,s);b.onclick=()=>choose(i);b.ondblclick=()=>launch();planes.append(b);});renderInfo();
  }

  function launch(){
    GAME.start({planeIndex:selected,difficulty:$("#difficulty").value,autofire:$("#autofire").checked});select.style.display="none";start.blur();
  }

  function openModal(kind){
    modalPaused=["play","boss","intro"].includes(GAME.mode);if(modalPaused)GAME.pause();
    const help=`<button class="close" aria-label="닫기">×</button><h2>HOW TO PLAY</h2><div class="keygrid"><kbd>↑ ↓ ← →</kbd><span>전투기 이동</span><kbd>Z / SPACE</kbd><span>누르고 충전 · 떼면 기체별 대형 공격</span><kbd>X / SHIFT</kbd><span>폭탄 사용 · 적탄 제거</span><kbd>ESC / P</kbd><span>일시정지</span></div><h3>아이템</h3><ul><li><b>P</b> — 주포 강화 + 호위기 1대. 최대 4대.</li><li><b>B</b> — 폭탄 1개. 최대 6개.</li><li><b>금괴</b> — 흰색으로 빛나는 순간 획득하면 2,000점.</li></ul><p>비행 적과 충돌하면 화력만 한 단계 떨어집니다. 적탄에 맞으면 생명을 잃고 기본 화력으로 돌아갑니다.</p>`;
    const about=`<button class="close" aria-label="닫기">×</button><h2>RECREATION NOTES</h2><p>1995년 아케이드판 초대 <i>Strikers 1945</i>의 전투 구조를 연구해 만든 비상업적 브라우저 재현입니다.</p><ul><li>6종 실존 전투기와 서로 다른 보조무기·차지 대형·폭탄</li><li>처음 4개 임무 무작위 배치, 이후 로켓 기지·성층권·달·C.A.N.Y. 본부</li><li>빠른 조준탄, 부채꼴탄, 회전탄, 고정탄 사이의 틈을 읽는 탄도</li><li>P·B·금괴 아이템, 4단계 파워, 기체 충돌 시 화력 저하</li></ul><p>그래픽과 합성음은 이 버전을 위해 새로 제작했으며 원작 ROM·음원·스프라이트를 포함하지 않습니다.</p><p class="note">원작: © Psikyo / City Connection. 이 팬 프로젝트는 공식 배포물이 아닙니다.</p>`;
    modalContent.innerHTML=kind==="help"?help:about;modal.hidden=false;modal.querySelector(".close").focus();
  }
  function closeModal(){modal.hidden=true;modalContent.innerHTML="";if(modalPaused&&GAME.mode==="paused")GAME.pause();modalPaused=false;}

  GAME.assetsReady.then(buildPlaneCards);
  start.onclick=launch;
  $("#guideBtn").onclick=()=>openModal("help");$("#aboutBtn").onclick=()=>openModal("about");
  modal.onclick=e=>{if(e.target===modal||e.target.closest(".close"))closeModal();};
  soundBtn.onclick=()=>{GAME.sound=!GAME.sound;soundBtn.textContent=GAME.sound?"SOUND ON":"SOUND OFF";};
  pauseBtn.onclick=()=>GAME.pause();
  $("#fullBtn").onclick=async()=>{try{if(!document.fullscreenElement)await $("#cabinet").requestFullscreen();else await document.exitFullscreen();}catch{}}
  $("#home").onclick=e=>{e.preventDefault();if(GAME.mode!=="select")GAME.backToSelect();};
  $("#autofire").onchange=e=>GAME.setAutoFire(e.target.checked);

  function pointerMove(e){
    const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*canvas.width/r.width,y=(e.clientY-r.top)*canvas.height/r.height;GAME.movePointer(x,y);
  }
  canvas.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse"||e.buttons===1){dragging=true;canvas.setPointerCapture(e.pointerId);pointerMove(e);}});
  canvas.addEventListener("pointermove",e=>{if(dragging)pointerMove(e)});canvas.addEventListener("pointerup",()=>dragging=false);canvas.addEventListener("pointercancel",()=>dragging=false);
  const charge=$("#touchCharge");charge.addEventListener("pointerdown",e=>{e.preventDefault();charge.setPointerCapture(e.pointerId);GAME.setCharge(true);});charge.addEventListener("pointerup",e=>{e.preventDefault();GAME.setCharge(false);});charge.addEventListener("pointercancel",()=>GAME.setCharge(false));
  $("#touchBomb").onclick=()=>GAME.bomb();

  addEventListener("keydown",e=>{
    if(!modal.hidden){if(e.code==="Escape")closeModal();return;}
    if(GAME.mode!=="select")return;
    if(e.code==="ArrowLeft"){e.preventDefault();choose(selected-1)}
    if(e.code==="ArrowRight"){e.preventDefault();choose(selected+1)}
    if(e.code==="ArrowUp"){e.preventDefault();choose(selected-3)}
    if(e.code==="ArrowDown"){e.preventDefault();choose(selected+3)}
    if(e.code==="Enter"){e.preventDefault();launch()}
    if(/^Digit[1-6]$/.test(e.code))choose(Number(e.code.slice(-1))-1);
  });
  addEventListener("s1945:mode",e=>{
    if(e.detail.mode==="select")select.style.display="flex";
    pauseBtn.textContent=e.detail.mode==="paused"?"▶":"Ⅱ";pauseBtn.setAttribute("aria-label",e.detail.mode==="paused"?"계속":"일시정지");
  });
})();
</script></body></html>
