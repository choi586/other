<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>카드 뒤집기 가챠 (탭/재고/가중치)</title>
<style>
  :root{--bg:#0f172a;--panel:#111827;--glass:rgba(255,255,255,.08);--accent:#f59e0b;--muted:#9ca3af}
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(135deg,#6a11cb 0%,#2575fc 100%);min-height:100vh;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  header{padding:18px 16px;text-align:center}
  h1{margin:0;font-size:26px}
  .subtitle{opacity:.9}
  .container{max-width:1100px;margin:0 auto;padding:16px}
  /* tabs */
  .tabs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
  .tab{border:none;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--glass);color:#fff}
  .tab.active{background:#111827}
  .panel{background:rgba(255,255,255,.12);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:16px}
  .grid{display:grid;gap:16px}
  @media(min-width:980px){.grid{grid-template-columns:2fr 1fr}}
  textarea{width:100%;min-height:160px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.2);color:#fff;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn{border:none;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:linear-gradient(to right,#ffcc00,#ff9900);color:#222;box-shadow:0 4px 15px rgba(0,0,0,.25)}
  .btn.ghost{background:rgba(255,255,255,.15);color:#fff;box-shadow:none}
  .hint{font-size:12px;color:#fde68a}
  /* table */
  table{width:100%;border-collapse:separate;border-spacing:0 8px}
  th,td{padding:8px 10px;text-align:left}
  th{color:#ffe08a}
  td{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.12)}
  tr td:first-child{border-radius:8px 0 0 8px}
  tr td:last-child{border-radius:0 8px 8px 0}
  input[type="text"],input[type="number"]{width:100%;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);color:#fff}
  .qty{display:flex;gap:6px;align-items:center}
  .qty button{padding:6px 10px;border-radius:8px}
  /* board */
  .board{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
  .flip{perspective:1000px}
  .card{position:relative;width:100%;padding-top:135%;cursor:pointer}
  .card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s ease}
  .card.flipped .card-inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;border-radius:14px;border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex-direction:column;backface-visibility:hidden;box-shadow:0 8px 20px rgba(0,0,0,.3);padding:10px;text-align:center}
  .back{background:linear-gradient(135deg,#ff9a9e 0%,#fad0c4 100%);color:#222;font-weight:900;font-size:26px;letter-spacing:1px}
  .front{transform:rotateY(180deg);background:linear-gradient(135deg,#a1c4fd 0%,#c2e9fb 100%);color:#222}
  .front .emoji{font-size:34px}
  .front .name{margin-top:6px;font-weight:800}
  .disabled{opacity:.55;pointer-events:none}
  /* stats & modal */
  .stats{display:flex;gap:14px;flex-wrap:wrap;justify-content:space-evenly;margin:14px 0}
  .stat{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px 14px;text-align:center}
  .stat .v{font-size:22px;color:#ffcc00;font-weight:900}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}
  .modal{width:min(90vw,480px);background:#fff;border-radius:16px;padding:24px;text-align:center;transform:scale(.85);opacity:0;transition:.2s ease}
  .modal.open{transform:scale(1);opacity:1}
  .modal .title{font-size:22px;margin:0;color:#111}
  .modal .big{font-weight:900;font-size:34px;margin:10px 0;color:#111}
</style>
</head>
<body>
  <header>
    <h1>✨ 카드 뒤집기 가챠 ✨</h1>
    <p class="subtitle">설정(재고) / 게임(카드) 탭으로 나눴고, 뒤집힌 카드 = 실제 당첨 결과로 표시돼요.</p>
  </header>

  <div class="container">
    <!-- tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="settings">설정(재고)</button>
      <button class="tab" data-tab="game">게임(카드)</button>
    </div>

    <!-- SETTINGS -->
    <section class="panel" id="tab-settings">
      <div class="grid">
        <div>
          <h2 style="margin:0 0 8px">목록 입력</h2>
          <textarea id="cardData" placeholder="이름|가중치|재고 형식. 예) 금화|10|5&#10;은화|5|3&#10;꽝|1|999"></textarea>
          <p class="hint">가중치/재고는 생략 가능. 재고 모드에서만 수량이 차감돼요.</p>
          <div class="row">
            <button class="btn" id="applyBtn">저장</button>
            <button class="btn ghost" id="sampleBtn">샘플</button>
            <button class="btn ghost" id="clearBtn">비우기</button>
          </div>
        </div>
        <div>
          <h2 style="margin:0 0 8px">모드 & 옵션</h2>
          <div class="row">
            <label><input type="radio" name="mode" value="random" checked> 랜덤</label>
            <label><input type="radio" name="mode" value="weighted"> 확률(가중치)</label>
            <label><input type="radio" name="mode" value="stock"> 재고</label>
          </div>
          <div class="row" style="margin-top:6px">
            <label><input type="checkbox" id="noReplace"> 중복 없이(한 번 나온 이름 제외)</label>
            <label><input type="checkbox" id="autoShuffle" checked> 보드 자동 섞기</label>
          </div>
        </div>
      </div>

      <div class="panel" style="margin-top:16px">
        <h2 style="margin:0 0 6px">재고 편집기</h2>
        <p class="hint">표에서 바로 수정하면 위 입력창과 동기화됩니다. 끝나면 <b>저장</b>을 눌러요.</p>
        <div style="overflow:auto">
          <table>
            <thead>
              <tr><th>이름</th><th style="width:140px">가중치</th><th style="width:180px">재고</th><th style="width:90px">삭제</th></tr>
            </thead>
            <tbody id="stockBody"></tbody>
          </table>
        </div>
        <button class="btn ghost" id="addRow">행 추가</button>
      </div>
    </section>

    <!-- GAME -->
    <section class="panel" id="tab-game" style="display:none">
      <div class="row" style="justify-content:space-between;align-items:center">
        <div class="hint">카드를 뒤집는 순간 당첨 결과를 카드 앞면에 채워 넣습니다.</div>
        <div class="row">
          <button class="btn" id="newBoard">새 보드</button>
          <button class="btn ghost" id="resetBoard">리셋</button>
          <button class="btn ghost" id="exportCSV">CSV</button>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><div class="v" id="totalCards">0</div><div>총 카드</div></div>
        <div class="stat"><div class="v" id="remainCards">0</div><div>남은 카드(사용가능)</div></div>
        <div class="stat"><div class="v" id="totalPulls">0</div><div>총 뽑기</div></div>
      </div>

      <div class="board" id="board"></div>

      <div class="panel" style="margin-top:14px">
        <h3 style="margin:0 0 8px">결과 기록</h3>
        <ul id="history" style="list-style:none;padding:0;margin:0;display:grid;gap:6px"></ul>
      </div>
    </section>
  </div>

  <!-- Modal -->
  <div class="modal-bg" id="backdrop">
    <div class="modal" id="modal">
      <p class="title">🎉 당첨!</p>
      <p class="big" id="modalText">-</p>
      <button class="btn" id="closeModal">닫기</button>
    </div>
  </div>

<script>
(() => {
  // ============ State ============
  const $ = s => document.querySelector(s);
  const stockBody = $('#stockBody');
  const boardEl = $('#board');
  const historyEl = $('#history');
  const totalCardsEl = $('#totalCards');
  const remainCardsEl = $('#remainCards');
  const totalPullsEl = $('#totalPulls');

  let items = [];            // {name, weight, stock, alive}
  let draws = [];            // [{name, mode}]
  let removed = new Set();   // names removed when noReplace
  let mode = 'random';
  let boardState = [];       // [{flipped:boolean, name:string|null}]

  // ============ Tabs ============
  document.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const t = btn.dataset.tab;
      $('#tab-settings').style.display = (t==='settings'?'block':'none');
      $('#tab-game').style.display = (t==='game'?'block':'none');
      localStorage.setItem('tab', t);
    });
  });
  const lastTab = localStorage.getItem('tab');
  if (lastTab && lastTab !== 'settings') document.querySelector('.tab[data-tab="game"]').click();

  // ============ Emoji map ============
  const EMOJI = {'금':'💰','은':'🪙','보석':'💎','다이아':'💠','상자':'🎁','레어':'✨','꽝':'💣','초콜릿':'🍫','스티커':'🎟️','음료':'🥤'};
  const iconOf = (name) => {
    for (const k in EMOJI) if (name.includes(k)) return EMOJI[k];
    return '🎉';
  };

  // ============ Parse / Build ============
  const parseText = (text) => {
    const lines = text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    const out = [];
    for (const line of lines) {
      const p = line.split('|').map(s=>s.trim());
      const name = p[0]; if (!name) continue;
      let weight = p[1]!==undefined && p[1]!=='' ? parseFloat(p[1]) : 1; if (isNaN(weight)) weight = 1;
      let stock  = p[2]!==undefined && p[2]!=='' ? parseInt(p[2],10) : null; if (stock!==null && isNaN(stock)) stock = null;
      out.push({name, weight, stock, alive:true});
    }
    return out;
  };

  const syncFromTableToTextarea = () => {
    const rows = [];
    stockBody.querySelectorAll('tr').forEach(tr=>{
      const tds = tr.querySelectorAll('td');
      const name = tds[0].querySelector('input').value.trim();
      const weight = tds[1].querySelector('input').value.trim();
      const stock = tds[2].querySelector('input').value.trim();
      if (name) rows.push([name, weight, stock].filter((v,i)=>!(i>0 && v==='')).join('|'));
    });
    $('#cardData').value = rows.join('\n');
    rebuild();
    save();
  };

  const renderStockTable = () => {
    stockBody.innerHTML = '';
    items.forEach(it=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input type="text" value="${it.name}"></td>
        <td><input type="number" step="0.1" min="0" value="${it.weight ?? 1}"></td>
        <td>
          <div class="qty">
            <button class="btn ghost" type="button">-</button>
            <input type="number" min="0" value="${it.stock==null?'':it.stock}">
            <button class="btn ghost" type="button">+</button>
          </div>
        </td>
        <td><button class="btn ghost" type="button">삭제</button></td>
      `;
      const [nameI, weightI] = tr.querySelectorAll('input');
      const stockI = tr.querySelectorAll('input')[2];
      const [minus, plus] = tr.querySelectorAll('button.btn.ghost');
      const del = tr.querySelectorAll('button.btn.ghost')[2];

      [nameI, weightI, stockI].forEach(inp=>inp.addEventListener('input', syncFromTableToTextarea));
      minus.addEventListener('click', ()=>{ const v=parseInt(stockI.value||'0',10); stockI.value = String(Math.max(0, v-1)); syncFromTableToTextarea(); });
      plus.addEventListener('click', ()=>{ const v=parseInt(stockI.value||'0',10); stockI.value = String(Math.max(0, v+1)); syncFromTableToTextarea(); });
      del.addEventListener('click', ()=>{ tr.remove(); syncFromTableToTextarea(); });

      stockBody.appendChild(tr);
    });
  };

  const rebuild = () => {
    items = parseText($('#cardData').value);
    if (items.length === 0) {
      items = [
        {name:'금화', weight:10, stock:5, alive:true},
        {name:'은화', weight:6, stock:3, alive:true},
        {name:'보석', weight:2, stock:1, alive:true},
        {name:'꽝',  weight:1, stock:999, alive:true},
      ];
    }
    for (const it of items) {
      it.alive = !removed.has(it.name);
      if (mode==='stock' && typeof it.stock==='number' && it.stock<=0) it.alive = false;
    }
    renderStockTable();
    updateStats();
  };

  const aliveList = () => items.filter(x=>x.alive);

  // ============ Choose / Effects ============
  const choose = () => {
    const alive = aliveList();
    if (alive.length===0) return null;
    if (mode==='random') return alive[Math.floor(Math.random()*alive.length)];
    const total = alive.reduce((s,x)=> s + Math.max(0, x.weight||1), 0);
    let r = Math.random()*total;
    for (const it of alive) { r -= Math.max(0, it.weight||1); if (r<=0) return it; }
    return alive[alive.length-1];
  };

  const applyAfterPick = (pick) => {
    if (!pick) return;
    if (mode==='stock' && typeof pick.stock==='number') {
      // decrease in textarea text
      const lines = $('#cardData').value.split(/\r?\n/);
      for (let i=0;i<lines.length;i++) {
        const p = lines[i].trim().split('|').map(s=>s.trim());
        if (p[0]===pick.name) {
          while (p.length<3) p.push('');
          const cur = parseInt(p[2]||'0',10);
          const next = Math.max(0,(isNaN(cur)?0:cur)-1);
          p[2] = String(next);
          lines[i] = p.join('|');
          break;
        }
      }
      $('#cardData').value = lines.join('\n');
      rebuild();
    } else if ($('#noReplace').checked) {
      removed.add(pick.name);
      // 반영
      items.forEach(it=>{ if (it.name===pick.name) it.alive=false; });
    }
    updateStats();
    save();
  };

  // ============ Board ============
  const cardCount = () => {
    const w = window.innerWidth;
    if (w < 560) return 12;    // 3x4
    if (w < 900) return 16;    // 4x4
    return 20;                 // 5x4
  };

  const newBoard = () => {
    rebuild();
    const n = cardCount();
    boardState = Array.from({length:n}, ()=>({flipped:false, name:null}));
    renderBoard();
    save();
  };

  const renderBoard = () => {
    boardEl.innerHTML = '';
    const order = Array.from(boardState.keys());
    if ($('#autoShuffle').checked) {
      for (let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
    }
    order.forEach(idx=>{
      const cell = document.createElement('div');
      cell.className = 'flip';
      const card = document.createElement('div');
      card.className = 'card'+(boardState[idx].flipped?' flipped disabled':'');
      const inner = document.createElement('div'); inner.className='card-inner';

      // 뒷면: 모두 동일한 "FLIP" (미리 보상 표시하지 않음)
      const back = document.createElement('div'); back.className='face back'; back.textContent='FLIP';

      // 앞면: 뒤집은 후 당첨 결과를 채움
      const front = document.createElement('div'); front.className='face front';
      if (boardState[idx].name) {
        const em = document.createElement('div'); em.className='emoji'; em.textContent = iconOf(boardState[idx].name);
        const nm = document.createElement('div'); nm.className='name'; nm.textContent = boardState[idx].name;
        front.appendChild(em); front.appendChild(nm);
      } else {
        const placeholder = document.createElement('div'); placeholder.className='name'; placeholder.textContent=' ';
        front.appendChild(placeholder);
      }

      inner.appendChild(back); inner.appendChild(front);
      card.appendChild(inner); cell.appendChild(card); boardEl.appendChild(cell);

      if (!boardState[idx].flipped) {
        card.addEventListener('click', () => onFlip(idx, card, front));
      }
    });
    updateStats();
  };

  const onFlip = (idx, cardEl, frontEl) => {
    const pick = choose();
    if (!pick) { alert('뽑을 수 있는 항목이 없습니다.'); return; }

    // 앞면 내용 = 이번에 실제로 뽑힌 결과 (=> 화면과 로직 일치)
    frontEl.innerHTML = '';
    const em = document.createElement('div'); em.className='emoji'; em.textContent = iconOf(pick.name);
    const nm = document.createElement('div'); nm.className='name'; nm.textContent = pick.name;
    frontEl.appendChild(em); frontEl.appendChild(nm);

    // 뒤집기
    requestAnimationFrame(()=> cardEl.classList.add('flipped'));
    boardState[idx].flipped = true;
    boardState[idx].name = pick.name;
    cardEl.classList.add('disabled');

    // 기록 + 재고/중복 처리
    draws.push({name: pick.name, mode});
    renderHistory();
    applyAfterPick(pick);

    // 팝업
    openModal(pick.name);
    save();
  };

  // ============ History / Stats ============
  const renderHistory = () => {
    historyEl.innerHTML = '';
    draws.slice().reverse().forEach(d=>{
      const li = document.createElement('li');
      li.innerHTML = `<span>${d.name}</span> <span style="opacity:.8">(${d.mode})</span>`;
      historyEl.appendChild(li);
    });
  };

  const updateStats = () => {
    totalCardsEl.textContent = items.length;
    remainCardsEl.textContent = items.filter(x=>x.alive).length;
    totalPullsEl.textContent = draws.length;
  };

  // ============ Modal ============
  const openModal = (text) => {
    $('#modalText').textContent = text;
    $('#backdrop').style.display = 'flex';
    setTimeout(()=> $('#modal').classList.add('open'), 10);
  };
  const closeModal = () => {
    $('#modal').classList.remove('open');
    setTimeout(()=> $('#backdrop').style.display='none', 160);
  };
  $('#backdrop').addEventListener('click', e=>{ if (e.target.id==='backdrop') closeModal(); });
  $('#closeModal').addEventListener('click', closeModal);

  // ============ CSV ============
  const exportCSV = () => {
    if (draws.length===0){ alert('내보낼 결과가 없습니다.'); return; }
    const rows = [['order','name','mode']].concat(draws.map((d,i)=>[i+1,d.name,d.mode]));
    const csv = rows.map(r=>r.map(x=>String(x).replace(/"/g,'""')).map(s=>`"${s}"`).join(',')).join('\n');
    const blob = new Blob([csv],{type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='gacha_results.csv'; a.click();
    URL.revokeObjectURL(url);
  };

  // ============ Persistence ============
  const save = () => {
    const state = {
      text: $('#cardData').value,
      draws, mode,
      opts: { noReplace: $('#noReplace').checked, autoShuffle: $('#autoShuffle').checked },
      removed: Array.from(removed),
      board: boardState
    };
    localStorage.setItem('gacha_tabs_v1', JSON.stringify(state));
  };
  const load = () => {
    try {
      const raw = localStorage.getItem('gacha_tabs_v1');
      if (!raw) {
        $('#cardData').value = '금화|10|5\n은화|6|3\n보석|2|1\n꽝|1|999';
        return;
      }
      const s = JSON.parse(raw);
      $('#cardData').value = s.text ?? '';
      draws = s.draws ?? [];
      mode = s.mode ?? 'random';
      (document.querySelector(`input[name="mode"][value="${mode}"]`)||document.querySelector('input[name="mode"][value="random"]')).checked = true;
      if (s.opts) { $('#noReplace').checked = !!s.opts.noReplace; $('#autoShuffle').checked = !!s.opts.autoShuffle; }
      removed = new Set(s.removed ?? []);
      boardState = s.board ?? [];
    } catch(e) { console.warn(e); }
  };

  // ============ Events ============
  document.querySelectorAll('input[name="mode"]').forEach(r=>{
    r.addEventListener('change', e=>{ mode = e.target.value; rebuild(); save(); });
  });

  $('#applyBtn').addEventListener('click', ()=>{ rebuild(); save(); alert('저장 완료'); });
  $('#sampleBtn').addEventListener('click', ()=>{
    $('#cardData').value = '금화|10|5\n은화|6|3\n보석|2|1\n꽝|1|999';
    rebuild(); save();
  });
  $('#clearBtn').addEventListener('click', ()=>{ $('#cardData').value = ''; rebuild(); save(); });

  $('#addRow').addEventListener('click', ()=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="text" placeholder="이름"></td>
      <td><input type="number" step="0.1" min="0" placeholder="가중치"></td>
      <td><div class="qty">
            <button class="btn ghost" type="button">-</button>
            <input type="number" min="0" placeholder="재고">
            <button class="btn ghost" type="button">+</button>
          </div></td>
      <td><button class="btn ghost" type="button">삭제</button></td>`;
    const stockI = tr.querySelector('input[placeholder="재고"]');
    const [minus, plus] = tr.querySelectorAll('button.btn.ghost');
    const del = tr.querySelectorAll('button.btn.ghost')[2];
    tr.querySelectorAll('input').forEach(inp=>inp.addEventListener('input', syncFromTableToTextarea));
    minus.addEventListener('click', ()=>{ const v=parseInt(stockI.value||'0',10); stockI.value=String(Math.max(0,v-1)); syncFromTableToTextarea(); });
    plus.addEventListener('click', ()=>{ const v=parseInt(stockI.value||'0',10); stockI.value=String(Math.max(0,v+1)); syncFromTableToTextarea(); });
    del.addEventListener('click', ()=>{ tr.remove(); syncFromTableToTextarea(); });
    stockBody.appendChild(tr);
  });

  $('#newBoard').addEventListener('click', newBoard);
  $('#resetBoard').addEventListener('click', ()=>{
    removed = new Set(); draws = [];
    boardState.forEach(c=>{ c.flipped=false; c.name=null; });
    renderHistory(); renderBoard(); save();
  });
  $('#exportCSV').addEventListener('click', exportCSV);

  // ============ Init ============
  load();
  rebuild();
  renderHistory();
  if (boardState.length===0) newBoard(); else renderBoard();

})();
</script>
</body>
</html>
