<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>일본어-한국어 드래그 매칭 퀴즈</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Arial", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: linear-gradient(135deg, #f7f4ff, #eef6ff);
      color: #222;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      text-align: center;
      margin: 0 0 10px;
      font-size: 32px;
    }

    .sub {
      text-align: center;
      color: #555;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .topbar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .info {
      background: white;
      padding: 10px 16px;
      border-radius: 14px;
      font-weight: bold;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #6f7cff;
      color: white;
      box-shadow: 0 6px 14px rgba(111,124,255,0.25);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .panel {
      background: rgba(255,255,255,0.82);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.08);
      margin-bottom: 24px;
    }

    .panel h2 {
      margin: 0 0 16px;
      text-align: center;
      font-size: 24px;
    }

    .word-bank {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      min-height: 120px;
    }

    .jp-chip {
      background: #f3e0b8;
      border-radius: 18px;
      min-height: 76px;
      font-size: 30px;
      font-weight: bold;
      padding: 10px;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      user-select: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }

    .jp-chip:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.1);
    }

    .jp-chip.dragging {
      opacity: 0.5;
    }

    .jp-chip.used {
      background: #cfd4df;
      color: #777;
      cursor: default;
      opacity: 0.8;
    }

    .quiz-list {
      display: grid;
      gap: 12px;
    }

    .quiz-row {
      display: grid;
      grid-template-columns: 1fr 1fr 90px;
      gap: 12px;
      align-items: center;
      background: #f8f9ff;
      border-radius: 18px;
      padding: 12px;
    }

    .ko-label {
      font-size: 24px;
      font-weight: bold;
      padding-left: 8px;
    }

    .drop-box {
      min-height: 70px;
      border-radius: 16px;
      border: 3px dashed #b8c0ff;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
      padding: 8px;
      text-align: center;
      transition: all 0.15s ease;
    }

    .drop-box.drag-over {
      background: #eef1ff;
      border-color: #6f7cff;
      transform: scale(1.02);
    }

    .drop-box.filled {
      border-style: solid;
      background: #fff8e7;
      border-color: #d9b96a;
    }

    .drop-box.correct {
      background: #d9f7df;
      border-color: #57b26a;
      color: #185f2a;
    }

    .row-btn {
      padding: 10px 12px;
      font-size: 14px;
      background: #8c97ff;
    }

    .step-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 10px 0 22px;
      flex-wrap: wrap;
    }

    .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #d4d9f7;
    }

    .dot.active {
      background: #6f7cff;
    }

    .dot.done {
      background: #57b26a;
    }

    @media (max-width: 900px) {
      .quiz-row {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 700px) {
      .word-bank {
        grid-template-columns: repeat(2, 1fr);
      }

      .jp-chip {
        font-size: 24px;
      }

      .ko-label, .drop-box {
        font-size: 22px;
      }
    }

    @media (max-width: 480px) {
      .word-bank {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🧩 일본어-한국어 드래그 매칭 퀴즈</h1>
    <div class="sub">
      위의 일본어 단어를 끌어서 아래 뜻 옆의 알맞은 칸에 놓아보세요
    </div>

    <div class="topbar">
      <div class="info">단계 <span id="stepNow">1</span> / <span id="stepTotal">1</span></div>
      <div class="info">완료 <span id="doneCount">0</span> / <span id="stepSize">0</span></div>
      <button id="prevBtn">이전</button>
      <button id="nextBtn">다음</button>
      <button id="resetBtn">처음부터</button>
    </div>

    <div class="step-dots" id="stepDots"></div>

    <section class="panel">
      <h2>🇯🇵 일본어 단어 블록</h2>
      <div class="word-bank" id="wordBank"></div>
    </section>

    <section class="panel">
      <h2>🇰🇷 뜻에 맞는 일본어를 놓으세요</h2>
      <div class="quiz-list" id="quizList"></div>
    </section>
  </div>

  <script>
    const vocab = [
      { id: 1, jp: "すし", ko: "초밥" },
      { id: 2, jp: "ねこ", ko: "고양이" },
      { id: 3, jp: "きもの", ko: "기모노" },
      { id: 4, jp: "そば", ko: "소바" },
      { id: 5, jp: "かつ", ko: "커틀릿" },
      { id: 6, jp: "さくら", ko: "벚꽃" },
      { id: 7, jp: "ゆめ", ko: "꿈" },
      { id: 8, jp: "たこ", ko: "문어" },
      { id: 9, jp: "つなみ", ko: "쓰나미" },
      { id: 10, jp: "いぬ", ko: "강아지" },
      { id: 11, jp: "やま", ko: "산" },
      { id: 12, jp: "くるま", ko: "자동차" },
      { id: 13, jp: "はな", ko: "꽃" },
      { id: 14, jp: "あめ", ko: "비" },
      { id: 15, jp: "りんご", ko: "사과" },
      { id: 16, jp: "みず", ko: "물" },
      { id: 17, jp: "うた", ko: "노래" },
      { id: 18, jp: "やさい", ko: "채소" },
      { id: 19, jp: "みかん", ko: "귤" },
      { id: 20, jp: "いちご", ko: "딸기" },
      { id: 21, jp: "ぶどう", ko: "포도" },
      { id: 22, jp: "もも", ko: "복숭아" },
      { id: 23, jp: "すいか", ko: "수박" },
      { id: 24, jp: "なし", ko: "배" },
      { id: 25, jp: "ばなな", ko: "바나나" },
      { id: 26, jp: "メロン", ko: "멜론" },
      { id: 27, jp: "らーめん", ko: "라면" },
      { id: 28, jp: "からあげ", ko: "가라아게" },
      { id: 29, jp: "うどん", ko: "우동" },
      { id: 30, jp: "カレー", ko: "카레" },
      { id: 31, jp: "たこやき", ko: "타코야키" },
      { id: 32, jp: "やきにく", ko: "야키니쿠" },
      { id: 33, jp: "とんかつ", ko: "돈가스" },
      { id: 34, jp: "おにぎり", ko: "주먹밥" }
    ];

    const STEP_SIZE = 9;

    const wordBank = document.getElementById("wordBank");
    const quizList = document.getElementById("quizList");
    const stepNow = document.getElementById("stepNow");
    const stepTotal = document.getElementById("stepTotal");
    const doneCount = document.getElementById("doneCount");
    const stepSize = document.getElementById("stepSize");
    const stepDots = document.getElementById("stepDots");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const resetBtn = document.getElementById("resetBtn");

    let steps = [];
    let currentStep = 0;
    let placedMaps = [];
    let wordOrders = [];
    let meaningOrders = [];

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function chunkArray(arr, size) {
      const result = [];
      for (let i = 0; i < arr.length; i += size) {
        result.push(arr.slice(i, i + size));
      }
      return result;
    }

    function makeSteps() {
      steps = chunkArray(vocab, STEP_SIZE);
      placedMaps = steps.map(() => ({}));
      wordOrders = steps.map(step => shuffle(step));
      meaningOrders = steps.map(step => shuffle(step));
    }

    function getCurrentStepData() {
      return steps[currentStep];
    }

    function getPlacedMap() {
      return placedMaps[currentStep];
    }

    function getItemById(id) {
      return vocab.find(v => String(v.id) === String(id));
    }

    function countDoneInStep(stepIndex) {
      const step = steps[stepIndex];
      const placed = placedMaps[stepIndex];
      return step.filter(item => placed[item.id] && String(placed[item.id]) === String(item.id)).length;
    }

    function isStepComplete(stepIndex) {
      return countDoneInStep(stepIndex) === steps[stepIndex].length;
    }

    function renderDots() {
      stepDots.innerHTML = "";
      steps.forEach((_, idx) => {
        const dot = document.createElement("div");
        dot.className = "dot";
        if (idx === currentStep) dot.classList.add("active");
        if (isStepComplete(idx)) dot.classList.add("done");
        stepDots.appendChild(dot);
      });
    }

    function renderTopbar() {
      stepNow.textContent = currentStep + 1;
      stepTotal.textContent = steps.length;
      doneCount.textContent = countDoneInStep(currentStep);
      stepSize.textContent = steps[currentStep].length;
      prevBtn.disabled = currentStep === 0;
      nextBtn.disabled = currentStep === steps.length - 1;
    }

    function renderWordBank() {
      wordBank.innerHTML = "";
      const placedMap = getPlacedMap();
      const order = wordOrders[currentStep];

      order.forEach(item => {
        const used = Object.values(placedMap).includes(String(item.id));

        const chip = document.createElement("div");
        chip.className = "jp-chip";
        chip.textContent = item.jp;
        chip.dataset.id = item.id;

        if (used) {
          chip.classList.add("used");
        } else {
          chip.draggable = true;

          chip.addEventListener("dragstart", (e) => {
            chip.classList.add("dragging");
            e.dataTransfer.setData("text/plain", String(item.id));
          });

          chip.addEventListener("dragend", () => {
            chip.classList.remove("dragging");
          });
        }

        wordBank.appendChild(chip);
      });
    }

    function renderQuizList() {
      quizList.innerHTML = "";
      const placedMap = getPlacedMap();
      const order = meaningOrders[currentStep];

      order.forEach(item => {
        const row = document.createElement("div");
        row.className = "quiz-row";

        const ko = document.createElement("div");
        ko.className = "ko-label";
        ko.textContent = item.ko;

        const box = document.createElement("div");
        box.className = "drop-box";
        box.dataset.answerId = item.id;

        if (placedMap[item.id]) {
          const word = getItemById(placedMap[item.id]);
          box.textContent = word.jp;
          box.classList.add("filled", "correct");
        } else {
          box.textContent = "";
        }

        if (!placedMap[item.id]) {
          box.addEventListener("dragover", (e) => {
            e.preventDefault();
            box.classList.add("drag-over");
          });

          box.addEventListener("dragleave", () => {
            box.classList.remove("drag-over");
          });

          box.addEventListener("drop", (e) => {
            e.preventDefault();
            box.classList.remove("drag-over");

            const draggedId = e.dataTransfer.getData("text/plain");
            if (!draggedId) return;

            if (String(draggedId) !== String(item.id)) return;

            placedMap[item.id] = draggedId;
            renderAll();
          });
        }

        const clearBtn = document.createElement("button");
        clearBtn.className = "row-btn";
        clearBtn.textContent = "지우기";
        clearBtn.disabled = !placedMap[item.id];
        clearBtn.addEventListener("click", () => {
          delete placedMap[item.id];
          renderAll();
        });

        row.appendChild(ko);
        row.appendChild(box);
        row.appendChild(clearBtn);
        quizList.appendChild(row);
      });
    }

    function renderAll() {
      renderTopbar();
      renderDots();
      renderWordBank();
      renderQuizList();
    }

    function goStep(index) {
      if (index < 0 || index >= steps.length) return;
      currentStep = index;
      renderAll();
    }

    function resetGame() {
      currentStep = 0;
      makeSteps();
      renderAll();
    }

    prevBtn.addEventListener("click", () => {
      goStep(currentStep - 1);
    });

    nextBtn.addEventListener("click", () => {
      goStep(currentStep + 1);
    });

    resetBtn.addEventListener("click", resetGame);

    resetGame();
  </script>
</body>
</html>
