<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>일본어 수업 단어 디펜스</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            touch-action: manipulation;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100%;
            background-color: #050505;
            overflow: hidden;
            border-left: 1px solid #222;
            border-right: 1px solid #222;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 5;
        }

        .status-text {
            font-size: 14px;
            color: #00ff00;
            text-shadow: 0 0 8px #00ff00;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }

        #energy-container {
            width: 100px;
            height: 10px;
            border: 1px solid #fff;
            background: #222;
            margin-top: 5px;
            border-radius: 5px;
            overflow: hidden;
        }

        #energy-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #0f0, #ff0, #f00);
            transition: width 0.3s;
        }

        /* 모바일 최적화 입력창 */
        #input-container {
            position: absolute;
            bottom: 32%; /* 키보드 높이 고려 */
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            text-align: center;
            z-index: 10;
        }

        input {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ff00;
            border-radius: 12px;
            color: #fff;
            font-size: 28px;
            text-align: center;
            outline: none;
            width: 100%;
            max-width: 180px;
            padding: 12px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }

        #message-box {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #00ff00;
            padding: 30px;
            text-align: center;
            display: none;
            z-index: 20;
            width: 70%;
            border-radius: 15px;
        }

        button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
            border-radius: 8px;
            width: 100%;
        }

        #combo-display {
            position: absolute;
            right: 20px;
            bottom: 120px;
            font-size: 32px;
            font-weight: 900;
            color: #ffff00;
            text-shadow: 2px 2px 0 #000;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-overlay">
            <div>
                <div class="status-text" id="score-display">SCORE: 0</div>
                <div class="status-text" id="level-display">STAGE: PDF WORDS</div>
            </div>
            <div style="text-align: right;">
                <div class="status-text">SHIELD</div>
                <div id="energy-container">
                    <div id="energy-bar"></div>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="combo-display">COMBO 0</div>

        <div id="input-container">
            <input type="text" id="answer-input" placeholder="발음 입력" autocomplete="off" enterkeyhint="done">
        </div>

        <div id="message-box">
            <h2 id="msg-title" style="color:#00ff00; margin-top:0;">LESSON CLEAR?</h2>
            <p id="msg-score">최종 점수: 0</p>
            <button onclick="resetGame()">복습 다시하기</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const input = document.getElementById('answer-input');
        const scoreDisplay = document.getElementById('score-display');
        const energyBar = document.getElementById('energy-bar');
        const messageBox = document.getElementById('message-box');
        const msgScore = document.getElementById('msg-score');
        const comboDisplay = document.getElementById('combo-display');

        // PDF 자료에 기반한 단어 데이터 (30개 이상)
        const wordData = [
            // 지시대명사
            { j: 'これ', k: '코레' }, { j: 'それ', k: '소레' }, { j: 'あれ', k: '아레' }, { j: 'どれ', k: '도레' },
            { j: 'この', k: '코노' }, { j: 'その', k: '소노' }, { j: 'あの', k: '아노' }, { j: 'どの', k: '도노' },
            // 단어 (명사)
            { j: 'ノート', k: '노-토' }, { j: 'ゆめ', k: '유메' }, { j: 'ほん', k: '혼' }, { j: 'つくえ', k: '츠쿠에' },
            { j: 'いす', k: '이스' }, { j: 'えんぴつ', k: '엠피츠' }, { j: 'メガネ', k: '메가네' }, { j: 'がくせい', k: '가쿠세이' },
            { j: 'わたし', k: '와타시' }, { j: 'あなた', k: '아나타' }, { j: 'せんせい', k: '센세이' },
            // 전통 의상
            { j: 'きもの', k: '키모노' }, { j: 'ゆかた', k: '유카타' },
            // 숫자 및 시간
            { j: 'いち', k: '이치' }, { j: 'に', k: '니' }, { j: 'さん', k: '산' }, { j: 'よん', k: '욘' }, { j: 'ご', k: '고' },
            { j: 'ろく', k: '로쿠' }, { j: 'なな', k: '나나' }, { j: 'はち', k: '하치' }, { j: 'きゅう', k: '큐' }, { j: 'じゅう', k: '쥬' },
            { j: 'いちじ', k: '이치지' }, { j: 'よじ', k: '요지' }, { j: 'しちじ', k: '시치지' }, { j: 'くじ', k: '쿠지' }
        ];

        let gameState = 'playing';
        let score = 0;
        let energy = 100;
        let enemies = [];
        let bullets = [];
        let particles = [];
        let combo = 0;
        let spawnTimer = 0;
        let spawnInterval = 120;
        let gameSpeed = 0.7;

        function resize() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Enemy {
            constructor() {
                const data = wordData[Math.floor(Math.random() * wordData.length)];
                this.text = data.j;
                this.answer = data.k;
                this.x = Math.random() * (canvas.width - 120) + 60;
                this.y = -50;
                this.speed = (Math.random() * 0.3 + 0.5) * gameSpeed;
                this.isTargeted = false;
                this.isDead = false;
                this.color = '#00ff00';
            }

            draw() {
                ctx.save();
                ctx.fillStyle = this.color;
                // 도트 로봇 디자인
                ctx.fillRect(this.x - 20, this.y - 15, 40, 15);
                ctx.fillRect(this.x - 25, this.y - 10, 50, 10);
                
                // 안테나
                ctx.fillStyle = (this.isTargeted && Math.floor(Date.now()/100)%2) ? '#fff' : '#f00';
                ctx.fillRect(this.x - 2, this.y - 20, 4, 5);
                
                // 텍스트
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 22px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(this.text, this.x, this.y + 35);
                ctx.restore();
            }

            update() {
                this.y += this.speed;
                if (this.y > canvas.height - 120) {
                    takeDamage();
                    return false;
                }
                return !this.isDead;
            }
        }

        class Bullet {
            constructor(target) {
                this.target = target;
                this.x = canvas.width / 2;
                this.y = canvas.height - 80;
                this.speed = 18;
            }

            draw() {
                ctx.fillStyle = '#0ff';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#0ff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            update() {
                if (!enemies.includes(this.target) || this.target.isDead) return false;

                const dx = this.target.x - this.x;
                const dy = this.target.y - this.y;
                const dist = Math.hypot(dx, dy);

                if (dist < 20) {
                    this.onHit();
                    return false;
                }

                this.x += (dx / dist) * this.speed;
                this.y += (dy / dist) * this.speed;
                return true;
            }

            onHit() {
                this.target.isDead = true;
                createExplosion(this.target.x, this.target.y);
                combo++;
                showCombo();
                score += 10 + (Math.floor(combo/5) * 5);
                scoreDisplay.innerText = `SCORE: ${score}`;
                
                // 난이도 상승
                if (score > 0 && score % 100 === 0) {
                    gameSpeed += 0.1;
                    spawnInterval = Math.max(40, spawnInterval - 10);
                }
            }
        }

        class Particle {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8;
                this.life = 1.0;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                this.life -= 0.05;
                return this.life > 0;
            }
            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = '#0ff';
                ctx.fillRect(this.x, this.y, 4, 4);
                ctx.globalAlpha = 1.0;
            }
        }

        function showCombo() {
            if (combo < 2) return;
            comboDisplay.innerText = `COMBO ${combo}`;
            comboDisplay.style.opacity = '1';
            setTimeout(() => { if(gameState === 'playing') comboDisplay.style.opacity = '0'; }, 1000);
        }

        function takeDamage() {
            energy -= 10;
            combo = 0;
            energyBar.style.width = Math.max(0, energy) + '%';
            if (energy <= 0) gameOver();
        }

        function gameOver() {
            gameState = 'over';
            messageBox.style.display = 'block';
            msgScore.innerText = `최종 점수: ${score}`;
            comboDisplay.style.opacity = '0';
        }

        function resetGame() {
            score = 0; energy = 100; combo = 0;
            enemies = []; bullets = []; particles = [];
            gameSpeed = 0.7; spawnInterval = 120;
            gameState = 'playing';
            messageBox.style.display = 'none';
            energyBar.style.width = '100%';
            scoreDisplay.innerText = 'SCORE: 0';
            input.value = '';
            input.focus();
            animate();
        }

        input.addEventListener('input', (e) => {
            if (gameState !== 'playing') return;
            const val = e.target.value.trim();
            if (val === '') return;

            const target = enemies.find(en => en.answer === val && !en.isTargeted && !en.isDead);
            if (target) {
                target.isTargeted = true;
                bullets.push(new Bullet(target));
                input.value = '';
            }
        });

        function createExplosion(x, y) {
            for (let i = 0; i < 15; i++) particles.push(new Particle(x, y));
        }

        function drawBackground() {
            // 배경 그리드
            ctx.strokeStyle = 'rgba(0, 255, 0, 0.1)';
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=50) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            
            // 하단 대기 지역
            ctx.fillStyle = 'rgba(0, 255, 0, 0.05)';
            ctx.fillRect(0, canvas.height - 100, canvas.width, 100);

            // 포탑
            ctx.fillStyle = '#fff';
            ctx.fillRect(canvas.width/2 - 2, canvas.height - 80, 4, 25);
            ctx.fillStyle = '#0ff';
            ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height - 80, 8, 0, Math.PI*2); ctx.fill();
        }

        function animate() {
            if (gameState !== 'playing') return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();

            spawnTimer++;
            if (spawnTimer >= spawnInterval) {
                enemies.push(new Enemy());
                spawnTimer = 0;
            }

            enemies = enemies.filter(enemy => {
                const active = enemy.update();
                if (active) enemy.draw();
                return active;
            });

            bullets = bullets.filter(bullet => {
                const active = bullet.update();
                if (active) bullet.draw();
                return active;
            });

            particles = particles.filter(p => {
                const active = p.update();
                if (active) p.draw();
                return active;
            });

            requestAnimationFrame(animate);
        }

        canvas.addEventListener('touchstart', () => { if (gameState === 'playing') input.focus(); });
        resetGame();
    </script>
</body>
</html>t
