<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Fire Breaker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        body {
            margin: 0;
            overflow: hidden;
            background-color: #020617;
            font-family: 'Orbitron', sans-serif;
            touch-action: none;
            color: #f8fafc;
        }
        canvas {
            background: #000;
            display: block;
            margin: 0 auto;
            box-shadow: 0 0 30px rgba(249, 115, 22, 0.2);
            border: 2px solid #1e293b;
            border-radius: 12px;
            cursor: crosshair;
        }
        #messageBox {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(2, 6, 23, 0.9);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 2rem;
            border: 1px solid rgba(249, 115, 22, 0.5);
            text-align: center;
            display: none;
            z-index: 100;
            box-shadow: 0 20px 50px rgba(0,0,0,1);
        }
        .neon-text {
            text-shadow: 0 0 10px rgba(249, 115, 22, 0.8), 0 0 20px rgba(249, 115, 22, 0.5);
        }
        .stats-label {
            font-size: 0.65rem;
            color: #94a3b8;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-[600px] flex justify-between items-end mb-6">
        <div>
            <div class="stats-label">Level</div>
            <div class="text-3xl font-black neon-text" id="levelDisplay">1</div>
        </div>
        <div class="text-center">
            <div class="stats-label">Score</div>
            <div class="text-3xl font-black neon-text" id="scoreDisplay">0</div>
        </div>
        <div class="text-right">
            <div class="stats-label">Lives</div>
            <div class="text-3xl font-black text-rose-500" id="livesDisplay">3</div>
        </div>
    </div>

    <div class="relative">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="messageBox">
        <h2 id="msgTitle" class="text-5xl font-black mb-4 neon-text text-orange-500">FIRE BREAKER</h2>
        <p id="msgStats" class="text-orange-200/60 mb-8 font-mono tracking-widest"></p>
        <button id="mainBtn" onclick="handleMainBtn()" class="bg-orange-600 hover:bg-orange-400 text-white font-black py-4 px-12 rounded-full transition-all transform hover:scale-110 shadow-[0_0_20px_rgba(249,115,22,0.6)]">
            IGNITE ENGINE
        </button>
    </div>

    <div class="mt-8 grid grid-cols-2 sm:grid-cols-4 gap-6 text-[10px] font-bold text-slate-500 tracking-widest">
        <div class="flex items-center gap-2"><span class="w-2 h-2 bg-indigo-500 rounded-full shadow-[0_0_8px_#6366f1]"></span> PADDLE WIDE</div>
        <div class="flex items-center gap-2"><span class="w-2 h-2 bg-emerald-500 rounded-full shadow-[0_0_8px_#10b981]"></span> SLOW TIME</div>
        <div class="flex items-center gap-2"><span class="w-2 h-2 bg-amber-500 rounded-full shadow-[0_0_8px_#f59e0b]"></span> POWER BALL</div>
        <div class="flex items-center gap-2"><span class="w-2 h-2 bg-fuchsia-500 rounded-full shadow-[0_0_8px_#d946ef]"></span> MULTI BALL</div>
    </div>

    <script>
        // --- AUDIO ENGINE ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type, duration, vol = 0.1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + duration);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const SFX = {
            hit: () => playSound(400, 'square', 0.1),
            wall: () => playSound(200, 'sine', 0.05, 0.05),
            paddle: () => playSound(300, 'triangle', 0.15),
            item: () => playSound(800, 'sine', 0.3, 0.15),
            explode: () => playSound(100, 'sawtooth', 0.5, 0.2),
            lose: () => playSound(150, 'sawtooth', 0.8, 0.2),
            win: () => {
                playSound(523, 'sine', 0.2);
                setTimeout(() => playSound(659, 'sine', 0.2), 100);
                setTimeout(() => playSound(783, 'sine', 0.4), 200);
            }
        };

        // --- GAME ENGINE ---
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("scoreDisplay");
        const levelEl = document.getElementById("levelDisplay");
        const livesEl = document.getElementById("livesDisplay");
        const messageBox = document.getElementById("messageBox");

        let score = 0, level = 1, lives = 3, gameRunning = false;
        const canvasWidth = 600, canvasHeight = 450;
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;

        let particles = [];
        let shakeTime = 0;

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y;
                this.color = color;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 8;
                this.speedY = (Math.random() - 0.5) * 8;
                this.life = 1.0;
                this.decay = Math.random() * 0.05 + 0.02;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                this.life -= this.decay;
            }
            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        class Ball {
            constructor(x, y, dx, dy) {
                this.x = x; this.y = y;
                this.dx = dx; this.dy = dy;
                this.radius = 8; // 불꽃 느낌을 위해 약간 키움
                this.history = [];
            }
            update() {
                // 불꽃 잔상 데이터 저장
                this.history.push({x: this.x, y: this.y, r: Math.random() * 5 + 2});
                if(this.history.length > 12) this.history.shift();
                this.x += this.dx; this.y += this.dy;
            }
            draw() {
                // 1. 불꽃 꼬리 (Flame Tail)
                this.history.forEach((pos, i) => {
                    const ratio = i / this.history.length;
                    const alpha = ratio * 0.5;
                    const size = pos.r * ratio * 1.5;
                    
                    ctx.beginPath();
                    // 위치에 약간의 랜덤성을 주어 일렁이는 느낌 부여
                    ctx.arc(pos.x + (Math.random()-0.5)*4, pos.y + (Math.random()-0.5)*4, size, 0, Math.PI*2);
                    
                    if (activeEffects.power > 0) {
                        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                    } else {
                        // 빨간색 -> 주황색 -> 노란색 순서로 그라데이션 느낌
                        const r = 255;
                        const g = Math.floor(100 + ratio * 155);
                        const b = Math.floor(ratio * 50);
                        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                    }
                    ctx.fill();
                });

                // 2. 공 본체 (Flame Core)
                const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
                if (activeEffects.power > 0) {
                    grad.addColorStop(0, "#fff");
                    grad.addColorStop(1, "#3b82f6");
                    ctx.shadowColor = "#60a5fa";
                } else {
                    grad.addColorStop(0, "#fff7ed"); // 노란 중심
                    grad.addColorStop(0.4, "#fbbf24"); // 오렌지
                    grad.addColorStop(1, "#ef4444"); // 빨강 외곽
                    ctx.shadowColor = "#f97316";
                }

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                ctx.fillStyle = grad;
                ctx.shadowBlur = 15;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        let balls = [], bricks = [], items = [];
        let paddleX, paddleWidth = 100, paddleHeight = 12;
        let rightPressed = false, leftPressed = false;
        let activeEffects = { expand: 0, power: 0 };
        let currentSequence = 1, gateOpen = false;

        const levelSettings = [
            { rows: 3, cols: 6, speed: 4, puzzles: ['sequence'] },
            { rows: 4, cols: 7, speed: 5, puzzles: ['portal'] },
            { rows: 5, cols: 8, speed: 6, puzzles: ['gate'] },
            { rows: 6, cols: 8, speed: 6.5, puzzles: ['sequence', 'portal'] },
            { rows: 7, cols: 9, speed: 7, puzzles: ['sequence', 'gate', 'portal'] }
        ];

        function createExplosion(x, y, color, count = 10) {
            for(let i=0; i<count; i++) particles.push(new Particle(x, y, color));
        }

        function initLevel() {
            const config = levelSettings[level - 1];
            const brickPadding = 8, offsetTop = 60, offsetLeft = 40;
            const bw = (canvas.width - (offsetLeft * 2) - (config.cols - 1) * brickPadding) / config.cols;
            const bh = 22;

            bricks = []; currentSequence = 1; gateOpen = false;
            let seq = 1, portA = false, portB = false;

            for(let c=0; c<config.cols; c++) {
                bricks[c] = [];
                for(let r=0; r<config.rows; r++) {
                    let type = "normal", hits = 1, extra = null;
                    const rand = Math.random();

                    if(config.puzzles.includes('sequence') && rand < 0.15 && seq <= 4) { type = "seq"; extra = seq++; }
                    else if(config.puzzles.includes('gate') && c === 0 && r === 0) type = "switch";
                    else if(config.puzzles.includes('gate') && c === config.cols-1 && r === 0) type = "gate";
                    else if(config.puzzles.includes('portal') && rand < 0.08 && !portA) { type = "portal"; extra = "A"; portA = true; }
                    else if(config.puzzles.includes('portal') && rand < 0.08 && !portB) { type = "portal"; extra = "B"; portB = true; }
                    else if(rand < 0.1) { type = "hard"; hits = 2; }
                    else if(rand < 0.12) type = "explosive";

                    bricks[c][r] = { x: c*(bw+brickPadding)+offsetLeft, y: r*(bh+brickPadding)+offsetTop, w: bw, h: bh, status: hits, type, extra };
                }
            }
            resetPositions();
        }

        function resetPositions() {
            const s = levelSettings[level-1].speed;
            balls = [new Ball(canvas.width/2, canvas.height-50, s, -s)];
            paddleX = (canvas.width - paddleWidth)/2;
            items = [];
            activeEffects = { expand: 0, power: 0 };
            paddleWidth = 100;
        }

        function collisionDetection(ball) {
            const config = levelSettings[level - 1];
            for(let c=0; c < config.cols; c++) {
                for(let r=0; r < config.rows; r++) {
                    const b = bricks[c][r];
                    if(b.status > 0) {
                        if(ball.x + ball.radius > b.x && ball.x - ball.radius < b.x + b.w &&
                           ball.y + ball.radius > b.y && ball.y - ball.radius < b.y + b.h) {
                            handleBrickCollision(ball, b, c, r);
                            return;
                        }
                    }
                }
            }
        }

        function handleBrickCollision(ball, b, c, r) {
            if(b.type === "portal") {
                teleport(ball, b); return;
            }
            if(b.type === "gate" && !gateOpen) {
                ball.dy *= -1; SFX.wall(); return;
            }
            if(b.type === "seq") {
                if(b.extra === currentSequence) {
                    currentSequence++; b.status = 0; score += 50; 
                    createExplosion(b.x + b.w/2, b.y + b.h/2, "#fff");
                    SFX.hit(); ball.dy *= -1;
                } else { ball.dy *= -1; SFX.wall(); }
                return;
            }

            if(activeEffects.power <= 0) ball.dy *= -1;
            b.status--;
            score += 10;
            SFX.hit();
            createExplosion(b.x + b.w/2, b.y + b.h/2, getBrickColor(b));

            if(b.status === 0) {
                if(b.type === "explosive") {
                    SFX.explode(); shakeTime = 15;
                    explodeBricks(c, r);
                }
                if(b.type === "switch") { gateOpen = true; SFX.win(); }
                if(Math.random() < 0.2) dropItem(b.x + b.w/2, b.y + b.h/2);
            }
            scoreEl.innerText = score;
        }

        function teleport(ball, startPortal) {
            const other = bricks.flat().find(b => b.type === "portal" && b !== startPortal);
            if (other) {
                ball.x = other.x + other.w/2;
                ball.y = other.y + other.h/2;
                SFX.item();
            }
        }

        function explodeBricks(c, r) {
            for(let i=c-1; i<=c+1; i++) {
                for(let j=r-1; j<=r+1; j++) {
                    if(bricks[i]?.[j] && bricks[i][j].status > 0 && bricks[i][j].type !== "gate" && bricks[i][j].type !== "seq") {
                        createExplosion(bricks[i][j].x + bricks[i][j].w/2, bricks[i][j].y + bricks[i][j].h/2, "#f97316");
                        bricks[i][j].status = 0; score += 15;
                    }
                }
            }
        }

        function dropItem(x, y) {
            const types = [
                {t:'expand', c:'#6366f1', l:'WIDE'}, {t:'slow', c:'#10b981', l:'SLOW'},
                {t:'power', c:'#f59e0b', l:'POWER'}, {t:'multi', c:'#d946ef', l:'MULTI'}
            ];
            items.push({ x, y, dy: 2, ...types[Math.floor(Math.random()*types.length)] });
        }

        function getBrickColor(b) {
            if(b.type === "seq") return "#fff";
            if(b.type === "switch") return "#22d3ee";
            if(b.type === "gate") return gateOpen ? "#475569" : "#ef4444";
            if(b.type === "portal") return b.extra === "A" ? "#3b82f6" : "#f97316";
            if(b.type === "hard") return "#94a3b8";
            if(b.type === "explosive") return "#f97316";
            return `hsl(${(b.y * 0.5 + level * 50) % 360}, 70%, 60%)`;
        }

        function draw() {
            if(!gameRunning) return;
            
            ctx.save();
            if(shakeTime > 0) {
                ctx.translate((Math.random()-0.5)*shakeTime, (Math.random()-0.5)*shakeTime);
                shakeTime--;
            }

            ctx.fillStyle = "rgba(0,0,0,0.4)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            bricks.flat().forEach(b => {
                if(b.status <= 0) return;
                ctx.beginPath();
                ctx.roundRect(b.x, b.y, b.w, b.h, 4);
                ctx.fillStyle = getBrickColor(b);
                if(b.type === "gate" && !gateOpen) {
                    ctx.shadowBlur = 10; ctx.shadowColor = "#ef4444";
                }
                ctx.fill();
                ctx.shadowBlur = 0;
                if(b.type === "seq") {
                    ctx.fillStyle = "#000"; ctx.font = "bold 12px Orbitron";
                    ctx.textAlign="center"; ctx.fillText(b.extra, b.x+b.w/2, b.y+b.h/2+5);
                }
            });

            ctx.beginPath();
            ctx.roundRect(paddleX, canvas.height-25, paddleWidth, paddleHeight, 6);
            ctx.fillStyle = activeEffects.expand > 0 ? "#818cf8" : "#6366f1";
            ctx.shadowBlur = 15; ctx.shadowColor = "#6366f1";
            ctx.fill();
            ctx.shadowBlur = 0;

            items.forEach((it, i) => {
                it.y += it.dy;
                ctx.beginPath();
                ctx.arc(it.x, it.y, 10, 0, Math.PI*2);
                ctx.fillStyle = it.c;
                ctx.fill();
                ctx.fillStyle = "#fff"; ctx.font = "bold 8px Orbitron";
                ctx.textAlign="center"; ctx.fillText(it.l[0], it.x, it.y+3);
                
                if(it.y > canvas.height-35 && it.x > paddleX && it.x < paddleX+paddleWidth) {
                    SFX.item();
                    if(it.t==='expand') { activeEffects.expand = 10; paddleWidth = 160; }
                    if(it.t==='slow') balls.forEach(bl => { bl.dx*=0.7; bl.dy*=0.7; });
                    if(it.t==='power') activeEffects.power = 8;
                    if(it.t==='multi') balls.push(new Ball(it.x, canvas.height-50, 4, -4));
                    items.splice(i, 1);
                } else if(it.y > canvas.height) {
                    items.splice(i, 1);
                }
            });

            for(let i=balls.length-1; i>=0; i--) {
                const bl = balls[i];
                bl.update();
                bl.draw();
                collisionDetection(bl);

                if(bl.x + bl.dx > canvas.width - bl.radius || bl.x + bl.dx < bl.radius) { bl.dx *= -1; SFX.wall(); }
                if(bl.y + bl.dy < bl.radius) { bl.dy *= -1; SFX.wall(); }
                else if(bl.y + bl.dy > canvas.height - 25) {
                    if(bl.x > paddleX && bl.x < paddleX + paddleWidth) {
                        SFX.paddle();
                        let hitPos = (bl.x - (paddleX + paddleWidth/2)) / (paddleWidth/2);
                        let speed = Math.sqrt(bl.dx**2 + bl.dy**2);
                        bl.dx = hitPos * speed;
                        bl.dy = -Math.sqrt(Math.abs(speed**2 - bl.dx**2));
                    } else {
                        balls.splice(i, 1);
                        if(balls.length === 0) {
                            lives--; livesEl.innerText = lives; SFX.lose();
                            if(lives <= 0) gameOver(); else resetPositions();
                        }
                    }
                }
            }

            particles.forEach((p, i) => {
                p.update(); p.draw();
                if(p.life <= 0) particles.splice(i, 1);
            });

            if(activeEffects.expand > 0) activeEffects.expand -= 0.016; else paddleWidth = 100;
            if(activeEffects.power > 0) activeEffects.power -= 0.016;

            if(rightPressed && paddleX < canvas.width - paddleWidth) paddleX += 10;
            if(leftPressed && paddleX > 0) paddleX -= 10;

            if(bricks.flat().filter(b => b.status > 0).length === 0) levelUp();

            ctx.restore();
            requestAnimationFrame(draw);
        }

        function levelUp() {
            gameRunning = false; SFX.win();
            if(level < 5) {
                showModal("LEVEL COMPLETE", `SCORE: ${score}`, "NEXT LEVEL", () => { level++; levelEl.innerText = level; startGame(); });
            } else showModal("LEGENDARY!", "YOU CONQUERED ALL LEVELS", "RESTART", () => location.reload());
        }

        function gameOver() {
            gameRunning = false;
            showModal("SYSTEM HALT", `FINAL SCORE: ${score}`, "RETRY", () => location.reload());
        }

        function showModal(title, stats, btn, action) {
            document.getElementById("msgTitle").innerText = title;
            document.getElementById("msgStats").innerText = stats;
            document.getElementById("mainBtn").innerText = btn;
            messageBox.style.display = "block";
            window.nextAction = action;
        }

        function handleMainBtn() { if(window.nextAction) window.nextAction(); }
        function startGame() { messageBox.style.display = "none"; initLevel(); gameRunning = true; draw(); }

        document.addEventListener("keydown", e => {
            if(e.key === "ArrowRight") rightPressed = true;
            if(e.key === "ArrowLeft") leftPressed = true;
        });
        document.addEventListener("keyup", e => {
            if(e.key === "ArrowRight") rightPressed = false;
            if(e.key === "ArrowLeft") leftPressed = false;
        });
        canvas.addEventListener("mousemove", e => {
            const rect = canvas.getBoundingClientRect();
            paddleX = e.clientX - rect.left - paddleWidth/2;
            if(paddleX < 0) paddleX = 0;
            if(paddleX > canvas.width - paddleWidth) paddleX = canvas.width - paddleWidth;
        });
        canvas.addEventListener("touchmove", e => {
            const rect = canvas.getBoundingClientRect();
            paddleX = e.touches[0].clientX - rect.left - paddleWidth/2;
            if(paddleX < 0) paddleX = 0;
            if(paddleX > canvas.width - paddleWidth) paddleX = canvas.width - paddleWidth;
            e.preventDefault();
        }, {passive:false});

        window.onload = () => showModal("NEON BREAKER", "USE LOGIC & REFLEXES", "INITIALIZE", startGame);
    </script>
</body>
</html>
