<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Fire Breaker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        body {
            margin: 0;
            overflow: hidden;
            background-color: #020617;
            font-family: 'Orbitron', sans-serif;
            touch-action: none;
            color: #f8fafc;
        }
        canvas {
            background: #000;
            display: block;
            margin: 0 auto;
            box-shadow: 0 0 30px rgba(249, 115, 22, 0.2);
            border: 2px solid #1e293b;
            border-radius: 12px;
            cursor: crosshair;
        }
        #messageBox {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(2, 6, 23, 0.95);
            backdrop-filter: blur(15px);
            padding: 2.5rem;
            border-radius: 2rem;
            border: 2px solid rgba(249, 115, 22, 0.5);
            text-align: center;
            display: none;
            z-index: 100;
            box-shadow: 0 20px 50px rgba(0,0,0,1);
            min-width: 320px;
        }
        .neon-text {
            text-shadow: 0 0 10px rgba(249, 115, 22, 0.8), 0 0 20px rgba(249, 115, 22, 0.5);
        }
        .stats-label {
            font-size: 0.65rem;
            color: #94a3b8;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-[600px] flex justify-between items-end mb-6">
        <div>
            <div class="stats-label">Level</div>
            <div class="text-3xl font-black neon-text" id="levelDisplay">1</div>
        </div>
        <div class="text-center">
            <div class="stats-label">Score</div>
            <div class="text-3xl font-black neon-text" id="scoreDisplay">0</div>
        </div>
        <div class="text-right">
            <div class="stats-label">Lives</div>
            <div class="text-3xl font-black text-rose-500" id="livesDisplay">3</div>
        </div>
    </div>

    <div class="relative">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="messageBox">
        <h2 id="msgTitle" class="text-4xl font-black mb-4 neon-text text-orange-500 uppercase">FIRE BREAKER</h2>
        <p id="msgStats" class="text-orange-200/60 mb-8 font-mono tracking-widest text-sm"></p>
        <button id="mainBtn" onclick="handleMainBtn()" class="bg-orange-600 hover:bg-orange-500 text-white font-black py-4 px-12 rounded-full transition-all transform hover:scale-105 active:scale-95 shadow-[0_0_20px_rgba(249,115,22,0.6)]">
            INITIALIZE
        </button>
    </div>

    <!-- 아이템 설명 가이드 -->
    <div class="mt-8 grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 gap-4 text-[9px] font-bold text-slate-500 tracking-tighter uppercase">
        <div class="flex items-center gap-2"><span class="w-2 h-2 bg-indigo-500 rounded-full"></span> Wide</div>
        <div class="flex items-center gap-2"><span class="w-2 h-2 bg-emerald-500 rounded-full"></span> Slow</div>
        <div class="flex items-center gap-2"><span class="w-2 h-2 bg-amber-500 rounded-full"></span> Power</div>
        <div class="flex items-center gap-2"><span class="w-2 h-2 bg-fuchsia-500 rounded-full"></span> Multi</div>
        <div class="flex items-center gap-2"><span class="w-2 h-2 bg-red-500 rounded-full"></span> Laser</div>
        <div class="flex items-center gap-2"><span class="w-2 h-2 bg-cyan-400 rounded-full"></span> Magnet</div>
        <div class="flex items-center gap-2"><span class="w-2 h-2 bg-rose-600 rounded-full"></span> Life</div>
        <div class="flex items-center gap-2"><span class="w-2 h-2 bg-purple-500 rounded-full"></span> Gravity</div>
    </div>

    <script>
        // --- 오디오 엔진 ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type, duration, vol = 0.1) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + duration);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        const SFX = {
            hit: () => playSound(400, 'square', 0.1),
            wall: () => playSound(200, 'sine', 0.05, 0.05),
            paddle: () => playSound(300, 'triangle', 0.15),
            item: () => playSound(800, 'sine', 0.3, 0.15),
            explode: () => playSound(100, 'sawtooth', 0.5, 0.2),
            lose: () => playSound(150, 'sawtooth', 0.8, 0.2),
            laser: () => playSound(1200, 'square', 0.1, 0.05),
            win: () => {
                playSound(523, 'sine', 0.2);
                setTimeout(() => playSound(659, 'sine', 0.2), 100);
                setTimeout(() => playSound(783, 'sine', 0.4), 200);
            }
        };

        // --- 게임 엔진 변수 ---
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("scoreDisplay");
        const levelEl = document.getElementById("levelDisplay");
        const livesEl = document.getElementById("livesDisplay");
        const messageBox = document.getElementById("messageBox");

        const canvasWidth = 600, canvasHeight = 450;
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;

        let score = 0, level = 1, lives = 3, gameRunning = false;
        let particles = [];
        let shakeTime = 0;
        let balls = [], bricks = [], items = [], lasers = [];
        let paddleX, paddleWidth = 100, paddleHeight = 12;
        let rightPressed = false, leftPressed = false;
        let activeEffects = { expand: 0, power: 0, laser: 0, magnet: 0 };
        let currentSequence = 1;
        let laserTimer = 0;

        const levelSettings = [
            { rows: 3, cols: 6, speed: 4, puzzles: ['normal'] },
            { rows: 4, cols: 7, speed: 4.5, puzzles: ['shield'] },
            { rows: 5, cols: 8, speed: 5, puzzles: ['sequence'] },
            { rows: 6, cols: 8, speed: 5.5, puzzles: ['shield', 'sequence'] },
            { rows: 7, cols: 9, speed: 6, puzzles: ['all'] }
        ];

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y;
                this.color = color;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 8;
                this.speedY = (Math.random() - 0.5) * 8;
                this.life = 1.0;
                this.decay = Math.random() * 0.05 + 0.02;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                this.life -= this.decay;
            }
            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        class Ball {
            constructor(x, y, dx, dy) {
                this.x = x; this.y = y;
                this.dx = dx; this.dy = dy;
                this.radius = 7;
                this.history = [];
                this.isStuck = false; // Magnet 효과용
                this.stuckXOffset = 0;
            }
            update() {
                if(this.isStuck) {
                    this.x = paddleX + this.stuckXOffset;
                    this.y = canvas.height - 25 - this.radius;
                    return;
                }
                this.history.push({x: this.x, y: this.y});
                if(this.history.length > 8) this.history.shift();
                this.x += this.dx; 
                this.y += this.dy;
            }
            draw() {
                this.history.forEach((pos, i) => {
                    const ratio = i / this.history.length;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, this.radius * ratio, 0, Math.PI*2);
                    ctx.fillStyle = activeEffects.power > 0 ? `rgba(147, 197, 253, ${ratio * 0.3})` : `rgba(249, 115, 22, ${ratio * 0.3})`;
                    ctx.fill();
                });

                const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
                if (activeEffects.power > 0) {
                    grad.addColorStop(0, "#fff"); grad.addColorStop(1, "#3b82f6");
                    ctx.shadowColor = "#60a5fa";
                } else {
                    grad.addColorStop(0, "#fff"); grad.addColorStop(0.5, "#fbbf24"); grad.addColorStop(1, "#ef4444");
                    ctx.shadowColor = "#f97316";
                }
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                ctx.fillStyle = grad;
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            launch() {
                if(!this.isStuck) return;
                this.isStuck = false;
                this.dy = -Math.abs(this.dy);
                SFX.paddle();
            }
        }

        function createExplosion(x, y, color, count = 12) {
            for(let i=0; i<count; i++) particles.push(new Particle(x, y, color));
        }

        function initLevel() {
            const config = levelSettings[level - 1];
            const brickPadding = 8, offsetTop = 60, offsetLeft = 40;
            const bw = (canvas.width - (offsetLeft * 2) - (config.cols - 1) * brickPadding) / config.cols;
            const bh = 22;

            bricks = []; 
            currentSequence = 1;
            let seqNum = 1;

            for(let c=0; c<config.cols; c++) {
                bricks[c] = [];
                for(let r=0; r<config.rows; r++) {
                    let type = "normal", hits = 1, extra = null;
                    const rand = Math.random();

                    if(config.puzzles.includes('shield') && rand < 0.15) {
                        type = "shield"; hits = 3;
                    } else if(config.puzzles.includes('sequence') && rand < 0.1 && seqNum <= 3) {
                        type = "seq"; extra = seqNum++;
                    } else if(rand < 0.1) {
                        type = "explosive";
                    } else if(rand < 0.05) {
                        type = "bonus";
                    }

                    bricks[c][r] = { x: c*(bw+brickPadding)+offsetLeft, y: r*(bh+brickPadding)+offsetTop, w: bw, h: bh, status: hits, type, extra };
                }
            }
            resetPositions();
        }

        function resetPositions() {
            const s = levelSettings[level-1].speed;
            balls = [new Ball(canvas.width/2, canvas.height-50, s * (Math.random() > 0.5 ? 1 : -1), -s)];
            paddleX = (canvas.width - paddleWidth)/2;
            items = [];
            lasers = [];
            activeEffects = { expand: 0, power: 0, laser: 0, magnet: 0 };
            paddleWidth = 100;
        }

        function updatePhysics() {
            if(rightPressed && paddleX < canvas.width - paddleWidth) paddleX += 8;
            if(leftPressed && paddleX > 0) paddleX -= 8;

            // 레이저 업데이트
            for(let i=lasers.length-1; i>=0; i--) {
                lasers[i].y -= 10;
                if(lasers[i].y < 0) { lasers.splice(i, 1); continue; }
                
                // 레이저 벽돌 충돌
                let hit = false;
                bricks.flat().forEach(b => {
                    if(b.status > 0 && lasers[i] &&
                       lasers[i].x > b.x && lasers[i].x < b.x + b.w &&
                       lasers[i].y > b.y && lasers[i].y < b.y + b.h) {
                        handleHit(null, b, 0, 0, true);
                        hit = true;
                    }
                });
                if(hit) lasers.splice(i, 1);
            }

            // 공 업데이트
            for(let i=balls.length-1; i>=0; i--) {
                const b = balls[i];
                b.update();

                if(b.isStuck) continue;

                if(b.x + b.radius > canvas.width || b.x - b.radius < 0) {
                    b.dx *= -1; 
                    b.x = b.x < b.radius ? b.radius : canvas.width - b.radius;
                    SFX.wall();
                }
                if(b.y - b.radius < 0) {
                    b.dy *= -1; 
                    b.y = b.radius;
                    SFX.wall();
                }

                if(b.y + b.radius > canvas.height - 25 && b.y - b.radius < canvas.height - 10) {
                    if(b.x > paddleX && b.x < paddleX + paddleWidth) {
                        if(activeEffects.magnet > 0) {
                            b.isStuck = true;
                            b.stuckXOffset = b.x - paddleX;
                        } else {
                            SFX.paddle();
                            let hitPos = (b.x - (paddleX + paddleWidth/2)) / (paddleWidth/2);
                            let speed = Math.sqrt(b.dx**2 + b.dy**2);
                            b.dx = hitPos * speed * 0.9;
                            b.dy = -Math.sqrt(Math.abs(speed**2 - b.dx**2));
                            b.y = canvas.height - 25 - b.radius;
                        }
                    }
                }

                if(b.y - b.radius > canvas.height) {
                    balls.splice(i, 1);
                    if(balls.length === 0) {
                        lives--; livesEl.innerText = lives; SFX.lose();
                        if(lives <= 0) gameOver(); else resetPositions();
                    }
                    continue;
                }

                checkBrickCollision(b);
            }
        }

        function checkBrickCollision(ball) {
            for(let c=0; c < bricks.length; c++) {
                for(let r=0; r < bricks[c].length; r++) {
                    const b = bricks[c][r];
                    if(b.status > 0) {
                        if(ball.x + ball.radius > b.x && ball.x - ball.radius < b.x + b.w &&
                           ball.y + ball.radius > b.y && ball.y - ball.radius < b.y + b.h) {
                            handleHit(ball, b, c, r);
                            return;
                        }
                    }
                }
            }
        }

        function handleHit(ball, b, c, r, isLaser = false) {
            if(!isLaser && b.type === "seq") {
                if(b.extra === currentSequence) {
                    currentSequence++;
                } else {
                    ball.dy *= -1; SFX.wall(); return;
                }
            }

            if (!isLaser && ball && activeEffects.power <= 0) {
                const overlapX = Math.min(ball.x + ball.radius - b.x, b.x + b.w - (ball.x - ball.radius));
                const overlapY = Math.min(ball.y + ball.radius - b.y, b.y + b.h - (ball.y - ball.radius));
                if (overlapX < overlapY) ball.dx *= -1; else ball.dy *= -1;
            }

            b.status--;
            score += b.type === "bonus" ? 50 : 10;
            scoreEl.innerText = score;
            SFX.hit();
            createExplosion(b.x + b.w/2, b.y + b.h/2, getBrickColor(b));

            if(b.status === 0) {
                if(b.type === "explosive") {
                    SFX.explode(); shakeTime = 12;
                    explodeNearby(c, r);
                }
                // 아이템 드롭률 상향 (20%)
                if(Math.random() < 0.20) dropItem(b.x + b.w/2, b.y + b.h/2);
            }
        }

        function explodeNearby(c, r) {
            for(let i=c-1; i<=c+1; i++) {
                for(let j=r-1; j<=r+1; j++) {
                    if(bricks[i] && bricks[i][j] && bricks[i][j].status > 0) {
                        createExplosion(bricks[i][j].x + bricks[i][j].w/2, bricks[i][j].y + bricks[i][j].h/2, "#f97316");
                        bricks[i][j].status = 0; score += 10;
                    }
                }
            }
        }

        function dropItem(x, y) {
            const types = [
                {t:'expand', c:'#6366f1', l:'W'}, {t:'slow', c:'#10b981', l:'S'},
                {t:'power', c:'#f59e0b', l:'P'}, {t:'multi', c:'#d946ef', l:'M'},
                {t:'laser', c:'#ef4444', l:'L'}, {t:'magnet', c:'#22d3ee', l:'G'},
                {t:'life', c:'#e11d48', l:'H'}, {t:'gravity', c:'#a855f7', l:'V'}
            ];
            items.push({ x, y, dy: 2, ...types[Math.floor(Math.random()*types.length)] });
        }

        function getBrickColor(b) {
            if(b.type === "seq") return "#ffffff";
            if(b.type === "shield") return b.status === 3 ? "#3b82f6" : (b.status === 2 ? "#60a5fa" : "#93c5fd");
            if(b.type === "bonus") return "#facc15";
            if(b.type === "explosive") return "#f97316";
            return `hsl(${(b.y * 0.4 + level * 50) % 360}, 70%, 60%)`;
        }

        function draw() {
            if(!gameRunning) return;
            
            ctx.save();
            if(shakeTime > 0) {
                ctx.translate((Math.random()-0.5)*shakeTime, (Math.random()-0.5)*shakeTime);
                shakeTime--;
            }

            ctx.fillStyle = "rgba(2, 6, 23, 0.4)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            bricks.flat().forEach(b => {
                if(b.status <= 0) return;
                ctx.beginPath();
                ctx.roundRect(b.x, b.y, b.w, b.h, 4);
                ctx.fillStyle = getBrickColor(b);
                if(b.type === "shield") {
                    ctx.shadowBlur = 8; ctx.shadowColor = "#3b82f6";
                }
                ctx.fill();
                ctx.shadowBlur = 0;
                if(b.type === "seq") {
                    ctx.fillStyle = "#000"; ctx.font = "bold 10px Orbitron";
                    ctx.textAlign="center"; ctx.fillText(b.extra, b.x+b.w/2, b.y+b.h/2+4);
                }
            });

            // 패들 그리기
            ctx.beginPath();
            ctx.roundRect(paddleX, canvas.height-25, paddleWidth, paddleHeight, 6);
            ctx.fillStyle = activeEffects.laser > 0 ? "#ef4444" : (activeEffects.magnet > 0 ? "#22d3ee" : "#6366f1");
            ctx.shadowBlur = 15; ctx.shadowColor = ctx.fillStyle;
            ctx.fill();
            ctx.shadowBlur = 0;

            // 레이저 그리기
            lasers.forEach(l => {
                ctx.fillStyle = "#ef4444";
                ctx.fillRect(l.x - 2, l.y, 4, 15);
                ctx.shadowBlur = 10; ctx.shadowColor = "#ef4444";
            });

            // 아이템 처리
            for(let i=items.length-1; i>=0; i--) {
                const it = items[i];
                it.y += it.dy;
                ctx.beginPath();
                ctx.arc(it.x, it.y, 11, 0, Math.PI*2);
                ctx.fillStyle = it.c;
                ctx.fill();
                ctx.fillStyle = "#fff"; ctx.font = "bold 12px Orbitron";
                ctx.textAlign="center"; ctx.fillText(it.l, it.x, it.y+4);
                
                if(it.y > canvas.height-35 && it.x > paddleX && it.x < paddleX+paddleWidth) {
                    SFX.item();
                    if(it.t==='expand') { activeEffects.expand = 10; paddleWidth = 160; }
                    if(it.t==='slow') balls.forEach(bl => { bl.dx*=0.7; bl.dy*=0.7; });
                    if(it.t==='power') activeEffects.power = 8;
                    if(it.t==='multi') balls.push(new Ball(it.x, canvas.height-50, 3, -3));
                    if(it.t==='laser') activeEffects.laser = 8;
                    if(it.t==='magnet') activeEffects.magnet = 10;
                    if(it.t==='life') { lives++; livesEl.innerText = lives; }
                    if(it.t==='gravity') {
                        balls.forEach(bl => {
                            bl.dx = (paddleX + paddleWidth/2 - bl.x) * 0.05;
                            bl.dy = 5;
                        });
                    }
                    items.splice(i, 1);
                } else if(it.y > canvas.height) items.splice(i, 1);
            }

            // 공 그리기
            balls.forEach(bl => bl.draw());

            // 파티클 업데이트
            for(let i=particles.length-1; i>=0; i--) {
                particles[i].update();
                particles[i].draw();
                if(particles[i].life <= 0) particles.splice(i, 1);
            }

            // 레이저 발사 로직
            if(activeEffects.laser > 0) {
                laserTimer++;
                if(laserTimer % 20 === 0) {
                    lasers.push({x: paddleX + 10, y: canvas.height - 30});
                    lasers.push({x: paddleX + paddleWidth - 10, y: canvas.height - 30});
                    SFX.laser();
                }
            }

            // 효과 타이머
            if(activeEffects.expand > 0) activeEffects.expand -= 0.016; else paddleWidth = 100;
            if(activeEffects.power > 0) activeEffects.power -= 0.016;
            if(activeEffects.laser > 0) activeEffects.laser -= 0.016;
            if(activeEffects.magnet > 0) activeEffects.magnet -= 0.016;

            updatePhysics();

            if(bricks.flat().filter(b => b.status > 0).length === 0) levelUp();

            ctx.restore();
            requestAnimationFrame(draw);
        }

        function levelUp() {
            gameRunning = false; SFX.win();
            if(level < 5) {
                showModal("LEVEL COMPLETE", `SCORE: ${score}`, "NEXT LEVEL", () => { level++; levelEl.innerText = level; startGame(); });
            } else {
                showModal("CONGRATULATIONS!", "YOU ARE THE BREAKER", "RESTART", () => location.reload());
            }
        }

        function gameOver() {
            gameRunning = false;
            showModal("GAME OVER", `FINAL SCORE: ${score}`, "RETRY", () => location.reload());
        }

        function showModal(title, stats, btn, action) {
            document.getElementById("msgTitle").innerText = title;
            document.getElementById("msgStats").innerText = stats;
            document.getElementById("mainBtn").innerText = btn;
            messageBox.style.display = "block";
            window.nextAction = action;
        }

        function handleMainBtn() { if(window.nextAction) window.nextAction(); }
        function startGame() { messageBox.style.display = "none"; initLevel(); gameRunning = true; draw(); }

        document.addEventListener("keydown", e => {
            if(e.key === "ArrowRight") rightPressed = true;
            if(e.key === "ArrowLeft") leftPressed = true;
            if(e.key === " " || e.key === "ArrowUp") balls.forEach(b => b.launch());
        });
        document.addEventListener("keyup", e => {
            if(e.key === "ArrowRight") rightPressed = false;
            if(e.key === "ArrowLeft") leftPressed = false;
        });
        canvas.addEventListener("mousemove", e => {
            const rect = canvas.getBoundingClientRect();
            paddleX = (e.clientX - rect.left) * (canvas.width / rect.width) - paddleWidth/2;
        });
        canvas.addEventListener("mousedown", () => balls.forEach(b => b.launch()));
        canvas.addEventListener("touchmove", e => {
            const rect = canvas.getBoundingClientRect();
            paddleX = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width) - paddleWidth/2;
            e.preventDefault();
        }, {passive:false});
        canvas.addEventListener("touchstart", () => balls.forEach(b => b.launch()));

        window.onload = () => showModal("NEON BREAKER", "INITIALIZING SYSTEMS...", "START GAME", startGame);
    </script>
</body>
</html>
