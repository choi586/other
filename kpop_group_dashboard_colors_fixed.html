<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-POP 그룹 대시보드</title>
</head>
<body>

<style>

:root{
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Roboto, Arial, sans-serif;
  --color-text-primary:#111827;
  --color-text-secondary:#4b5563;
  --color-text-tertiary:#9ca3af;
  --color-background-primary:#ffffff;
  --color-background-secondary:#f8fafc;
  --color-border-secondary:#dbe3ee;
  --color-border-tertiary:#e5e7eb;
  --border-radius-md:14px;
  --border-radius-lg:22px;
  --shadow-sm: 0 1px 2px rgba(15,23,42,.05), 0 6px 18px rgba(15,23,42,.04);
  --shadow-md: 0 10px 25px rgba(15,23,42,.06), 0 2px 8px rgba(15,23,42,.05);
}

*{box-sizing:border-box;margin:0;padding:0}

html, body{
  min-height:100%;
  background:
    radial-gradient(circle at top left, rgba(59,130,246,.08), transparent 22%),
    radial-gradient(circle at top right, rgba(236,72,153,.06), transparent 18%),
    linear-gradient(180deg, #f7f9fc 0%, #eff4f9 100%);
}

body{
  font-family:var(--font-sans);
  color:var(--color-text-primary);
  padding:40px 28px 56px;
  line-height:1.45;
}

.dash{
  max-width:1240px;
  margin:0 auto;
  padding:28px;
  background:rgba(255,255,255,.78);
  backdrop-filter: blur(10px);
  border:1px solid rgba(255,255,255,.7);
  border-radius:28px;
  box-shadow: var(--shadow-md);
}

.top-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:18px;
  flex-wrap:wrap;
}

.top-bar h1{
  font-size:30px;
  font-weight:800;
  color:var(--color-text-primary);
  letter-spacing:-0.03em;
}

.group-select{
  padding:12px 16px;
  border:1px solid var(--color-border-secondary);
  border-radius:16px;
  background:#fff;
  color:var(--color-text-primary);
  font-size:15px;
  cursor:pointer;
  min-width:180px;
  box-shadow:var(--shadow-sm);
}

.profile-strip{
  display:flex;
  gap:10px;
  margin-bottom:24px;
  flex-wrap:wrap;
}

.badge{
  padding:8px 14px;
  border-radius:999px;
  font-size:13px;
  font-weight:600;
  background:rgba(255,255,255,.86);
  color:var(--color-text-secondary);
  border:1px solid var(--color-border-tertiary);
  box-shadow: var(--shadow-sm);
}

.badge span{
  color:var(--color-text-primary);
  font-weight:700;
}

.kpi-row{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:16px;
  margin-bottom:26px;
}

.kpi{
  background:linear-gradient(180deg, rgba(255,255,255,.96) 0%, rgba(248,250,252,.98) 100%);
  border:1px solid var(--color-border-tertiary);
  border-radius:22px;
  padding:20px 20px 18px;
  box-shadow:var(--shadow-sm);
}

.kpi-label{
  font-size:12px;
  color:var(--color-text-secondary);
  margin-bottom:8px;
  font-weight:700;
  letter-spacing:.03em;
}

.kpi-val{
  font-size:38px;
  line-height:1;
  font-weight:800;
  color:var(--color-text-primary);
  letter-spacing:-0.04em;
}

.kpi-sub{
  font-size:12px;
  color:var(--color-text-tertiary);
  margin-top:8px;
}

.charts-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:20px;
  margin-bottom:4px;
}

.chart-card{
  background:rgba(255,255,255,.96);
  border:1px solid var(--color-border-tertiary);
  border-radius:24px;
  padding:20px 20px 18px;
  box-shadow:var(--shadow-sm);
}

.chart-card.full{
  grid-column:1/-1;
}

.card-title{
  font-size:14px;
  font-weight:800;
  color:var(--color-text-primary);
  margin-bottom:14px;
  letter-spacing:-0.01em;
}

.legend{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-bottom:10px;
  font-size:12px;
  color:var(--color-text-secondary);
}

.legend span{
  display:flex;
  align-items:center;
  gap:6px;
}

.leg-sq{
  width:10px;
  height:10px;
  border-radius:3px;
  flex-shrink:0;
}

.sns-row{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.sns-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  background:var(--color-background-secondary);
  border-radius:16px;
  border:1px solid var(--color-border-tertiary);
}

.sns-icon{
  width:34px;
  height:34px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:800;
  flex-shrink:0;
}

.sns-info{
  min-width:0;
}

.sns-name{
  font-size:11px;
  color:var(--color-text-secondary);
  text-transform:capitalize;
}

.sns-num{
  font-size:15px;
  font-weight:800;
  color:var(--color-text-primary);
}

.fan-bar-row{
  margin-bottom:10px;
}

.fan-label{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:var(--color-text-secondary);
  margin-bottom:5px;
  font-weight:600;
}

.fan-track{
  height:9px;
  background:var(--color-background-secondary);
  border-radius:999px;
  overflow:hidden;
}

.fan-fill{
  height:100%;
  border-radius:999px;
  transition:width .4s;
}

canvas{
  image-rendering:auto;
}

@media (max-width: 900px){
  body{padding:20px 14px 28px}
  .dash{padding:18px}
  .kpi-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .charts-grid{grid-template-columns:1fr}
  .top-bar h1{font-size:24px}
}

@media (max-width: 540px){
  .kpi-row{grid-template-columns:1fr}
  .sns-row{grid-template-columns:1fr}
  .group-select{width:100%}
}

</style>

<div class="dash">
  <div class="top-bar">
    <h1>K-POP 그룹 대시보드</h1>
    <select class="group-select" id="gsel"></select>
  </div>
  <div class="profile-strip" id="prof"></div>
  <div class="kpi-row" id="kpis"></div>
  <div class="charts-grid">
    <div class="chart-card">
      <div class="card-title">연도별 앨범 판매량</div>

      <div id="legRev" class="legend"></div>
      <div style="position:relative;height:180px"><canvas id="cRev"></canvas></div>
    </div>
    <div class="chart-card full">
      <div class="card-title">2024 월별 스트리밍</div>
      <div style="position:relative;height:180px"><canvas id="cStream"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="card-title">시상식 수상 현황</div>
      <div style="position:relative;height:220px"><canvas id="cAward"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="card-title">콘서트 수익 (연도별)</div>
      <div style="position:relative;height:220px"><canvas id="cConcert"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="card-title">SNS 팔로워</div>
      <div class="sns-row" id="snsRow"></div>
    </div>
    <div class="chart-card">
      <div class="card-title">팬 분포 (국가별)</div>
      <div id="fanBars"></div>
    </div>
  </div>
</div>

const COLORS = {
  album: '#7C83FD',
  stream: '#20B486',
  concert: '#F59E0B',
  rev: ['#6C7AE0','#1DBA8C','#F59E0B','#EC4899','#8B5CF6'],
  award: '#A855F7',
  fans: ['#6C7AE0','#1DBA8C','#F59E0B','#EC4899','#8B5CF6','#22C55E'],
  sns: {instagram:'#E1306C',youtube:'#FF0000',twitter:'#1DA1F2',tiktok:'#111111'}
};

const fmt = (n) => n >= 1e8 ? (n/1e8).toFixed(1)+'억' : n >= 1e4 ? (n/1e4).toFixed(0)+'만' : n.toLocaleString();
const fmtM = (n) => '$'+(n/1e6).toFixed(1)+'M';
const MONTHS = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

const sel = document.getElementById('gsel');
Object.keys(DATA).forEach(g => {
  const o = document.createElement('option');
  o.value = g; o.textContent = g;
  sel.appendChild(o);
});

let charts = {};
function destroyAll() {
  Object.values(charts).forEach(c => c.destroy());
  charts = {};
}

function render(g) {
  const d = DATA[g];
  destroyAll();

  const tierColor = {S:'#D85A30',A:'#1D9E75',B:'#378ADD',C:'#888780'}[d.tier]||'#888';

  document.getElementById('prof').innerHTML = `
    <div class="badge">에이전시 <span>${d.agency}</span></div>
    <div class="badge">데뷔 <span>${d.debut}년</span></div>
    <div class="badge">멤버 <span>${d.member_count}명</span></div>
    <div class="badge">성별 <span>${d.gender}</span></div>
    <div class="badge">티어 <span style="color:${tierColor}">${d.tier}</span></div>
    <div class="badge" style="font-size:11px;color:var(--color-text-secondary)">${d.members}</div>
  `;

  const years = Object.keys(d.album_yearly);
  const totalAlbum = Object.values(d.album_yearly).reduce((a,b)=>a+b,0);
  const totalStream = Object.values(d.streaming_2024).reduce((a,b)=>a+b,0);
  const totalRevYr = Object.values(d.total_revenue_yearly);
  const latestRev = totalRevYr[totalRevYr.length-1];
  const totalAwards = Object.values(d.awards_yearly).reduce((a,b)=>a+b,0);

  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="kpi-label">누적 앨범 판매</div><div class="kpi-val">${fmt(totalAlbum)}</div><div class="kpi-sub">2021–2024 합계</div></div>
    <div class="kpi"><div class="kpi-label">2024 스트리밍</div><div class="kpi-val">${fmt(totalStream)}</div><div class="kpi-sub">연간 총합</div></div>
    <div class="kpi"><div class="kpi-label">최근 연도 수익</div><div class="kpi-val">${fmtM(latestRev)}</div><div class="kpi-sub">${years[years.length-1]}년 기준</div></div>
    <div class="kpi"><div class="kpi-label">누적 수상</div><div class="kpi-val">${totalAwards}회</div><div class="kpi-sub">전 시상식 합산</div></div>
  `;

  charts.album = new Chart(document.getElementById('cAlbum'), {
    type:'bar',
    data:{
      labels: Object.keys(d.album_yearly),
      datasets:[{label:'앨범판매량', data:Object.values(d.album_yearly), backgroundColor:COLORS.album+'bb', borderColor:COLORS.album, borderWidth:1.5, borderRadius:4}]
    },
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' '+fmt(ctx.parsed.y)}}},scales:{x:{ticks:{font:{size:11}},grid:{display:false}},y:{ticks:{font:{size:10},callback:v=>fmt(v)},grid:{color:'rgba(128,128,128,0.1)'}}}}
  });

  const revKeys = Object.keys(d.revenue_breakdown);
  const revVals = Object.values(d.revenue_breakdown);
  document.getElementById('legRev').innerHTML = revKeys.map((k,i)=>`<span><span class="leg-sq" style="background:${COLORS.rev[i]}"></span>${k}</span>`).join('');
  charts.rev = new Chart(document.getElementById('cRev'), {
    type:'doughnut',
    data:{labels:revKeys, datasets:[{data:revVals, backgroundColor:COLORS.rev, borderWidth:2, borderColor:'transparent'}]},
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{
          callbacks:{
            label:ctx=>{
              const total = ctx.dataset.data.reduce((a,b)=>a+b,0);
              const value = ctx.parsed;
              const pct = ((value / total) * 100).toFixed(1);
              return ` ${pct}% (${fmtM(value)})`;
            }
          }
        }
      },
      cutout:'62%'
    }
  });

  charts.stream = new Chart(document.getElementById('cStream'), {
    type:'line',
    data:{
      labels:MONTHS,
      datasets:[{label:'스트리밍', data:Object.values(d.streaming_2024), borderColor:COLORS.stream, backgroundColor:COLORS.stream+'22', fill:true, tension:0.4, pointRadius:3, pointBackgroundColor:COLORS.stream}]
    },
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' '+fmt(ctx.parsed.y)}}},scales:{x:{ticks:{font:{size:11},autoSkip:false,maxRotation:0},grid:{display:false}},y:{ticks:{font:{size:10},callback:v=>fmt(v)},grid:{color:'rgba(128,128,128,0.1)'}}}}
  });

  const aShows = Object.keys(d.awards_by_show);
  const aVals = Object.values(d.awards_by_show);
  charts.award = new Chart(document.getElementById('cAward'), {
    type:'bar',
    data:{labels:aShows, datasets:[{data:aVals, backgroundColor:COLORS.award+'bb', borderColor:COLORS.award, borderWidth:1.5, borderRadius:4}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:10}},grid:{color:'rgba(128,128,128,0.1)'}},y:{ticks:{font:{size:10}},grid:{display:false}}}}
  });

  charts.concert = new Chart(document.getElementById('cConcert'), {
    type:'bar',
    data:{
      labels:Object.keys(d.concert_revenue_yearly),
      datasets:[{label:'콘서트 수익', data:Object.values(d.concert_revenue_yearly), backgroundColor:COLORS.concert+'bb', borderColor:COLORS.concert, borderWidth:1.5, borderRadius:4}]
    },
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' '+fmtM(ctx.parsed.y)}}},scales:{x:{ticks:{font:{size:11}},grid:{display:false}},y:{ticks:{font:{size:10},callback:v=>fmtM(v)},grid:{color:'rgba(128,128,128,0.1)'}}}}
  });

  const sns = d.sns;
  const snsIcons = {instagram:'IG',youtube:'YT',twitter:'TW',tiktok:'TK'};
  const snsBg = {instagram:'#fce4ec',youtube:'#ffebee',twitter:'#e3f2fd',tiktok:'#f3e5f5'};
  document.getElementById('snsRow').innerHTML = Object.entries(sns).map(([k,v])=>`
    <div class="sns-item">
      <div class="sns-icon" style="background:${snsBg[k]};color:${COLORS.sns[k]}">${snsIcons[k]}</div>
      <div class="sns-info">
        <div class="sns-name">${k}</div>
        <div class="sns-num">${fmt(v)}</div>
      </div>
    </div>
  `).join('');

  const fanEntries = Object.entries(d.fan_countries);
  const maxFan = Math.max(...fanEntries.map(e=>e[1]));
  document.getElementById('fanBars').innerHTML = fanEntries.map(([country, ratio], i) => `
    <div class="fan-bar-row">
      <div class="fan-label"><span>${country}</span><span>${(ratio*100).toFixed(1)}%</span></div>
      <div class="fan-track"><div class="fan-fill" style="width:${(ratio/maxFan*100).toFixed(1)}%;background:${COLORS.fans[i%COLORS.fans.length]}"></div></div>
    </div>
  `).join('');
}

sel.addEventListener('change', () => render(sel.value));
render('BLACKPINK');
</script>
