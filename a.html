<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Card Game</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-back: #2d3436;
            --card-front: #ffffff;
            --primary-color: #0984e3;
            --success-color: #00b894;
            --text-color: #2d3436;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: var(--text-color);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        .stats {
            display: flex;
            gap: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .game-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 600px;
            width: 100%;
        }

        @media (max-width: 480px) {
            .game-container {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }
        }

        .card {
            aspect-ratio: 3/4;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 12px;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card.matched .card-inner {
            animation: pulse 0.5s ease-in-out;
            border: 2px solid var(--success-color);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            border-radius: 12px;
        }

        .card-back {
            background-color: var(--card-back);
            color: white;
            z-index: 2;
        }

        .card-back::after {
            content: "?";
            opacity: 0.3;
            font-size: 3rem;
        }

        .card-front {
            background-color: var(--card-front);
            transform: rotateY(180deg);
            z-index: 1;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: 600;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button.secondary {
            background-color: #636e72;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        button:active {
            transform: scale(0.95);
        }

        @keyframes pulse {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.05); }
            100% { transform: rotateY(180deg) scale(1); }
        }

        #message-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
            display: none;
            z-index: 100;
        }

        #overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 99;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Memory Game</h1>
        <div class="stats">
            <div>시도 횟수: <span id="moves">0</span></div>
            <div>매칭 성공: <span id="matches">0</span> / 8</div>
        </div>
    </div>

    <div class="game-container" id="game-board"></div>

    <div class="controls">
        <button onclick="resetGame()">게임 재시작</button>
        <button class="secondary" onclick="downloadHTML()">HTML 파일 다운로드</button>
    </div>

    <div id="overlay"></div>
    <div id="message-box">
        <h2 style="font-size: 2rem; margin-bottom: 15px;">축하합니다! 🎉</h2>
        <p id="final-stats" style="margin-bottom: 25px;"></p>
        <button onclick="resetGame()">다시 도전하기</button>
    </div>

    <script>
        const symbols = ['🍎', '🍌', '🍇', '🍓', '🍒', '🥝', '🍉', '🍍'];
        let cards = [...symbols, ...symbols];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let isLock = false;

        const board = document.getElementById('game-board');
        const movesDisplay = document.getElementById('moves');
        const matchesDisplay = document.getElementById('matches');
        const messageBox = document.getElementById('message-box');
        const overlay = document.getElementById('overlay');
        const finalStats = document.getElementById('final-stats');

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function createBoard() {
            board.innerHTML = '';
            const shuffledCards = shuffle([...cards]);
            
            shuffledCards.forEach((symbol, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.symbol = symbol;

                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-back"></div>
                        <div class="card-front">${symbol}</div>
                    </div>
                `;

                card.addEventListener('click', () => flipCard(card));
                board.appendChild(card);
            });
        }

        function flipCard(card) {
            if (isLock) return;
            if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            isLock = true;
            moves++;
            movesDisplay.textContent = moves;

            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.symbol === card2.dataset.symbol;

            if (isMatch) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedPairs++;
                matchesDisplay.textContent = matchedPairs;
                resetTurn();
                
                if (matchedPairs === symbols.length) {
                    showWinMessage();
                }
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    resetTurn();
                }, 1000);
            }
        }

        function resetTurn() {
            flippedCards = [];
            isLock = false;
        }

        function showWinMessage() {
            finalStats.textContent = `총 ${moves}번의 시도 끝에 모든 카드를 찾았습니다!`;
            messageBox.style.display = 'block';
            overlay.style.display = 'block';
        }

        function resetGame() {
            matchedPairs = 0;
            moves = 0;
            flippedCards = [];
            isLock = false;
            movesDisplay.textContent = '0';
            matchesDisplay.textContent = '0';
            messageBox.style.display = 'none';
            overlay.style.display = 'none';
            createBoard();
        }

        // Function to download the current HTML content
        function downloadHTML() {
            const htmlContent = document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'memory_game.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        window.onload = createBoard;
    </script>
</body>
</html>
