<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>몬티홀 딜레마 시뮬레이터 v2</title>
  <style>
    :root{
      --bg:#f6f8ff;
      --card:#ffffff;
      --ink:#0b1220;
      --muted:#60708a;
      --accent:#2563eb;
      --accent-2:#22c55e;
      --danger:#ef4444;
      --shadow: 0 10px 25px rgba(2,6,23,.08), 0 2px 8px rgba(2,6,23,.06);
      --radius: 18px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color:var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #e0f2fe 0%, transparent 50%),
        radial-gradient(900px 500px at 110% 10%, #ede9fe 0%, transparent 45%),
        var(--bg);
      display:flex;flex-direction:column;align-items:center;gap:20px;
      padding:24px;
    }
    header{max-width:1200px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px}
    h1{
      margin:0;
      font-size:clamp(22px, 2.2vw + 8px, 40px);
      line-height:1.1;
      letter-spacing:-.02em;
      display:flex;align-items:center;gap:.5ch
    }
    .badge{
      font-size:12px;background:#e2e8f0;color:#0f172a;
      padding:.35rem .6rem;border-radius:999px;font-weight:700;
      letter-spacing:.04em
    }
    .wrap{max-width:1200px;width:100%;display:grid;grid-template-columns: 1.2fr .8fr;gap:22px;align-items:start}
    @media (max-width: 980px){
      .wrap{grid-template-columns:1fr}
    }

    .board,.stats{
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:18px 18px 24px;
    }
    .subtitle{margin:0 0 10px;font-size:15px;color:var(--muted);letter-spacing:.02em}
    .subtitle b{color:#0b1220}
    .result-big{font-size:clamp(18px, 2.4vw + 8px, 30px);font-weight:900;color:#0b1220;margin:8px 0}
    .result-big.bad{color:var(--danger)}
    .result-big.good{color:var(--accent-2)}

    .stage{
      display:grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap:18px;
      align-items:stretch;
      justify-items:center;
      padding:10px 4px 4px;
      min-height: 360px;
    }
    @media (min-width: 1200px){
      .stage{min-height:420px}
    }

    /* Door visuals */
    .door{
      width:100%;
      max-width:300px;
      aspect-ratio: 3 / 5;
      cursor:pointer;
      position:relative;
    }
    .frame{
      position:relative;
      width:100%;height:100%;
      border-radius:18px;
      background: #f8fafc;
      border: 3px dashed #0f172a1a;
      box-shadow: var(--shadow);
      overflow:hidden;
      perspective: 1400px;
    }
    .inside{
      position:absolute;inset:0;
      display:flex;align-items:center;justify-content:center;
      background: radial-gradient(120% 120% at 50% -10%, #ffffff, #eef2ff);
      z-index:0;
    }
    .inside .prize{font-size:clamp(40px, 4.5vw, 56px);display:flex;flex-direction:column;align-items:center;gap:6px}
    .inside .label{font-size:14px;color:#0f172a;opacity:.85;font-weight:700;letter-spacing:.06em}

    .leaf{
      position:absolute;inset:10px;
      border-radius:12px;
      background: linear-gradient(135deg, #b3cfff, #c3b7ff);
      border: 3px solid #0f172a14;
      transform-origin: left center;
      transition: transform .9s cubic-bezier(.2,.8,.2,1), filter .2s ease;
      z-index:2;
      display:flex;align-items:center;justify-content:center;
    }
    /* Different gradients per door */
    .door:nth-child(1) .leaf{ background: linear-gradient(135deg, #bad6ff, #cbbdff); }
    .door:nth-child(2) .leaf{ background: linear-gradient(135deg, #b0d0ff, #c6b5ff); }
    .door:nth-child(3) .leaf{ background: linear-gradient(135deg, #a8cbff, #c2b0ff); }

    .door .panel-lines{
      position:absolute;inset:18px;
      border-radius:8px;
      box-shadow:
        inset 0 0 0 3px #ffffff60,
        inset 0 0 0 8px #0f172a0f;
      pointer-events:none;
    }
    .num{
      position:absolute;bottom:12px;right:16px;
      font-size: clamp(26px, 3.2vw, 40px);
      font-weight:900;color:#0b1220cc;text-shadow:0 1px 0 #fff;
      pointer-events:none;
    }
    .handle{
      position:absolute; right:26px; top:48%; width:16px; height:16px; border-radius:50%;
      background:#f1c40f; box-shadow:inset 0 -2px 0 #b58900, 0 2px 4px rgba(0,0,0,.15);
    }

    .door.selected .leaf{ outline:4px solid var(--accent); filter:brightness(1.05); }
    .door.disabled{cursor:not-allowed;opacity:.8}
    .door.open .leaf{ transform: rotateY(-70deg); } /* opened state */

    /* little ribbon for "처음 선택" */
    .ribbon{
      position:absolute;top:8px;left:-10px;z-index:3;
      background: var(--accent); color:#fff; padding:6px 12px;
      font-size:12px; font-weight:900; letter-spacing:.02em;
      border-top-right-radius:8px;border-bottom-right-radius:8px;
      box-shadow:0 6px 14px rgba(2,6,23,.16);
      display:none;
    }
    .door.tagged .ribbon{ display:block; }

    .panel{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
    button{
      appearance:none;border:0;
      background:var(--ink); color:#fff;
      padding:12px 18px;border-radius:12px;
      font-weight:800;letter-spacing:.02em;
      cursor:pointer;
      transition: transform .06s ease, box-shadow .2s ease, background .2s ease;
      box-shadow: 0 6px 14px rgba(2,6,23,.12);
    }
    button:hover{ transform: translateY(-1px) }
    button:active{ transform: translateY(0) scale(.98) }
    .btn-ghost{ background:#e2e8f0; color:#0f172a; box-shadow:none }

    /* Stats side */
    .stats{display:grid;gap:14px}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media (max-width:520px){ .grid-2{grid-template-columns:1fr} }
    .kpi{
      background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px
    }
    .kpi .k{font-size:12px;color:var(--muted);letter-spacing:.06em}
    .kpi .v{font-size:22px;font-weight:900}
    .legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
    .dot{width:10px;height:10px;border-radius:50%}
    .dot.switch{background:var(--accent)}
    .dot.stay{background:var(--accent-2)}
    canvas{ width:100%; height:260px; background:#fff; border:1px solid #e2e8f0; border-radius:12px; }
    .small{font-size:12px;color:var(--muted)}
    .hr{height:1px;background:#e5e7eb;margin:8px 0}

    footer{opacity:.7;font-size:12px}
  </style>
</head>
<body>
  <header>
    <h1>🚪 몬티홀 딜레마 시뮬레이터 <span class="badge">3개의 문</span></h1>
    <div class="panel">
      <button id="btn-new" class="btn-ghost">새 라운드</button>
      <button id="btn-reset" class="btn-ghost">누적 초기화</button>
    </div>
  </header>

  <div class="wrap">
    <!-- Left: Game board -->
    <section class="board">
      <p class="subtitle" id="hint">1단계: 문 하나를 먼저 선택하세요.</p>
      <div class="subtitle result-big" id="result" style="display:none;"></div>
      <div class="stage" id="stage">
        <!-- doors injected by JS -->
      </div>
    </section>

    <!-- Right: Stats & chart -->
    <aside class="stats">
      <div class="grid-2">
        <div class="kpi"><div class="k">총 라운드</div><div class="v" id="k-total">0</div></div>
        <div class="kpi"><div class="k">현재 단계</div><div class="v" id="k-step">선택</div></div>
      </div>

      <div class="grid-2">
        <div class="kpi"><div class="k">바꿈 승리(누적)</div><div class="v" id="k-switch-win">0</div></div>
        <div class="kpi"><div class="k">유지 승리(누적)</div><div class="v" id="k-stay-win">0</div></div>
      </div>

      <div class="legend">
        <div class="dot switch"></div> 바꿈 승률
        <div class="dot stay"></div> 유지 승률
        <span class="small"> (막대 = 승률 %, 라벨 = 승/시도)</span>
      </div>
      <canvas id="chart" width="520" height="260" aria-label="승률 차트" role="img"></canvas>
      <div class="hr"></div>
      <div class="small">
        이 시뮬레이터는 사회자가 항상 염소가 있는 문 하나를 공개하고, 자동차가 있는 문은 절대 열지 않는 조건을 따릅니다. 이때 전략적으로는 <b>바꾸기</b>가 유리합니다.
      </div>
    </aside>
  </div>

  <footer>© Monty Hall Studio</footer>

  <script>
    // ---- Persistent state (localStorage) ----
    const STORE_KEY = "monty-stats-v2";
    const Stats = {
      total: 0,
      switchWin: 0,
      switchTry: 0,
      stayWin: 0,
      stayTry: 0
    };
    function loadStats(){
      try{
        const raw = localStorage.getItem(STORE_KEY);
        if(!raw) return {...Stats};
        const obj = JSON.parse(raw);
        return {...Stats, ...obj};
      }catch(e){ return {...Stats}; }
    }
    function saveStats(s){ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }

    // ---- Game state ----
    let stats = loadStats();
    let prizes = [];      // ["goat","car","goat"] shuffled
    let chosen = null;    // index initially selected by player
    let revealed = null;  // index Monty opens (goat)
    let finished = false; // round completed

    const stageEl = document.getElementById('stage');
    const hintEl  = document.getElementById('hint');
    const resultEl= document.getElementById('result');
    const btnNew  = document.getElementById('btn-new');
    const btnReset= document.getElementById('btn-reset');
    const kTotal = document.getElementById('k-total');
    const kStep  = document.getElementById('k-step');
    const kSW    = document.getElementById('k-switch-win');
    const kST    = document.getElementById('k-stay-win');
    const chart  = document.getElementById('chart');
    const ctx    = chart.getContext('2d');

    function shuffle(a){
      for(let i=a.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]] = [a[j],a[i]];
      }
      return a;
    }

    function setupRound(){
      finished = false;
      prizes = shuffle(["goat","car","goat"]);
      chosen = null;
      revealed = null;
      hintEl.textContent = "1단계: 문 하나를 먼저 선택하세요.";
      resultEl.style.display="none";
      kStep.textContent = "선택";
      renderDoors();
    }

    function renderDoors(){
      stageEl.innerHTML = "";
      for(let i=0;i<3;i++){
        const door = document.createElement('div');
        door.className = "door" + (i===chosen ? " selected tagged" : "") + ((revealed===i || finished) ? " open" : "");
        door.dataset.idx = i;
        door.innerHTML = `
          <div class="ribbon">처음 선택</div>
          <div class="frame">
            <div class="inside">
              <div class="prize">${prizes[i]==="car" ? "🚗" : "🐐"}<div class="label">${prizes[i]==="car" ? "자동차" : "염소"}</div></div>
            </div>
            <div class="leaf">
              <div class="panel-lines"></div>
              <div class="handle"></div>
              <div class="num">${i+1}</div>
            </div>
          </div>
        `;

        if(!finished){
          if(revealed===null){
            door.addEventListener('click', onChoose);
          }else{
            if(i!==revealed){
              door.addEventListener('click', () => finalDecision(i===chosen ? "stay" : "switch"));
            }else{
              door.classList.add('disabled');
            }
          }
        }else{
          door.classList.add('disabled');
        }
        stageEl.appendChild(door);
      }
    }

    function onChoose(e){
      const idx = Number(e.currentTarget.dataset.idx);
      if(revealed!==null || finished) return;
      chosen = idx;
  
      // 우선 "선택했습니다" 안내만 띄우기
      hintEl.innerHTML = `👏 <b>${chosen+1}번</b> 문을 고르셨습니다.<br>이제 사회자가 염소 문 하나를 보여드리겠습니다...`;
      kStep.textContent = "사회자 멘트";
      renderDoors();

      // 1초 후 염소 문 열기
      setTimeout(() => {
        const candidates = [0,1,2].filter(i => i!==chosen && prizes[i]==="goat");
        revealed = candidates[Math.floor(Math.random()*candidates.length)];
        hintEl.innerHTML = `2단계: <b>${chosen+1}번</b>을 처음 선택했습니다. 사회자가 염소 문 하나를 열었습니다.<br>이제 다른 문으로 <b>바꾸시겠습니까?</b> (문을 직접 클릭해 선택)`;
        kStep.textContent = "바꾸기/유지 결정";
        renderDoors();
      }, 1000); // ← 1초(1000ms) 후 염소 문 오픈
    }
function finalDecision(mode){ // "switch" or "stay"
      if(finished || revealed===null) return;
      let finalIdx;
      if(mode==="stay"){
        finalIdx = chosen;
        stats.stayTry += 1;
      }else{
        finalIdx = [0,1,2].find(i => i!==chosen && i!==revealed);
        stats.switchTry += 1;
      }
      // reveal all
      finished = true;
      const isWin = prizes[finalIdx] === "car";
      if(mode==="stay" && isWin) stats.stayWin += 1;
      if(mode==="switch" && isWin) stats.switchWin += 1;
      stats.total += 1;
      saveStats(stats);

      // open all doors
      document.querySelectorAll('.door').forEach((d,i)=>{
        d.classList.add('open');
        if(i===chosen) d.classList.add('selected','tagged');
      });

      // big result text
      resultEl.style.display="block";
      resultEl.className = "subtitle result-big " + (isWin ? "good" : "bad");
      resultEl.innerHTML = isWin
        ? `🎉 정답! <b>${mode==="switch" ? "바꾸기" : "유지"}</b>로 자동차를 얻었습니다.`
        : `🙈 아쉽네요. <b>${mode==="switch" ? "바꾸기" : "유지"}</b>를 선택해 염소를 골랐습니다.`;
      hintEl.textContent = "라운드가 종료되었습니다. '새 라운드'로 계속 진행하세요.";
      kStep.textContent = "라운드 종료";
      updateKPI();
      drawChart();
      flashBanner(isWin ? "축하합니다! 🚗" : "다음에 다시! 🐐", isWin ? "good":"bad");
    }

    function flashBanner(text, kind){
      const b = document.createElement('div');
      b.textContent = text;
      b.style.position="fixed";
      b.style.top="14px"; b.style.left="50%"; b.style.transform="translateX(-50%)";
      b.style.padding="10px 16px";
      b.style.fontWeight="900";
      b.style.color="#fff";
      b.style.borderRadius="999px";
      b.style.boxShadow="0 10px 20px rgba(0,0,0,.2)";
      b.style.zIndex=1000;
      b.style.background = kind==="good" ? "var(--accent-2)" : "var(--danger)";
      document.body.appendChild(b);
      setTimeout(()=>{ b.style.transition="all .4s ease"; b.style.opacity="0"; b.style.transform="translateX(-50%) translateY(-10px)"; }, 1200);
      setTimeout(()=> b.remove(), 1800);
    }

    // ---- UI wiring ----
    btnNew.addEventListener('click', setupRound);
    btnReset.addEventListener('click', ()=>{
      if(confirm("누적 통계를 모두 초기화할까요?")){
        stats = {...Stats};
        saveStats(stats);
        updateKPI(); drawChart();
        setupRound();
      }
    });

    function updateKPI(){
      kTotal.textContent = stats.total;
      kSW.textContent = stats.switchWin;
      kST.textContent = stats.stayWin;
    }

    // ---- Minimal chart (no CDN) ----
    function drawChart(){
      const dpr = window.devicePixelRatio || 1;
      const W = chart.clientWidth * dpr;
      const H = chart.clientHeight * dpr;
      if(chart.width!==W){ chart.width=W; chart.height=H; }
      ctx.clearRect(0,0,W,H);
      const pad = 28 * dpr;
      const innerW = W - pad*2;
      const innerH = H - pad*2;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0,0,W,H);
      ctx.strokeStyle = "#e5e7eb";
      ctx.lineWidth = 1*dpr;
      ctx.strokeRect(pad, pad, innerW, innerH);

      const swRate = stats.switchTry ? (stats.switchWin / stats.switchTry) : 0;
      const stRate = stats.stayTry   ? (stats.stayWin   / stats.stayTry)   : 0;
      const bars = [
        {label:"바꿈", rate: swRate, tries: stats.switchTry, wins: stats.switchWin, color:"#2563eb"},
        {label:"유지", rate: stRate, tries: stats.stayTry,   wins: stats.stayWin,   color:"#22c55e"},
      ];

      ctx.fillStyle="#64748b";
      ctx.font = `${12*dpr}px system-ui, -apple-system, sans-serif`;
      for(let i=0;i<=5;i++){
        const y = pad + innerH * (i/5);
        ctx.strokeStyle="#f1f5f9";
        ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(W-pad,y); ctx.stroke();
        const val = Math.round((1 - i/5)*100);
        ctx.fillStyle="#94a3b8";
        ctx.fillText(`${val}%`, 6*dpr, y+4*dpr);
      }

      const bw = Math.min(180*dpr, innerW/4);
      const gap = innerW - bw*2;
      bars.forEach((b,idx)=>{
        const x = pad + idx*(bw + gap);
        const h = innerH * b.rate;
        const y = pad + (innerH - h);
        ctx.fillStyle = b.color;
        ctx.shadowColor = "rgba(0,0,0,.12)";
        ctx.shadowBlur = 6*dpr;
        ctx.shadowOffsetY = 3*dpr;
        ctx.fillRect(x, y, bw, h);
        ctx.shadowColor = "transparent";
        ctx.fillStyle = "#0f172a";
        ctx.font = `${14*dpr}px system-ui, -apple-system, sans-serif`;
        ctx.textAlign="center";
        ctx.fillText(b.label, x + bw/2, H - pad/3);
        ctx.font = `${12*dpr}px system-ui, -apple-system, sans-serif`;
        const pct = (b.rate*100).toFixed(1);
        ctx.fillText(`${pct}%`, x + bw/2, y - 8*dpr);
        const badge = `${b.wins}/${b.tries}`;
        ctx.fillStyle = "#111827";
        ctx.globalAlpha = .85;
        const tw = ctx.measureText(badge).width + 12*dpr;
        const th = 18*dpr;
        ctx.fillRect(x + bw/2 - tw/2, y + 8*dpr, tw, th);
        ctx.globalAlpha = 1;
        ctx.fillStyle = "#fff";
        ctx.fillText(badge, x + bw/2, y + 21*dpr);
      });
    }

    // init
    updateKPI();
    drawChart();
    setupRound();
    window.addEventListener('resize', drawChart);
  </script>
</body>
</html>
