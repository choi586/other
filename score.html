<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>점수판</title>

<style>

body{
margin:0;
background:black;
color:white;
font-family:Arial;
overflow:hidden;
}

.container{
display:flex;
height:100vh;
}

.team{
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.a{
background:#1e40af;
}

.b{
background:#991b1b;
}

.label{
font-size:4vw;
margin-bottom:20px;
}

.score{
font-size:22vw;
font-weight:bold;
}

button{
position:fixed;
top:20px;
left:20px;
font-size:20px;
padding:12px 18px;
}

.status{
position:fixed;
bottom:20px;
left:20px;
font-size:16px;
opacity:0.8;
}

</style>

</head>


<body>

<button id="connect">마이크로비트 연결</button>

<div class="container">

<div class="team a">
<div class="label">A TEAM</div>
<div class="score" id="scoreA">0</div>
</div>

<div class="team b">
<div class="label">B TEAM</div>
<div class="score" id="scoreB">0</div>
</div>

</div>

<div class="status" id="status">연결 안됨</div>


<script>

const scoreA = document.getElementById("scoreA")
const scoreB = document.getElementById("scoreB")
const status = document.getElementById("status")

document.getElementById("connect").onclick = async function(){

const port = await navigator.serial.requestPort()

await port.open({ baudRate:115200 })

status.textContent="연결됨"

const decoder = new TextDecoderStream()

port.readable.pipeTo(decoder.writable)

const reader = decoder.readable.getReader()

let buffer=""

while(true){

const {value,done} = await reader.read()

if(done) break

buffer+=value

let lines = buffer.split("\n")

buffer = lines.pop()

for(let line of lines){

line=line.trim()

let m=line.match(/A:(-?\d+),B:(-?\d+)/)

if(m){

scoreA.textContent=m[1]

scoreB.textContent=m[2]

status.textContent="수신: "+line

}

}

}

}

</script>


</body>
</html>
