<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>두 팀 점수판</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    .topbar {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 20;
    }

    button {
      font-size: 22px;
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    .board {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    .team {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .team-a {
      background: #1e3a8a;
    }

    .team-b {
      background: #991b1b;
    }

    .label {
      font-size: 4.5vw;
      font-weight: 700;
      margin-bottom: 2vh;
      letter-spacing: 0.08em;
    }

    .score {
      font-size: 22vw;
      font-weight: 800;
      line-height: 1;
    }

    .center-vs {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 4.5vw;
      font-weight: 800;
      background: rgba(0, 0, 0, 0.35);
      padding: 18px 28px;
      border-radius: 18px;
      z-index: 10;
    }

    .status {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 20;
      font-size: 16px;
      background: rgba(0, 0, 0, 0.45);
      padding: 10px 14px;
      border-radius: 12px;
      max-width: calc(100vw - 40px);
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <button id="connectBtn">마이크로비트 연결</button>
  </div>

  <div class="board">
    <section class="team team-a">
      <div class="label">A TEAM</div>
      <div class="score" id="scoreA">0</div>
    </section>

    <section class="team team-b">
      <div class="label">B TEAM</div>
      <div class="score" id="scoreB">0</div>
    </section>
  </div>

  <div class="center-vs">VS</div>
  <div class="status" id="status">연결 안 됨</div>

  <script>
    const connectBtn = document.getElementById("connectBtn");
    const scoreAEl = document.getElementById("scoreA");
    const scoreBEl = document.getElementById("scoreB");
    const statusEl = document.getElementById("status");

    let port = null;
    let reader = null;
    let buffer = "";

    let scoreA = 0;
    let scoreB = 0;

    function renderScores() {
      scoreAEl.textContent = String(scoreA);
      scoreBEl.textContent = String(scoreB);
    }

    function applyEvent(line) {
      if (line === "A+") {
        scoreA += 1;
      } else if (line === "A-") {
        scoreA -= 1;
      } else if (line === "B+") {
        scoreB += 1;
      } else if (line === "B-") {
        scoreB -= 1;
      } else if (line === "R") {
        scoreA = 0;
        scoreB = 0;
      } else if (line === "PING") {
        statusEl.textContent = "연결됨\n테스트 신호 수신";
        return;
      } else {
        return;
      }

      renderScores();
      statusEl.textContent = "연결됨\n마지막 이벤트: " + line;
    }

    async function connectSerial() {
      try {
        if (!("serial" in navigator)) {
          statusEl.textContent = "이 브라우저는 Web Serial 미지원";
          return;
        }

        statusEl.textContent = "포트 선택 중...";
        port = await navigator.serial.requestPort();

        statusEl.textContent = "포트 연결 중...";
        await port.open({ baudRate: 115200 });

        statusEl.textContent = "연결됨";
        renderScores();

        const decoder = new TextDecoderStream();
        port.readable.pipeTo(decoder.writable);
        reader = decoder.readable.getReader();

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          if (!value) continue;

          buffer += value;
          const lines = buffer.split(/\r?\n/);
          buffer = lines.pop() || "";

          for (const rawLine of lines) {
            const line = rawLine.trim();
            if (line) {
              applyEvent(line);
            }
          }
        }
      } catch (e) {
        statusEl.textContent = "연결 실패: " + e.message;
        console.error(e);
      }
    }

    connectBtn.addEventListener("click", connectSerial);
  </script>
</body>
</html>
