<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>두 팀 점수판</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    .topbar {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 20;
    }

    button {
      font-size: 22px;
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    .board {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    .team {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .team-a { background: #1e3a8a; }
    .team-b { background: #991b1b; }

    .label {
      font-size: 4.5vw;
      font-weight: 700;
      margin-bottom: 2vh;
      letter-spacing: 0.08em;
    }

    .score {
      font-size: 22vw;
      font-weight: 800;
      line-height: 1;
    }

    .center-vs {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 4.5vw;
      font-weight: 800;
      background: rgba(0, 0, 0, 0.35);
      padding: 18px 28px;
      border-radius: 18px;
      z-index: 10;
    }

    .status {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 20;
      font-size: 16px;
      background: rgba(0, 0, 0, 0.45);
      padding: 10px 14px;
      border-radius: 12px;
      max-width: calc(100vw - 40px);
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <button id="connectBtn">마이크로비트 연결</button>
  </div>

  <div class="board">
    <section class="team team-a">
      <div class="label">A TEAM</div>
      <div class="score" id="scoreA">0</div>
    </section>

    <section class="team team-b">
      <div class="label">B TEAM</div>
      <div class="score" id="scoreB">0</div>
    </section>
  </div>

  <div class="center-vs">VS</div>
  <div class="status" id="status">연결 안 됨</div>

  <script>
    const connectBtn = document.getElementById("connectBtn");
    const scoreAEl = document.getElementById("scoreA");
    const scoreBEl = document.getElementById("scoreB");
    const statusEl = document.getElementById("status");

    let port = null;
    let reader = null;
    let textBuffer = "";

    function applyLineImmediately(line) {
      const match = line.match(/A\s*:\s*(-?\d+)\s*,\s*B\s*:\s*(-?\d+)/i);
      if (!match) return;

      scoreAEl.textContent = match[1];
      scoreBEl.textContent = match[2];
      statusEl.textContent = "연결됨\n마지막 수신: " + line;
    }

    async function startReading() {
      const decoder = new TextDecoderStream();
      port.readable.pipeTo(decoder.writable);
      reader = decoder.readable.getReader();

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        if (!value) continue;

        textBuffer += value;

        let newlineIndex;
        while ((newlineIndex = textBuffer.search(/\r?\n/)) !== -1) {
          const line = textBuffer.slice(0, newlineIndex).trim();

          // \r\n 처리용으로 다음 줄 시작 위치 계산
          const nextStart =
            textBuffer[newlineIndex] === "\r" && textBuffer[newlineIndex + 1] === "\n"
              ? newlineIndex + 2
              : newlineIndex + 1;

          textBuffer = textBuffer.slice(nextStart);

          if (line) {
            applyLineImmediately(line);
          }
        }
      }
    }

    connectBtn.addEventListener("click", async () => {
      try {
        if (!("serial" in navigator)) {
          statusEl.textContent = "이 브라우저는 Web Serial 미지원";
          return;
        }

        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });

        statusEl.textContent = "연결됨\n점수 대기 중...";
        startReading();
      } catch (e) {
        statusEl.textContent = "연결 실패: " + e.message;
        console.error(e);
      }
    });
  </script>
</body>
</html>
