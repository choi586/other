<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>두 팀 점수판</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    body {
      position: relative;
    }

    .topbar {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 20;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    button {
      font-size: 22px;
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    .board {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    .team {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .team-a {
      background: #1e3a8a;
    }

    .team-b {
      background: #991b1b;
    }

    .label {
      font-size: 4.5vw;
      font-weight: 700;
      margin-bottom: 2vh;
      letter-spacing: 0.08em;
    }

    .score {
      font-size: 22vw;
      font-weight: 800;
      line-height: 1;
    }

    .center-vs {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 4.5vw;
      font-weight: 800;
      background: rgba(0, 0, 0, 0.35);
      padding: 18px 28px;
      border-radius: 18px;
      z-index: 10;
    }

    .status {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 20;
      font-size: 18px;
      background: rgba(0, 0, 0, 0.45);
      padding: 12px 16px;
      border-radius: 12px;
      max-width: calc(100vw - 40px);
      word-break: break-all;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <button id="connectBtn">마이크로비트 연결</button>
  </div>

  <div class="board">
    <section class="team team-a">
      <div class="label">A TEAM</div>
      <div class="score" id="scoreA">0</div>
    </section>

    <section class="team team-b">
      <div class="label">B TEAM</div>
      <div class="score" id="scoreB">0</div>
    </section>
  </div>

  <div class="center-vs">VS</div>
  <div class="status" id="status">연결 안 됨</div>

  <script>
    const connectBtn = document.getElementById("connectBtn");
    const scoreAEl = document.getElementById("scoreA");
    const scoreBEl = document.getElementById("scoreB");
    const statusEl = document.getElementById("status");

    let port = null;
    let reader = null;
    let keepReading = false;
    let buffer = "";

    function updateStatus(message) {
      statusEl.textContent = message;
    }

    function parseScoreLine(line) {
      // 허용 예:
      // A:1,B:0
      // A: 1, B: 0
      // A:-3,B:12
      const match = line.match(/A\s*:\s*(-?\d+)\s*,\s*B\s*:\s*(-?\d+)/i);
      if (!match) return false;

      const a = Number(match[1]);
      const b = Number(match[2]);

      if (!Number.isNaN(a)) scoreAEl.textContent = String(a);
      if (!Number.isNaN(b)) scoreBEl.textContent = String(b);

      updateStatus(`연결됨\n마지막 수신: ${line}`);
      return true;
    }

    async function readLoop() {
      const decoder = new TextDecoderStream();
      const readableClosed = port.readable.pipeTo(decoder.writable);
      reader = decoder.readable.getReader();

      try {
        while (keepReading) {
          const { value, done } = await reader.read();
          if (done) break;
          if (!value) continue;

          buffer += value;

          // \n, \r\n 둘 다 처리
          const lines = buffer.split(/\r?\n/);
          buffer = lines.pop() ?? "";

          for (const rawLine of lines) {
            const line = rawLine.trim();
            if (!line) continue;
            parseScoreLine(line);
          }
        }
      } catch (error) {
        updateStatus(`읽기 오류: ${error.message}`);
        console.error(error);
      } finally {
        try {
          reader.releaseLock();
        } catch (_) {}
        try {
          await readableClosed;
        } catch (_) {}
      }
    }

    connectBtn.addEventListener("click", async () => {
      try {
        if (!("serial" in navigator)) {
          updateStatus("이 브라우저는 Web Serial을 지원하지 않음");
          return;
        }

        if (port) {
          updateStatus("이미 연결됨");
          return;
        }

        updateStatus("포트 선택 중...");
        port = await navigator.serial.requestPort();

        updateStatus("포트 여는 중...");
        await port.open({ baudRate: 115200 });

        keepReading = true;
        updateStatus("연결됨\n점수 대기 중...");
        readLoop();
      } catch (error) {
        updateStatus(`연결 실패: ${error.message}`);
        console.error(error);
      }
    });
  </script>
</body>
</html>
